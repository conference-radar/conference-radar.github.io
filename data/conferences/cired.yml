notes:
- The main international conference on electricity distribution networks, held every two years in odd years since 1971
- Industry heavy (DSOs, manufacturers, regulators); up to 3000 participants and an exhibition with over 140 companies
- Held in Europe (2017 Glasgow, 2019 Madrid, 2021 online, 2023 Rome, 2025 Geneva, 2027 Stockholm)
- Two-stage selection; abstract first, then a full paper of up to 5 pages for selected abstracts
- Most papers are presented as posters with guided poster tours; some are chosen for oral sessions
- Presented papers are published in the IET Digital Library and are available on IEEE Xplore, indexed in Scopus, Inspec and Ei Compendex
- Smaller CIRED workshops run in the even years
- Not listed in the CORE ICORE2026 portal and not on the CCF list
