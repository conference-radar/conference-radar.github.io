notes:
- Flagship annual conference of the IEEE Power & Energy Society, covering all topics in electric power and energy systems
- Conference papers are at most 5 pages; up to about 800 papers are accepted, most presented in the Monday evening poster session
- The top 60 to 80 papers are presented in Best Conference Paper Sessions; a few become Conference Prize Papers
- Accepted PES Transactions papers can also be presented; only their abstracts go into the proceedings
- Papers appear in IEEE Xplore only if presented at the meeting; one author registration covers up to 2 papers
- Held in North America every July (Montreal 2026, San Francisco 2027, Washington DC 2028, Milwaukee 2029)
- Not ranked by CORE (not listed in ICORE2026) or CCF
