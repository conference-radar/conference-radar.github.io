notes:
- INSTICC conference on medical imaging, microscopy and bioimage processing, including machine learning for bioimaging; one of the conferences of the BIOSTEC joint conference
- 2027 is the 14th BIOIMAGING, part of the 20th BIOSTEC
- Proceedings in the SCITEPRESS Digital Library (DOI via CrossRef), submitted for indexing by Scopus, DBLP, EI and Web of Science
- Selected revised and extended papers planned for a Springer CCIS book; best papers invited to a Springer Nature Computer Science special issue
- Two submission stages plus late-breaking and abstracts tracks; all deadlines AoE
- Held in Europe with BIOSTEC (Lisbon 2023, Rome 2024, Porto 2025, Marbella 2026, Valletta 2027)
- 2027 BIOSTEC runs at two venues, Valletta (Feb 19 to 21) and Nanjing, China (May 14 to 16); remote talks allowed only for Malta
- Co-located with ICORES, MODELSWARD and ICPRAM in 2027; registration gives free access to them
- Not listed in CORE ICORE2026
