notes:
- Hosted by Pulchowk Campus, Institute of Engineering, Tribhuvan University, Nepal; the site shows IEEE and IEEE SMC logos
- Proceedings in IEEE Xplore (2025 and 2026 volumes linked from the official site)
- Held in Coimbatore, India up to 2021 and in Nepal (Lalitpur, Kirtipur) since 2022 according to IEEE Crossref metadata
- Broad computing scope (AI, machine learning, cloud and edge computing, NLP, soft computing)
- Travel grants for selected best papers by IEEE student members
- Not related to the ICICT held in London (icict-london); not listed in ICORE2026 or the CCF list
