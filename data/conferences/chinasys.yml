notes:
- Community workshop of the ACM SIGOPS China Chapter, held twice a year (spring and winter) since 2011
- Host universities rotate around China; 2026 Spring in Xi'an (Northwest University and SJTU), 2026 Winter in Changsha (NUDT and Central South University)
- Submissions through HotCRP with a program committee; work already published elsewhere, work in progress, demos and industry reports are all accepted
- Accepted work is presented as oral talks or spotlight posters; no proceedings are published
- Program mixes invited keynotes, paper sessions, demos and an industry forum; talks in Chinese and English
- Covers operating systems, storage, distributed and cloud systems, databases, ML systems, HPC, networking, architecture and system security
- Not in the CORE ICORE2026 portal or the CCF 2026 list
