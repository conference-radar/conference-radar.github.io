notes:
- Workshop of PPAM (International Conference on Parallel Processing and Applied Mathematics), held every two years with PPAM
- 8th edition in 2026 at PPAM 2026 in Poznan, Poland; earlier editions in Torun 2011, Warsaw 2013, Krakow 2015, Lublin 2017, Bialystok 2019, Gdansk 2022 and Ostrava 2024
- Covers hybrid and hierarchical parallel algorithms, multi-core, many-core and GPU computing, autotuning, scheduling, HPC cloud, edge and fog computing, RISC-V
- Organized by Giuliano Laccetti, Marco Lapegna (University of Naples Federico II), Raffaele Montella (University of Naples Parthenope) and Diego Romano (CNR), Italy
- Papers up to 15 pages in LNCS style via EasyChair, following PPAM rules
- Presented papers appear in the PPAM post-proceedings in Springer LNCS
- Extended versions can go to a special issue of The Journal of Supercomputing
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
