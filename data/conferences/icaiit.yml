links:
  website: https://icaiit.org/
notes:
- Run by Anhalt University of Applied Sciences; held once a year in March in Koethen, Germany, since 2013
- One-day conference; in-person attendance and presentation are mandatory, no online talks
- Papers appear in the conference's own open access proceedings journal (ISSN 2199-8876); the April issue holds the conference papers
- The same journal also runs publication-only issues and special issues for other conferences
- Double-blind review; papers up to 7 pages in the ICAIIT template
- Broad scope covering networks, embedded systems, security, AI, automation and energy, plus IT applied in other fields
- Not listed in the CORE ICORE2026 portal; no CCF rank set
