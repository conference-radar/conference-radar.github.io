notes:
  - Workshop on the interplay of computational social choice (voting, fair division, mechanism design, matching) and machine learning
  - 1st edition at AAMAS 2024 (Auckland), 2nd at IJCAI 2025 (Montreal), 3rd at IJCAI-ECAI 2026 (Bremen)
  - Full papers up to 7 pages and extended abstracts up to 3 pages plus references, IJCAI format; anonymization optional
  - Papers are posted online but there are no formal proceedings (non-archival)
  - Not the Scala programming language workshop (scala-workshop)
  - Fully in person; one-day workshop
  - Not listed in ICORE2026 and not on the CCF list
