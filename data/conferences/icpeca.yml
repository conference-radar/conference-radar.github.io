links:
  website: http://www.icpeca.org/
notes:
- Annual since 2021 and held in late January; the 2027 edition (7th) is in Shenyang, China, in collaboration with the IEEE Harbin Section
- Three tracks covering energy and power engineering, electronic engineering and computer applications
- 2021 to 2023 proceedings are in IEEE Xplore (216, 262 and 344 accepted papers) and indexed in EI Compendex
- Papers of 4 to 6 pages in IEEE format, 50 USD per extra page; virtual presentation offered
- Same conference secretariat contact as ICPICS
- Not listed in CORE ICORE2026
