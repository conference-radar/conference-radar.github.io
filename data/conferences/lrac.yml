notes:
- Full-day satellite workshop of IEEE ICASSP on low-resource neural speech codecs (compute, bitrate and latency limits under real-world noise and reverberation)
- Run by Cisco Systems researchers with academic partners from CMU, UIUC and the Hebrew University of Jerusalem; sponsored by the IEEE SPS SLTC and AASP technical committees
- Linked to the LRAC Challenge; challenge system papers go to the archival track
- Archival track papers follow the ICASSP format, are peer reviewed and published in the ICASSPW proceedings in IEEE Xplore if presented by a registered author
- Non-archival track (works in progress, published work, demos) is presented at the workshop and featured on the website only
- First edition in 2026; the organizers say a next edition is in preparation
- Not listed in ICORE2026 or the CCF list
