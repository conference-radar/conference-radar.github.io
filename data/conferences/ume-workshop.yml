id: ume-workshop
name: U&ME
full_name: Workshop and Challenge on Unlearning and Model Editing
type: workshop
tier: minor
areas: [ai, vision, security]
region: worldwide
language: english
frequency: annual
organizer: Workshop organizing committee (Sapienza University of Rome, IIT Jodhpur, Meta AI, Michigan State University and others); co-located with ECCV / ICCV
organizer_country: [europe, india, usa]
proceedings: ECCV / ICCV Workshops proceedings (archival full papers)
archival: true
typical:
  deadline_months: [7]
  conference_months: [9, 10]
links:
  website: https://sites.google.com/view/u-and-me-workshop/
notes:
  - Workshop and challenge on machine unlearning and model editing for vision and generative models
  - 1st edition with ECCV 2024 (Milan), 2nd with ICCV 2025 (Hawaii), 3rd with ECCV 2026 (Malmo)
  - Full papers (14 pages in LNCS style for ECCV 2026, 8 pages for ICCV 2025) appear in the workshop proceedings
  - Non-archival papers up to 4 pages are presented but not published
  - Submission through OpenReview; half-day workshop with a challenge track
  - Different from the MUV, STMUS and WIPE-OUT unlearning workshops
  - Not listed in ICORE2026 or the CCF list
