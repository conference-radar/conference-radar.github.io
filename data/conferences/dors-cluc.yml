notes:
- Croatian open source developer and DevOps practitioner conference, described as "From the community, for the community"
- 31st edition held April 24-25, 2026 at Algebra Bernays University, Zagreb, Croatia
- Talks chosen through a call for speakers; all talks must be on an open source topic (hardware, software, policy or philosophy)
- Four tracks in 2026 -> modern development and architecture, DevOps and infrastructure and security, community and policy and free software, OpenStreetMap
- Talks may be recorded and released under CC BY-SA 4.0; no papers or proceedings
- The conference does not cover speaker travel or accommodation unless stated otherwise
