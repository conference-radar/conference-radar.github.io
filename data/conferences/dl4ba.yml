notes:
- Workshop at the IEEE International Conference on Big Data (IEEE BigData)
- 1st edition at BigData 2025 (Macau, workshop held online), 2nd at BigData 2026 (Phoenix, hybrid)
- Topics include deep biometric features, spoofing and deepfake detection, multimodal and soft biometrics, and biometric security and privacy
- Full papers up to 10 pages, short papers 5 to 7 pages, IEEE two-column format, submitted via the BigData CyberChair system
- Accepted papers appear in the IEEE BigData workshop proceedings in IEEE Xplore; one full registration per paper required
- Program committee mostly from France and Algeria
- Not listed in ICORE2026 or the CCF list
