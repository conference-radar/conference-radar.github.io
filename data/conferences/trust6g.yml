notes:
- Half-day workshop (WS10) at IEEE ICC 2026 on trustworthy 6G (secure-by-design architectures, ISAC and physical-layer security, AI/ML threats, privacy, testbeds)
- Co-chaired by Zhongxiang Wei (Tongji), Christos Masouros (UCL), George C. Alexandropoulos (Athens), Kaitao Meng (Manchester) and Nanchi Su (HIT Shenzhen); steering committee includes Athina Petropulu and A. Lee Swindlehurst
- First edition at ICC 2026 in Glasgow (19 papers in the program); not in the ICC 2025 or GLOBECOM 2025 workshop lists
- Workshop papers go into the ICC proceedings and IEEE Xplore; no-show papers are removed
- Not listed in ICORE2026 or in the CCF 2026 list
