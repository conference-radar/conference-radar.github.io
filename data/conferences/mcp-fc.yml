notes:
- Affiliated workshop of Financial Cryptography and Data Security (FC); 1st edition at FC 2027 in Barbados
- Scope covers blockchain consensus with many concurrent block proposers, censorship resistance, MEV, transaction fee
  mechanisms and threshold encryption for mempool privacy
- Program chairs from industry and academia (Category Labs, Sei Labs and University of Portsmouth, Anza, Mysten Labs
  and UCL)
- Two submission types, papers (15 pages, LNCS format, anonymous) and talks (4 pages, not anonymous)
- Accepted papers appear in the workshop proceedings; talks are non-archival
- Submission via EasyChair; all deadlines AoE
