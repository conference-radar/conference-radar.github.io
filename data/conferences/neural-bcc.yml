notes:
- Workshop on neural fields and Gaussian splatting for non-RGB sensors (lidar, thermal, event cameras, cryo-EM, sonar, radar) and physics-based light transport
- 1st edition at ECCV 2024, 2nd edition at CVPR 2025 (Nashville); moves between the major vision conferences
- Non-archival; papers are not part of the ECCV or CVPR proceedings, and already published work may be presented
- 2024 submissions via OpenReview; all accepted papers get a poster and a few are chosen as spotlight talks
- Not listed in ICORE2026 or the CCF list
