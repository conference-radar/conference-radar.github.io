notes:
- Community conference on IT security and related fields in Umeå, Sweden, part of the global Security BSides community
- Run by the Academic Computer Club (accum.se) in Umeå; held at Umeå University
- Held every June since 2023; the 2027 edition is the fifth
- Talks in English for an international audience; call for abstracts runs on the event's Indico site with staged acceptance rounds
- Talks only, no proceedings
