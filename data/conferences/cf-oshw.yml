notes:
- Workshop on open-source hardware co-located with the ACM International Conference on Computing Frontiers (CF)
- Topics include open-source processors, memory and I/O, EDA tools, FPGA and ASIC design, firmware, compilers, verification, energy efficiency and hardware security
- Papers up to 4 pages in the double-column ACM format, with a link to a public repository (for example GitHub)
- Double-blind review; accepted papers appear in the ACM Digital Library together with the CF papers
- At least one author needs a full CF registration and papers are presented in person
- 2026 was the 4th edition, held with CF'26 in Catania, Italy
- Not listed in the ICORE2026 portal or the CCF 2026 list
