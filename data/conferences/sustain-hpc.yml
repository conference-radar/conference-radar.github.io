notes:
- Half-day workshop on sustainable and green computing for HPC and distributed systems, held with ICPP 2026 in Singapore
- Long papers up to 10 pages and short or work-in-progress papers up to 6 pages, including references, ACM format
- Single-blind review through HotCRP; at least three reviews per long paper and two per short paper
- Accepted papers published in the ACM ICPP Workshops proceedings
- Four peer-reviewed papers presented in 2026, alongside two keynotes and two invited talks
- No earlier edition is listed on the workshop page
- Not listed in CORE ICORE2026
