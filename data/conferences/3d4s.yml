notes:
- Workshop on 3D and 4D geometry generation and modeling for scientific simulation and design, also called 3D4Science
- Started at WACV 2024, then CVPR 2026 (about 150 attendees, 21 submissions) and CVPR 2027 (3rd edition)
- 2027 theme is Agentic 3D/4D Modeling for Scientific Simulation and Design
- Regular papers of 4 to 8 pages in CVPR style, double-blind review on OpenReview
- Non-archival; accepted papers are posted on OpenReview with author consent and do not appear in IEEE/CVF proceedings
- Not listed in ICORE2026 or the CCF list
