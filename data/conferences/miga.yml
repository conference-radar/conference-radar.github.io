organizer: University of Oulu (Guoying Zhao, Haoyu Chen) with Imperial College London, TUM, Stanford and others; co-located with IJCAI
organizer_country: [europe]
proceedings: Springer CCIS (2026); CEUR-WS (2023 to 2025)
archival: true
typical:
  deadline_months: [5, 6]
