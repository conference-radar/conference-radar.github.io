links:
  website: https://ei-miga.github.io/
notes:
- IJCAI workshop and challenge on micro-gesture and behavior-based emotion understanding, started as Micro-gesture Analysis for Hidden Emotion Understanding (MiGA 2023, 2024)
- Challenge tracks on Kaggle using the SMG and iMiGUE micro-gesture datasets
- 2023 to 2025 proceedings in CEUR-WS (2025 is Vol-4168); 2026 proceedings in Springer CCIS volume 3120
- 2026 edition renamed the First Joint Workshop on Human Behavior Analysis and Interaction for Emotional Intelligence (EI-MiGA), with the 4th MiGA Challenge
- Full papers at least 7 pages, short papers 4 to 6 pages, position papers 2 pages; single-blind review
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
