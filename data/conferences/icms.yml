links:
  website: https://icms-conference.org/
notes:
- Forum for the development of mathematical software (computer algebra, proof assistants, numerical and symbolic software)
- Proceedings published with Springer since 2006; 2026 papers in Springer LNCS
- Mostly session-based; a short abstract to a session chair is required to give a talk, extended abstracts or short papers (6 to 8 pages, up to 10) go to the proceedings
- Biennial in recent years (2014, 2016, 2018, 2020, 2024, 2026); held in Europe, North America and East Asia
- About 150 participants, 3 to 4 plenary talks and several parallel sessions
- ICMS 2026 was a satellite meeting of the International Congress of Mathematicians in Philadelphia
- Not listed in the ICORE2026 portal or the CCF 2026 list
