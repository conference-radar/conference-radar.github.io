notes:
- Annual practitioner conference run by the security company SpecterOps on adversary tradecraft, identity security and attack path management
- Two days of talks followed by four days of SpecterOps training courses
- 2027 edition at Convene, Arlington, Virginia, near Washington DC; federal attendees may attend free subject to agency ethics approval
- Call for presentations via Sessionize; talks are archived on YouTube
- Vendor-run, similar in kind to LABScon
- No published proceedings (non-archival)
- Not listed in the CORE ICORE2026 portal
