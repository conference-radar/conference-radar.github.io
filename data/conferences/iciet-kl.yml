notes:
- Organized by Ilahia College of Engineering and Technology (ICET), Muvattupuzha, Kerala, India
- Technically co-sponsored by the IEEE Kerala Section
- Accepted and presented papers submitted to IEEE Xplore; the 2023 edition is in Xplore (DOI 10.1109/ICIET57285.2023)
- Held in person at the college
- Double-blind review by at least two reviewers via Microsoft CMT
- Broad engineering scope (AI and data science, IoT, robotics, VLSI, 5G/6G and signal processing, power electronics, cyber security)
- Editions in 2023 (1st) and 2026 (2nd)
- Not listed in ICORE2026; not on the CCF list
