notes:
- Workshop on sustainability of computing systems held within the ACM International Conference on Computing Frontiers (CF)
- Topics include life cycle assessment of computing systems, carbon footprint, sustainable architectures and software, ecodesign, repair and reuse
- Short papers up to 4 pages and long papers up to 8 pages; double-blind review
- Accepted papers are published in the ACM Digital Library
- One registration and in-person attendance required per accepted paper
- 2026 edition held on May 19, 2026 at CF'26 in Catania, Italy
- Different from other workshops abbreviated SCW
- Not listed in the ICORE2026 portal or the CCF 2026 list
