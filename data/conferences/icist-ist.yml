notes:
- Not the same venue as the International Conference on Information Science and Technology (icist)
- Smaller conference; secretariat contact via a yeah.net address and submission via EasyChair
- "Editions: London 2018, Durham (UK) 2019, online 2021 and 2022, then a gap until Nanjing 2026 and 2027"
- 2018 to 2022 proceedings published by ACM; the 2026 call for papers says proceedings by IEEE, submitted to IEEE Xplore
- Double-blind review stated; full papers at least five pages, extra charge above six
- Tracks on AI and machine learning, big data, robotics, HCI, intelligent healthcare and smart cities
- Not listed in the CORE portal (ICORE2026)
