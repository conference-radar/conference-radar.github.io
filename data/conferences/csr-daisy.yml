notes:
- Workshop of the IEEE International Conference on Cyber Security and Resilience (IEEE CSR); first edition in 2026 in Lisbon, in person only
- Chaired by Aikaterini Kanta and Tijana Markovic (University of Portsmouth, UK); supported by the ENSURE-6G project
- Topics include secure and privacy-preserving distributed and federated AI, decentralised learning for IoT, edge and 5G/6G networks, AI-driven intrusion detection and forensics
- Workshop papers go into the IEEE CSR proceedings in IEEE Xplore; 6 pages plus up to 2 extra pages with overlength charges
- Small workshop; 4 papers in one session (WS1) on Monday 3 Aug 2026
- In 2026 the CSR CSAIP workshop program was merged into DAISY
- Deadline was extended by one month in 2026 (Apr 13 -> May 13)
- Not listed in CORE ICORE2026 or the CCF list
