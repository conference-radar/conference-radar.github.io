links:
  website: https://qcomp.org/rrrr/2027/
notes:
- Satellite workshop of ETAPS since 2022 (editions 2022 to 2025, then 2027; no 2026 edition)
- Reproducibility and replication studies in formal methods and software engineering, including artifact evaluation and tool competitions
- Accepted submissions are informally published on the RRRR website (non-archival)
- Presentation abstracts (about 2 pages) and short papers (about 6 pages), LNCS style, submitted via OpenReview; in-person presentation required
- Authors may be invited to an STTT special issue with full journal review
- Not listed in ICORE2026 (portal search returns no results) or the CCF 2026 list
