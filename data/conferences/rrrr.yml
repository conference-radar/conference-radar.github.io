language: english
frequency: annual
organizer: RRRR organizers (Arnd Hartmanns, Sean Kauffman), ETAPS satellite workshop
organizer_country: [europe, canada]
proceedings: Workshop website (informal publication, non-archival)
archival: false
typical:
  deadline_months: [2, 3]
