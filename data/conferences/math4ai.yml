notes:
  - AAAI workshop on mathematical foundations of AI (approximation theory, optimization, math-inspired architectures, theory of AI agents)
  - First held at AAAI-26 in Singapore (26 January 2026); second edition at AAAI-27 in Montreal on Monday 22 February 2027
  - Short or poster papers up to 4 pages and long papers up to 7 pages, excluding references and appendix, AAAI format, via OpenReview
  - Single-blind peer review; all accepted papers presented as posters, a few selected for oral talks; best paper awards
  - Non-archival; papers hosted on the workshop website
  - Not listed in ICORE2026 or the CCF list
