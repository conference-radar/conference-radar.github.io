id: micrads
name: MICRADS
full_name: Multidisciplinary International Conference of Research Applied to Defense and Security
type: conference
tier: minor
areas: [security, ai, networking]
region: latin-america
language: mixed
frequency: annual
organizer: ITMA (Information and Technology Management Association) with a host military or defense university each year
proceedings: Springer SIST (English papers); RISTI special issue (Spanish and Portuguese papers)
archival: true
typical:
  deadline_months: [4]
  conference_months: [8]
links:
  website: https://www.micrads.org/
notes:
- Annual since 2018, held mostly in Latin America (Cartagena 2021, Barranquilla 2022, Bogota 2023, Santiago 2024, Orlando 2025, Guayaquil 2026)
- Organized by ITMA with military academies and defense universities as partners (ESPE and ESMENA, Ecuador, hosted 2026)
- English papers published by Springer in the Smart Innovation, Systems and Technologies (SIST) series; Spanish and Portuguese papers go to a RISTI special issue
- Three tracks covering cybersecurity and cyberdefense, defense strategy and policy, and engineering and AI applied to defense
- Double-blind review by at least two reviewers; papers accepted as oral or poster
- Not listed in ICORE2026 or the CCF 2026 list
