notes:
- Long-running workshop on trust, reputation, deception and privacy in multi-agent systems and human-agent interaction, earlier called Trust in Agent Societies
- 2025 was the 23rd edition, co-located with IJCAI 2025 in Montreal; the 22nd was TRUST 2021
- Proceedings in CEUR-WS (earlier editions in CEUR-WS Vol-1740, Vol-1578, Vol-3022)
- Papers of 10 to 14 pages excluding references in CEURART style, submitted via EasyChair
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
