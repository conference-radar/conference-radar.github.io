notes:
- Organized by IARIA as part of the SoftNet congress, co-located with ICSEA, ICSNC, VALID, SIMUL, SOTICS, INNOV and AISyS (20th edition in 2027)
- Covers user-centric and personalized technologies and services
- Published open access in the IARIA ThinkMind library (ISSN 2308-3492); prints via Curran Associates; selected papers invited to IARIA journals
- Onsite and online participation options offered in 2026
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Held in southern Europe (Barcelona, Lisbon, Valencia, Venice, Porto in recent years)
