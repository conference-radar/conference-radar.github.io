notes:
- Half-day workshop on Python in HPC and science (packaging, accelerated computing, distributed workflows, parallelization, AI and agentic workflows, profiling), held with SC
- Held with SC every year since SC23
- Invited talks, panels and live demos; the call asks for a short abstract, a presentation description of up to 500 words and an optional demo video on Zenodo
- Submissions go through the SC submissions portal
- Accepted submissions do not appear in the SC proceedings; they are linked from the HPPSS website and GitHub
- Not listed in CORE ICORE2026
