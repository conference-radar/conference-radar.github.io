notes:
- Workshop on human-centered use of AI, LLMs and generative AI in requirements engineering (trust, oversight, explainability, workforce change)
- 1st edition held on August 17, 2026 with IEEE RE 2026 in Montreal, Canada; follows RE, which rotates worldwide
- Research papers 6 to 8 pages, experience reports 4 to 6 pages, vision papers 4 pages, IEEE format
- Each paper reviewed by at least two program committee members; submitted via EasyChair in the RE workshops track
- Accepted papers appear in the RE 2026 workshop proceedings in the IEEE Digital Library
- Not listed in the ICORE2026 portal or the CCF 2026 list
