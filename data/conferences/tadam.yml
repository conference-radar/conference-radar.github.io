notes:
- One-day workshop on building, modeling and analyzing timing-predictable embedded processors (predictable hardware, WCET analysis, HW/OS co-design)
- First edition in 2026 at CPS-IoT Week in Saint-Malo, France
- No formal proceedings with DOIs; meant as a platform to advertise past or present work and start collaborations
- Full papers up to 6 pages or 2-page vision/position papers (previously published results allowed), IEEE format, via HotCRP
- Not listed in CORE ICORE2026 and not on the CCF 2026 list
