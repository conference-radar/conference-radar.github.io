notes:
- Workshop series of the IEEE SPS Data Science Initiative; the 2027 edition is a one-day ICASSP 2027 satellite on Data Science and AI for Mental Healthcare Across the Lifespan
- Endorsed by the IEEE Brain and IEEE AgeTech initiatives
- Full papers follow the ICASSP 2027 style and length and appear in the ICASSP 2027 proceedings on IEEE Xplore
- A poster session takes last-minute abstract-only contributions, which do not appear in IEEE Xplore
- Paper deadline extended to 25 Nov 2026
- Not listed in ICORE2026 or the CCF list
