notes:
- Workshop on AI for network and distributed system security (intrusion detection, zero trust, IoT and edge security,
  adversarial robustness); 3rd edition in 2027
- Accepted AINA workshop papers are published in the AINA proceedings in Springer LNDECT
- Papers up to 10 pages in Springer LNCS style, submitted through the AINA EDAS system
- At least one author must register and present (in person or remotely), otherwise the paper is removed after the conference
- Location follows AINA (Barcelona 2025, Wellington 2026, Tirana 2027); hybrid
- Not listed in ICORE2026; not on the CCF 2026 list
