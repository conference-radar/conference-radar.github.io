notes:
- Workshop on using social choice theory (preference aggregation, mechanism design, preference elicitation) for AI alignment, ethics and safety
- Chaired by Wesley Holliday (UC Berkeley); organizers include Vincent Conitzer (CMU)
- "Host changes each year: 2023 UC Berkeley, 2024 ECAI, 2025 AAMAS, 2026 IASEAI'26 (Paris), 2027 AAAI-27 (Montreal)"
- Non-archival; previously published and concurrently submitted work is welcome
- Full papers 6 to 8 pages and short papers 2 to 4 pages in AAAI format; anonymization optional
- Not listed in ICORE2026 and not on the CCF list
