notes:
  - AAAI workshop on machine ethics, AI alignment and infrastructure for human-AI co-existence
  - Third workshop of the series at AAAI, after Post-Singularity Symbiosis (AAAI-25) and Machine Ethics, from formal methods to emergent machine ethics (AAAI-26)
  - Supported by the AI Alignment Network and CHAIN, Hokkaido University
  - 2027 accepted papers are published in workshop proceedings on CEUR-WS
  - Full papers up to 9 pages and extended abstracts up to 4 pages in AAAI-27 format; double-blind review on Microsoft CMT
  - Fast track for papers rejected from AAAI-27, submitted with their AAAI reviews and a response letter
  - "Acceptance rate: 48% (2026, 11/23)"
  - In person only; at least one author must register and present
