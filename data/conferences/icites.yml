region: china
language: english
frequency: annual
organizer: Hangzhou International Innovation Institute of Beihang University (2026 sponsor) with Zhejiang Sci-Tech University and UESTC; earlier editions hosted by UESTC with IEEE CEDA Chengdu Section and IEEE EDS Chengdu Chapter
organizer_country: [china]
proceedings: IEEE Xplore
