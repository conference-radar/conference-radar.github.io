notes:
- Covers intelligent embedded systems, processors, AI accelerators, edge computing, IoT, cyber-physical systems, dependable AI and embedded security
- Held since 2021 (virtual 2021 and 2022, Huzhou 2023, Chengdu 2024, Huzhou 2025, Hangzhou 2026)
- Proceedings of all editions 2021 to 2025 are in IEEE Xplore, indexed in EI Compendex and Scopus
- Listed in the IEEE conference calendar (conference 71818 for 2026)
- Selected extended papers recommended to journals such as Journal of Systems Architecture and Sustainable Computing
- Submission through EasyChair; bilingual Chinese and English site
- Not listed in CORE ICORE2026 or the CCF list
