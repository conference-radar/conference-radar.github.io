notes:
- Broad computer and information science conference held in China every year since 2018 (Daqing, Zhangjiajie, Guangzhou, Lanzhou, Chongqing, Hangzhou, Kunming, Chengdu)
- The publisher changes between editions; the 2024 and 2025 proceedings are in IEEE Xplore
- Hybrid format with on-site and online sessions
- The 2025 edition reported over 200 submissions and 116 poster presentations
- Not listed in CORE ICORE2026 or the CCF list
