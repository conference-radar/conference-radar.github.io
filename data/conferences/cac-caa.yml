notes:
- Flagship annual congress of the Chinese Association of Automation, founded in 2009 and held in more than ten Chinese cities
- Covers automation, information and intelligent science and technology
- Accepts English papers (IEEE templates) and Chinese papers, plus long abstracts; submissions via review.cacpaper.com
- 2026 edition was held with the 65th anniversary of the CAA at the Capital International Convention and Exhibition Center, Beijing
- The 2026 submission deadline was extended twice, finally to August 1
- Different from CCC (Chinese Control Conference) and CCDC (Chinese Control and Decision Conference)
- Not listed in the CORE ICORE2026 portal
