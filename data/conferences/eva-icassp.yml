notes:
- Full-day satellite workshop of IEEE ICASSP 2027 on evaluating speech-based agentic systems (turn-taking, task success, LLM-as-judge, user simulation)
- Archival papers are published in IEEE Xplore; a non-archival track is presented at the workshop only
- Papers follow the ICASSP 2027 format
- Also takes non-archival demo submissions (deadline 11 Nov 2026)
- Paper deadline postponed from 11 Nov to 18 Nov 2026; all deadlines AoE
- Not listed in ICORE2026 or the CCF list
