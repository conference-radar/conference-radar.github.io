notes:
- Annual international meeting on electron devices run by the IEEE EDS Kansai Chapter, endorsed by JSAP and the IEICE technical committees on electron devices and silicon devices
- Held every November in Kyoto, recently at Ryukoku University Fukakusa Campus (Jojukan), in hybrid format
- Oral papers are 2 pages and are published in IEEE Xplore; poster papers are 2 pages but stay internal to the meeting
- All submissions are reviewed by the committee; students are welcome to submit oral or poster papers
- Low cost and student friendly; best paper and student paper awards
- Contributed talks must be given on site; invited talks may be online
