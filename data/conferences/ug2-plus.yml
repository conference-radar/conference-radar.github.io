notes:
- CVPR workshop and prize challenge on image restoration and recognition under adverse conditions (weather, turbulence)
- 8th edition at CVPR 2026 in Denver; the 7th edition was at CVPR 2024 (no 2025 edition found)
- 2026 tracks on all-weather image restoration, semantic segmentation in adverse weather, and dynamic object segmentation in turbulence, run on Codabench
- In 2026 participation was through the challenge; teams submitted challenge result papers to arXiv and winners shared about 10K USD in prizes
- The 2026 workshop does not appear in the CVF Open Access CVPR 2026 Workshops proceedings
- Not listed in ICORE2026 or the CCF list
