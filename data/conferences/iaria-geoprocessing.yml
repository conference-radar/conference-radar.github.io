notes:
- Organized by IARIA as part of the DigitalWorld congress, co-located with ICDS, ACHI, eTELEMED, eLmL, eKNOW and other IARIA events (19th edition in 2027)
- Covers GIS, geo-AI, big geo-data, spatial data quality, remote sensing and location-based services
- Published open access in the IARIA ThinkMind library (ISSN 2308-393X); prints via Curran Associates; selected papers invited to IARIA journals
- Not ranked by CORE; IARIA events are generally regarded as low-selectivity
- Held in southern Europe (Venice 2026, Lisbon 2027); IARIA deadlines are often extended
