notes:
- Optica conference and exhibition on quantum technologies
- Topics include quantum computing, quantum networking and communications, quantum networking devices, quantum sensors and metrology, and the quantum ecosystem
- "Submission format: 35-word abstract plus a 2-page summary for the Technical Digest, peer reviewed"
- Accepted and presented papers are published on the Optica Publishing Group platform and indexed in Ei Compendex, Scopus and Google Scholar
- Held in Europe or North America (Rotterdam 2024, San Francisco 2025, Glasgow 2026, Copenhagen 2027)
- Co-located with the Optica Quantum Executive Forum in 2027
- Physics and photonics venue rather than computer science; not listed in ICORE2026
