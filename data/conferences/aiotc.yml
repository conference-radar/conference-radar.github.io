notes:
- Annual since 2022 and held in China (Wuhan 2024, Guilin 2025, Nanchang 2026 and 2027)
- Covers AI, the Internet of Things and cloud computing
- Proceedings published by IEEE (IEEE Xplore records for 2025 and 2026), submitted to EI Compendex and Scopus
- Run by a commercial conference service with a host university; East China Jiaotong University supports the 2027 edition
- Small program (4 keynotes and 18 oral talks in 2026)
- Not listed in CORE ICORE2026
