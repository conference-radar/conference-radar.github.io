notes:
- Sponsored by the IEEE Electronics Packaging Society; leading conference on thermal and thermomechanical issues in electronic devices, packages and systems
- Held together with ECTC, with discounted joint registration (Orlando 2026, Denver 2027)
- Two-step submission; a 500-word abstract in September, then a draft paper (5 to 8 pages, at most 10) in January for peer review
- All papers are peer reviewed and published in the ITherm proceedings on IEEE Xplore
- About 220 technical papers and presentations in five tracks in 2026; the 2026 meeting was the 25th conference
- Student first authors can apply for travel grants; also has a cold plate design competition and student poster session
- Not ranked by CORE (not listed in ICORE2026) or CCF
