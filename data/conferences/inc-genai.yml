notes:
- WS-06 at IEEE GLOBECOM 2026 in Macau, a short session (14:00 to 15:30) on 7 December 2026 with five papers
- Listed as INC-GenAIatWirelessEdge on the GLOBECOM workshop list
- Topics are edge LLM and multimodal inference over wireless networks (prefill and decoding, KV-cache management, model placement, split computing, network slicing for AI services)
- Co-chairs Tan Li (Hang Seng University of Hong Kong), Shenghui Song (HKUST) and Cong Shen (University of Virginia); steering committee Yuguang Fang, Zhiguo Ding and Jun Zhang
- Accepted and presented papers go into the IEEE GLOBECOM 2026 Conference Proceedings and IEEE Xplore; no-show papers can be removed
- Submissions via EDAS through the GLOBECOM workshop call
- Not listed in ICORE2026
