notes:
- Workshop organized by the IEEE VTS Propagation Committee and held with IEEE VTC; the VTC2027-Spring page says it builds on an established VTC workshop series
- Held as W13 at VTC2026-Fall (Boston) and W4 at VTC2027-Spring (Hamburg), the latter subtitled From Measurements to Digital Twins
- Covers channel measurement and modeling (stochastic, geometry-based and ray-tracing models), channel sounding and emulation, and channels for road vehicles, trains, UAVs, aviation, ships and satellites
- Organizers from University of South Carolina, Beijing Jiaotong University and TU Wien, DLR, Universidad Autonoma de San Luis Potosi and Tongji University
- Not the same as the IEEE GLOBECOM 6G channel models workshop (chmodels-6g)
- VTC papers are 5 pages (up to 2 extra pages at 100 USD each), submitted through the VTC workshops TrackChair site
- VTC papers go to IEEE Xplore and may be removed if not presented at the conference
- Not listed in ICORE2026
