notes:
- Two-day cybersecurity conference with an all-women speaker line-up; all attendees are welcome
- Run by WICCA, a Dutch women in cybersecurity community of 1500+ members that meets monthly
- Held at De Lichtfabriek in Haarlem, Netherlands, since at least 2025; editions listed since 2023
- 2025 edition had 27 speakers and about 400 attendees according to the organizers
- Topics range from policy, pentesting and forensics to human behaviour and legacy systems
- Several ticket types (Standard, Familiar, Supporter, Business)
- No proceedings
