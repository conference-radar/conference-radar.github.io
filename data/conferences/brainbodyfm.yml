notes:
- NeurIPS workshop on foundation models for neural and physiological signals (EEG, fMRI, invasive electrophysiology and BCI, wearables) and embodied intelligence
- 1st edition at NeurIPS 2025 (San Diego), 2nd at NeurIPS 2026 (Sydney)
- Non-archival; accepted papers are posted on OpenReview and the workshop website and may be submitted elsewhere
- Papers up to 5 pages excluding references and appendices in a modified NeurIPS style, double-blind review on OpenReview
- Separate call for demos and travel awards
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
