notes:
- Fully online conference on computational methods, software engineering and AI; 10th edition in 2026
- Run on the OpenPublish platform (organising committee chair Radek Silhavy), sister event of CSOC
- Held under the auspices of the Faculty of Electrical Engineering, West Pomeranian University of Technology, Szczecin, Poland
- Proceedings in Springer Lecture Notes in Networks and Systems (LNNS), several volumes per year (7 volumes for 2026)
- Site states indexing in Scopus and Web of Science CPCI-S
- Deadlines are usually extended; no travel cost
- Not listed in CORE ICORE2026 and not on the CCF list
