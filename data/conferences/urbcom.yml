notes:
- Co-located workshop of IEEE DCOSS-IoT; not the KDD UrbComp workshop (urbcomp)
- Papers appear in the same volume as the DCOSS-IoT proceedings (IEEE Xplore)
- Chairs mostly from Brazilian universities (Campinas, Ouro Preto) plus Toronto and INRIA
- 8 pages including references, IEEE two-column format
- Best papers invited to submit extended versions to the Journal of Internet Services and Applications
- Online in 2020 to 2022; 2023 Coral Bay, Cyprus; 2024 Abu Dhabi, 2025 Lucca, 2026 Reykjavik, 2027 Montreal
- Not listed in ICORE2026 or the CCF list
