notes:
- ML workshop on learning-based sampling from unnormalized distributions, Bayesian inference, optimal transport and control, and applications in the natural sciences
- Held at ICLR 2025 in Singapore and NeurIPS 2025 in San Diego (2nd edition)
- Non-archival with no official proceedings; papers under review elsewhere are accepted
- Research, Challenges and Reflections, and Benchmarks and Datasets tracks (4 to 8 pages) plus Tiny Papers (2 pages), double-blind review on OpenReview
- Not listed in ICORE2026 or the CCF list
