notes:
- Workshop on semiconductor device reliability; originated in 1982 as the Wafer Level Reliability Workshop and renamed in 1993
- Covers device, memory, circuit and system reliability, wafer-level testing, ESD, failure analysis and power electronics (SiC, GaN) reliability
- Submission is a 2-page extended abstract; accepted authors write a final paper, with a mentor assigned to each paper
- Accepted papers are published in the IIRW proceedings on IEEE Xplore
- The best five papers are invited to a special issue of IEEE Transactions on Device and Materials Reliability (TDMR)
- Informal retreat format at the Stanford Sierra Conference Center, Fallen Leaf Lake near South Lake Tahoe; the fee includes lodging and all meals
- Late news papers (4 pages, camera-ready) are accepted in September
- Not ranked by CORE (not listed in ICORE2026) or CCF
