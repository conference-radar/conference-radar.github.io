notes:
- Challenge workshop on monocular depth estimation evaluated on the SYNS-Patches dataset with dense LiDAR ground truth (leading metric F-Score)
- Editions at WACV 2023, CVPR 2023, CVPR 2024 and CVPR 2025 (4th)
- No open call for papers; teams submit predictions on CodaLab plus a method description, and a paper summarizing the challenge results is published in the CVPR Workshops proceedings
- Selected top teams are invited to present
- The CVPR 2025 edition was held in Nashville and streamed over Zoom
- 1 paper (the challenge report) in the CVPR 2025 workshop proceedings on CVF Open Access
- Not listed in ICORE2026 or the CCF list
