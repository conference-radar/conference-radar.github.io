id: lm4uc
name: LM4UC
full_name: Workshop on Language Models for Underserved Communities
type: workshop
tier: minor
areas: [nlp, ai]
region: worldwide
language: english
frequency: irregular
organizer: Workshop organizing committee led from Stanford University (with MLCommons, NUS, University of Luxembourg and others); co-located with major NLP and AI conferences
organizer_country: [usa]
proceedings: ACL Anthology (NAACL 2025 edition, archival track)
archival: true
typical:
  deadline_months: [5]
  conference_months: [8]
links:
  website: https://lm4uc.github.io/
notes:
  - Workshop on language models for underserved and low-resource communities (benchmarks, multilingual alignment and safety, agentic systems)
  - Host conference changes; 1st at NAACL 2025 (Albuquerque), 2nd at AAAI 2026 (Singapore), 3rd at IJCAI 2026 (Bremen, hybrid)
  - NAACL 2025 edition had archival and non-archival tracks; archival papers are in the ACL Anthology (12 papers)
  - 2026 IJCAI edition took long papers up to 8 pages and short papers up to 4 pages in the IJCAI style, via OpenReview
  - Deadlines in AoE; the IJCAI 2026 page states 11:59 PM AoE
  - Not ranked in ICORE2026 and not on the CCF list
