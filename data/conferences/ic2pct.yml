notes:
- Organized by Galgotias University, Greater Noida (Delhi NCR), India
- Previous editions in 2018, 2019, 2020, 2021 and 2024, all with proceedings in IEEE Xplore; the 2026 edition is the 6th
- Presented papers of acceptable quality are submitted to IEEE Xplore
