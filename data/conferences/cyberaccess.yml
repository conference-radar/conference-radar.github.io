notes:
- ACNS satellite workshop; 1st edition with ACNS 2027 at Royal Holloway, Egham, UK
- Program co-chairs Waleed Bin Shahid and Maryam Mehrnezhad (Royal Holloway) and Ehsan Toreini (Samsung R&D)
- Topics include security and privacy for people with disabilities, older adults and children, assistive technology
  security, technology-facilitated abuse and inclusive research methods
- Papers in Springer LNCS format; page limit and review policy not yet announced
- Accepted papers appear in the ACNS 2027 workshop post-proceedings in Springer LNCS
- In-person presentation required; one author must register for ACNS 2027 at the author rate
- Eligible for the ACNS best workshop paper award (EUR 500)
