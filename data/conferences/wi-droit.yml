notes:
- Co-located with IEEE DCOSS-IoT every year since 2019; 8th edition in Reykjavik 2026, 9th in Montreal 2027
- Drones and UAVs with IoT (sensing, path planning, communication protocols, multi-UAV); the 2027 call broadens the scope to autonomous agents in general
- Full papers up to 6 pages at submission (8 pages in the 2027 camera-ready), IEEE conference format; not double-blind
- Workshop papers go into the DCOSS-IoT IEEE Xplore proceedings (DCOSS-IoT camera-ready instructions cover workshop papers)
- Selected 2026 papers invited to an ACM Journal on Autonomous Transportation Systems special issue
- The DCOSS-IoT 2026 program at a glance places Wi-DroIT on Tuesday June 23, 2026; six papers and a keynote in the 2026 program
- Not listed in CORE ICORE2026 or the CCF 2026 list
