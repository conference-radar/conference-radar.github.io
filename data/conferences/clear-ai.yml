notes:
- Workshop on methods and tools for engineering and evaluating transparency in AI systems
- Not the same venue as CLeaR, the Conference on Causal Learning and Reasoning (clear.yml)
- 2025 edition held at ECAI 2025 in Bologna; 2026 edition held at IJCAI-ECAI 2026 in Bremen (WS28)
- 2026 proceedings via CEUR-WS; papers up to 15 pages excluding references in CEUR format
- Anonymised submissions via OpenReview, at least two reviewers per paper
- At least one author must register for the workshop and IJCAI-ECAI 2026
- A special section in the ACM Journal on Responsible Computing followed the 2025 edition
- Not listed in ICORE2026 or the CCF list
