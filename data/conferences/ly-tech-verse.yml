notes:
- Engineering conference of LY Corporation (the merged LINE and Yahoo Japan group)
- Official site is published in Japanese, English and Korean
- 2026 was a one-day online event with AI and Core Technology tracks (17 featured sessions listed)
- 2025 ran two days with sessions in 12 domain tracks plus a product booth area; streaming was open to all and in-person attendance needed an invitation from an LY Corporation employee
- No call for papers and no proceedings
- Not listed in the CORE ICORE2026 portal
