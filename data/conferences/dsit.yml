organizer: Host university each year (2026 School of AI and Advanced Computing, Xi'an Jiaotong-Liverpool University); sponsored by IEEE and IEEE Nanjing Section
organizer_country: [china]
proceedings: IEEE Xplore (IEEE conference proceedings since 2022; ACM proceedings 2018 to 2021)
archival: true
indexing: [EI, Scopus]
typical:
  deadline_months: [11]
  conference_months: [7, 11, 12]
links:
  website: https://www.dsit2026.net/
notes:
- 9th edition in 2026; held in China since 2021 (Shanghai, Nanjing, Beijing, Taicang) except online in 2022; Seoul in 2019, online in 2020
- Proceedings published by IEEE in IEEE Xplore since 2022 (2023 via CPS), indexed by EI Compendex and Scopus; ACM proceedings 2018 to 2021
- Double-blind review with at least 3 reviewers per paper; submissions via Microsoft CMT
- Dates move around the year (July in 2019 to 2023, December 2024, November 2025 and 2026)
- Site also promotes free publication in two affiliated quarterly journals with very fast review
- Not listed in ICORE2026
