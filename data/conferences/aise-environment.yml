id: aise-environment
name: AISE
full_name: International Workshop on AI Systems for the Environment
type: workshop
tier: minor
areas: [ai]
region: europe
language: english
frequency: annual
organizer: Workshop organizers (2026 - University of Southampton, University of Lincoln, Utrecht University, University of Virginia, Polytechnic Institute of Porto); co-located with ECAI or IJCAI-ECAI
organizer_country: [europe, usa]
proceedings: Workshop pre-proceedings (open access, non-archival)
archival: false
typical:
  deadline_months: [5]
  conference_months: [8, 10]
links:
  website: https://sites.google.com/view/aise2026
notes:
  - Workshop on AI for sustainability (renewable energy, biodiversity, circular economy, AI's own environmental footprint)
  - 1st edition at ECAI 2025 (Bologna), 2nd at IJCAI-ECAI 2026 (Bremen)
  - Short papers of 4-6 pages plus one page of references in Springer LNCS format; submitted via EasyChair
  - At least two reviews per paper by the organising and program committees
  - Accepted papers go into non-archival open-access pre-proceedings; selected papers may be invited to a journal special issue
  - In person only; at least one author must register and present
  - Half-day workshop in 2026
  - Not the ICSE RAISE workshop or the CAiSE conference
  - Not listed in ICORE2026 and not on the CCF list
