notes:
- Satellite workshop of IEEE ICASSP on quantum machine learning for signal processing and AI (variational quantum algorithms, quantum RL, federated QML, QML for speech, biomedical signals and communications)
- Third consecutive ICASSP edition (Hyderabad 2025, Barcelona 2026, Toronto 2027)
- Papers follow the ICASSP style, format and length and are submitted through the ICASSP CMS workshop system
- ICASSP satellite workshop papers are published in IEEE Xplore under a separate workshop record
- At least one author of each accepted paper must present in person
- Full-day workshop in 2027; all ICASSP 2027 satellite workshops are on 17 May 2027
- Not listed in ICORE2026 and not on the CCF list
