notes:
- Run by AMTSO, a California-incorporated 501(c)(6) non-profit of security vendors and testing labs founded in 2008
- Two-day single-track event on anti-malware testing methodology, malware and threat intelligence, plus AMTSO working group updates and panels
- Audience is testing labs, security vendors, government bodies, academics and students
- 2025 edition in Lisbon, 2026 edition at the Renaissance Brussels Hotel
- AMTSO member companies get two free tickets; non-member price not stated
- No public call for papers or proceedings (non-archival)
- Not listed in the CORE ICORE2026 portal
