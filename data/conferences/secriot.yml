notes:
- Also written SecRIoT-SCC since the supply chain cybersecurity scope was added
- Co-located with DCOSS-IoT since 2023; papers go into the DCOSS-IoT proceedings (IEEE Xplore)
- Chairs from Greece (University of Thessaly) and the UK (De Montfort, Edinburgh Napier)
- 8 pages including references, plus up to 2 appendix pages at 100 USD per page
- 2019 to 2021 editions held in Greece (Santorini, Corfu, Preveza); no 2022 edition; 2027 in Montreal
- Not listed in ICORE2026 or the CCF list
