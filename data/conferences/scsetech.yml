links:
  website: https://www.ieeescsetech.com/
notes:
- Hosted by the IEEE Foothill Section, its ComSoc chapter and Cal Poly Pomona; held at Cal Poly Pomona, California
- Hybrid (in person and virtual); presented papers are submitted to IEEE Xplore, no-shows are excluded
- Five tracks covering wireless communication and networking, AI and ML, cybersecurity and privacy, IoT and IoV,
  and smart power and sustainable systems
- Papers up to 6 pages in IEEE double-column format, double-blind review, submitted through EDAS
- Also runs a workshop, a student poster session and an industrial panel
- Not listed in CORE ICORE2026 or the CCF 2026 list
