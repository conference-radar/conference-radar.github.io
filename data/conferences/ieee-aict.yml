notes:
- Long-running IEEE ICT conference; the 2025 edition was the 19th
- Series based in Baku, which hosts about every other edition (2019, 2023, 2026 at ADA University); others in Almaty 2018, virtual 2020 and 2021, Washington DC 2022, Turin 2024 and Al Ain 2025
- AICT 2025 was hosted by United Arab Emirates University at its Crescent Building in Al Ain, UAE
- Twelve tracks in 2025 including data science, big data, HPC, machine learning, software engineering, cyber security, communication and networks, signal processing, and ICT in business, education and health
- Full papers only, 4 to 6 pages in English in IEEE two-column format, single-blind peer review
- Accepted and presented papers are published under an ISBN and submitted to IEEE Xplore; the author guidelines also mention EI Compendex and Scopus
- In-person presentation is required for publication
- Not to be confused with the IARIA AICT (Advanced International Conference on Telecommunications)
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
