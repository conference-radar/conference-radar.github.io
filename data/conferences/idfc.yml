notes:
- New conference on digital forensics, cybersecurity and trustworthy AI; 1st edition 2026 in Trento, 2nd edition 2027 in Varna
- Hybrid (on-site and online)
- 2026 papers published open access by IOS Press (Frontiers in Artificial Intelligence and Applications)
- 2027 edition technically co-sponsored by the IEEE Italy Section; papers go to IEEE conference proceedings, Xplore inclusion subject to IEEE review
- Tracks on digital forensics and incident response, cyber defense, trustworthy and generative AI, applied AI; also posters, artifacts and demos, workshops
- 2026 paper deadline was extended by about five weeks
- Not listed in ICORE2026 and not on the CCF list
