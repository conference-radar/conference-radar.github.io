notes:
- Annual Optica congress made up of co-located topical meetings; in 2026 these were BGPP, IPR, NP, NOMA, Photonic Networks and Devices (Networks), Signal Processing in Photonic Communications (SPPCom), SOLITH and SOF
- Networks and SPPCom are the meetings closest to communications and networking; 2027 topics include optical networking for AI data centers and HPC
- "Submission format: 35-word abstract plus a 2-page summary, peer reviewed"
- Accepted and presented papers are published on the Optica Publishing Group platform and indexed in Ei Compendex, Scopus and Google Scholar
- Location rotates worldwide (Quebec City 2024, Marseille 2025, Long Beach 2026, Auckland 2027)
- Photonics venue rather than computer science; not listed in ICORE2026
