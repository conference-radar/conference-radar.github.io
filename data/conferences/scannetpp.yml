notes:
- Half-day CVPR workshop around the ScanNet++ benchmark for novel view synthesis and 3D semantic scene understanding
- Held at CVPR 2025 (Nashville) and as the 3rd edition at CVPR 2026 (Denver)
- No call for papers; program is invited talks, challenge winner talks and a panel
- 2026 added an iPhone novel view synthesis benchmark and 360-degree RGB-D panoramas
- Not on the CCF list
