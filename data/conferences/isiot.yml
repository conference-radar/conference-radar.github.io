notes:
- Co-located workshop of DCOSS-IoT; follows the main conference location (2026 Reykjavik, 2027 Montreal)
- Accepted and presented papers go into the DCOSS-IoT proceedings, submitted to IEEE Xplore
- Workshop chairs are based in Cyprus
- Not double-blind; 8 pages including references, plus up to 2 appendix pages at 100 USD per page
- Submission deadline was extended twice in 2026 (January -> March -> April)
- Not listed in ICORE2026 or the CCF list
