notes:
- Organized by the CSE department of I.T.S Engineering College, Greater Noida (Delhi NCR), India
- Keynote and committee members largely from the IEEE Uttar Pradesh Section
- The 2026 edition has IEEE conference record number 70538 and an IEEE Xplore compliant ISBN
- Proceedings of the previous edition are in IEEE Xplore
- Long submission window (opened October 2025, closed April 2026); review through Microsoft CMT
- Not listed in ICORE2026 or the CCF 2026 list
