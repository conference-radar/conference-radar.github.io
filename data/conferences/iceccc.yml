notes:
- Organized and hosted by CMR Institute of Technology (CMRIT), Bengaluru, India
- Accepted and presented papers submitted to IEEE Xplore; the 2024, 2025 and 2026 proceedings are in Xplore
- 2027 is the 4th edition, themed on AI-driven smart electronics and next-generation communication technologies
- Each paper reviewed by three reviewers; submission via Microsoft CMT
- Scope covers AI in electronics and VLSI, embedded computing, 5G/6G networking, control and cyber-physical systems
- Not listed in ICORE2026; not on the CCF list
