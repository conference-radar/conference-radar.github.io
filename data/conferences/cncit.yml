id: cncit
name: CNCIT
full_name: International Conference on Networks, Communications and Information Technology
type: conference
tier: minor
areas: [networking, communications]
region: china
language: english
frequency: annual
organizer: Conference secretariat at applied-computing.net; 2027 edition sponsored by IEEE and Jinan University and organized by the College of Cyber Security, Jinan University
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
fee: 600 USD regular author (2027; 550 USD early bird before Feb 20), 520 to 550 USD student; 300 to 350 USD presentation only
typical:
  deadline_months: [2]
  conference_months: [5, 6, 7]
links:
  website: https://www.cncit.net/
notes:
- Smaller commercially organized conference; secretariat contact uses a Hong Kong phone number
- Proceedings alternate between publishers -> IEEE CPS in IEEE Xplore (2022), ACM (2023, 2024, 2026), IEEE Xplore (2025, and announced for 2027)
- Held online in 2022 to 2024; the 2027 edition is at Jinan University, Guangzhou, both in person and online
- Double-blind review by at least 2 to 3 reviewers; full papers up to 6 pages
- Topics include communication and signal processing, computer networks, network security and privacy, and AI for networks
- Not listed in the CORE ICORE2026 portal or the CCF list
