notes:
  - AAAI workshop on medical world models (patient-state dynamics, disease trajectory simulation, clinical decision support)
  - Listed as W41 in the AAAI-27 workshop program
  - 1st edition at AAAI-27 in Montreal, half day (morning) on Tuesday 23 February 2027
  - Non-archival with no official proceedings; accepted papers hosted on OpenReview and the workshop website
  - Authors of accepted papers are invited to submit extended versions to a MELBA journal special issue
  - Full papers 6 to 8 pages and short, poster or position papers 2 to 4 pages, AAAI two-column format
  - Single-blind review on OpenReview; work under review or recently published elsewhere is accepted
  - No submission fee; in person only, presenting author must register for AAAI-27
  - All deadlines AoE
  - Not listed in ICORE2026 or the CCF list
