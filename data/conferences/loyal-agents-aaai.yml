notes:
  - AAAI workshop on AI agents that stay faithful to the people they represent (permissions, delegation, conflicts of interest, evaluation, law and governance)
  - 1st edition at AAAI-27 in Montreal, one day in person on February 22 or 23, 2027 (day assigned by AAAI)
  - Research, position, and law and policy papers up to 8 pages plus references in the AAAI-27 author kit; shorter papers welcome
  - Single-blind review on OpenReview with at least two reviews per paper
  - Accepted papers are non-archival by default; authors of original work may opt into a CEUR-WS volume
  - Work under review elsewhere and previously published work (with the prior venue disclosed) are accepted
  - At least one author must register for AAAI-27 and present in person
  - All deadlines AoE
  - Not listed in ICORE2026 or the CCF list
