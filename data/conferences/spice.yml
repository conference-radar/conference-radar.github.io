id: spice
name: SPICE
full_name: Workshop on Sparsity, the Key Ingredient from HPC to Efficient LLMs
type: workshop
tier: minor
areas: [systems, ai]
region: worldwide
language: english
frequency: annual
organizer: Workshop organizers led by University of Maryland (Bahar Asgari) and Ramyad Hadidi; co-located with MICRO
organizer_country: [usa]
proceedings: None (non-archival, papers and slides posted on the workshop site)
archival: false
typical:
  deadline_months: [9]
  conference_months: [10, 11]
links:
  website: https://spice.cs.umd.edu/index.html
notes:
  - Workshop on sparsity across the stack, from HPC and sparse data structures to MoE and efficient LLM inference and training
  - Held with MICRO (Seoul 2025, Athens 2026) as a half-day workshop
  - Soft limit of 4 pages in double-column format like MICRO; early-stage and position papers welcome
  - Double-blind review through HotCRP
  - Non-archival; papers are not published in proceedings and can be published elsewhere
  - Not listed in CORE ICORE2026 (the CORE "SPICE" is Software Process Improvement and Capability Determination) or the CCF list
