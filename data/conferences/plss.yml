notes:
- Workshop on how programming languages are standardized and specified (formal and executable specifications, standards process, multi-implementation compatibility, teaching standardization)
- 1st edition with ECOOP 2025 in Bergen, Norway; 2nd edition with SPLASH/ISSTA 2026 in Oakland, USA
- Submissions are short abstracts (300 to 500 words in 2025, 2 to 5 paragraphs in 2026) for talks; lightweight review
- Previously presented or published work is welcome; the call pages do not mention any proceedings
- Industry professionals, standards body representatives and language implementers are especially invited
- The 2026 edition was endorsed by the W3C
- Not listed in the CORE portal (ICORE2026); not on the CCF 2026 list
