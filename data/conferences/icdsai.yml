id: icdsai
name: DSAI
full_name: International Conference on Data Science and Artificial Intelligence
type: conference
tier: minor
areas: [ai, data, nlp, vision]
region: asia-pacific
language: english
frequency: annual
organizer: Asian Institute of Technology and Leiden University, with a rotating host university (UTM in 2026)
organizer_country: [thailand, europe]
proceedings: Springer CCIS
archival: true
fee: 350 to 400 USD international, 250 to 300 USD developing countries, 1000 to 1200 MYR local (2026, regular)
typical:
  deadline_months: [6, 7]
  conference_months: [11]
links:
  website: https://icdsai.utm.my/
notes:
- Series started in 2023 at AIT Bangkok; hosts so far Bangkok 2023, Medan (USU) 2024, Peradeniya 2025, Kuala Lumpur (UTM) 2026
- Main organising committee from the Asian Institute of Technology (Thailand), Leiden University (Netherlands) and the host university
- Proceedings in Springer Communications in Computer and Information Science (CCIS) every year since 2023
- Aims at capacity building for data science and AI in developing countries; reduced fees for developing countries
- Websites use both DSAI and ICDSAI; not to be confused with the unrelated DSAI 2025 held in Gorakhpur, India
- Not in the CORE ICORE2026 portal or the CCF 2026 list
