notes:
- New ACNS satellite workshop, 1st edition in 2027 at Royal Holloway, University of London
- "Scope: protocols that combine several PETs (MPC with HE, TEEs with cryptography or DP, secure aggregation, ZKPs\
  \ for verifiability), including hybrid PETs for ML and LLMs; work on a single PET in isolation is out of scope"
- Double-blind review, unmodified LNCS template, up to 18 pages excluding references and appendices (24 pages total)
- Accepted papers appear in the joint ACNS 2027 workshop post-proceedings in Springer LNCS
- Full-day, in-person workshop; papers also eligible for the ACNS best workshop paper award (EUR 500, sponsored by
  Springer)
- Not listed in ICORE2026 or the CCF list
