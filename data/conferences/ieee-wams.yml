notes:
  - Annual symposium on wireless, antennas and microwave engineering, held at academic institutes in India; the WAMS Society lists editions every year since 2022
  - Run by the WAMS Society; 2027 is the 6th edition, 100% financially sponsored by IEEE AP-S
  - Peer-reviewed accepted papers that are presented in person are submitted to IEEE Xplore
  - Aimed at students and young professionals; offers travel and registration support for student authors
  - Tracks on wireless, antennas and microwave; submission through Microsoft CMT
  - Not listed in ICORE2026 or the CCF list
