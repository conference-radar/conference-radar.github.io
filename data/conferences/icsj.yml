notes:
- Sponsored by the IEEE Electronics Packaging Society (formerly CPMT); started in 1992 as the VLSI Packaging Workshop in Japan (VPWJ) and renamed ICSJ in 2010
- Held every November in Kyoto, at Ritsumeikan University Suzaku Campus since 2023; 2026 was the 15th ICSJ and on site only
- Abstract submission first, then a 4-page IEEE-format paper for regular talks (2 pages for Early Career Researchers sessions) published in IEEE Xplore
- Early Career Researchers (ECR) poster sessions for students and young researchers, with young researcher awards
- Covers advanced packaging, chiplets and interposers, hybrid bonding, co-packaged optics, signal and power integrity, power and automotive electronics
- About 350 participants in 2025
