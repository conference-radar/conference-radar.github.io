notes:
- Half-day workshop in 2026 (full day at ICC 2025) on task-oriented, semantic and generative-AI based communications (deep JSCC, LLM and diffusion models, edge AI, ISCC)
- Co-chaired in 2026 by Dingzhu Wen (ShanghaiTech), Dongzhu Liu (Glasgow), Adnan Aijaz (Toshiba BRIL), Dusit Niyato (NTU), Nikolaos Pappas (Linkoping) and Walid Saad (Virginia Tech)
- Held at ICC 2024 (Denver), ICC 2025 (Montreal), GLOBECOM 2025 (Taipei) and ICC 2026 (Glasgow, WS15)
- 31 papers in the 2026 program
- Workshop papers go into the ICC or GLOBECOM proceedings and IEEE Xplore; no-show papers are removed
- Not listed in ICORE2026 or in the CCF 2026 list
