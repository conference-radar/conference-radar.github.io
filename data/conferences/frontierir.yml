notes:
- Workshop on information retrieval for AI systems (reasoning-intensive retrieval, agent memory and tool retrieval, code and multimodal retrieval, RAG), held with AAAI
- First edition at AAAI 2026 in Singapore, second at AAAI-27 in Montreal
- Non-archival; accepted papers are hosted on the workshop website and presented as talks or posters
- Full papers 4 to 7 pages and short papers up to 4 pages (excluding references and appendices) in the AAAI-27 format, OpenReview
- 2027 uses double-blind review with at least three reviews per paper (2026 was single-blind and welcomed already published papers)
- Best paper award
- Not listed in ICORE2026 and not on the CCF list
