notes:
- Workshop of the IEEE International Conference on Cyber Security and Resilience (IEEE CSR); held every year
  since 2023 (Venice 2023, London 2024, Chania 2025, Lisbon 2026)
- Topics are privacy-preserving data processing and analysis
- 2026 workshop chair from the University of Naples Parthenope; organizing committee from the University of Salerno,
  University of Rome Campus Bio-Medico and CERTH-ITI
- Workshop papers go into the IEEE CSR proceedings in IEEE Xplore; 6 pages plus up to 2 extra pages with overlength
  charges
- In person in 2025 and 2026 (hybrid in 2024); deadline was extended by one month in 2026 (Apr 13 -> May 13); 5 accepted papers in 2026
- "2026 program: one session on Mon 3 Aug"
- Not found in the ICORE2026 CORE portal search
