notes:
- Organized by Nitte Meenakshi Institute of Technology, Bengaluru, India; held annually since at least 2023
- All presented papers are submitted for inclusion in IEEE Xplore
- Three tracks (networks, multimedia, information technology) plus special sessions
- Papers up to 6 pages in IEEE double-column format via Microsoft CMT
- Long submission window, opening about ten months before the conference
- Not listed in ICORE2026
