notes:
- Workshop on software frameworks, programming models, compilation and workload management for integrated quantum and HPC systems, held with SC
- First edition at SC25 (St. Louis, half day); second edition at SC26 (Chicago, full day, hybrid)
- Peer-reviewed papers of 5 to 8 pages excluding references (2025 call)
- Listed among the SC26 workshops with proceedings; accepted papers appear in the SC workshop proceedings, open access
- "SC25 edition: 22 submissions, 9 accepted papers, about 103 attendees"
- Not listed in CORE ICORE2026
