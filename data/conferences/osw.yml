notes:
- Annual workshop on the security of OAuth, OpenID Connect and related identity protocols (JOSE, web technology) since 2015
- Audience of researchers, architects, developers and standardization working group members
- Pre-submitted sessions (25 minute talks or discussions, tutorials up to three hours) reviewed by a program committee, plus an unconference part
- Already published or preliminary work is welcome; slides are shared online without formal proceedings
- No organization or company behind it; each edition is hosted by a different European partner (2024 FBK with TDI in Rome, 2025 Signicat in Reykjavik, 2026 Lancaster University Leipzig)
- Two submission rounds, notification about 1 to 2 weeks after each; in person only in 2026
