notes:
- Workshop on software engineering for generative art, algorithmic art and creative coding (tools, languages, art code maintenance and preservation, SE education through art)
- First edition co-located with ACM FSE 2026 in Montreal on the afternoon of 6 July 2026
- One-page submissions (Arsclassica LaTeX template) proposing a demo, presentation or performance, submitted via HotCRP
- Proceedings are an open-source web zine hosted on GitHub, not a formal publication
- Follows an IEEE Computer special issue on software engineering in generative art
- Not listed in CORE ICORE2026
