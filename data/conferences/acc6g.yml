notes:
- Small conference on 6G and wireless communications; 2026 edition organized by SUSTech with IEEE Communications Society and Auckland University of Technology as technical sponsors
- 2026 proceedings are in IEEE Xplore (ISBN 979-8-3195-4226-7); authors can instead choose the open access journal Space-Integrated-Ground Information Networks
- First edition 2025 was held online (one day); 2026 in person at SUSTech, Shenzhen
- Double-blind review by 2 to 3 reviewers, results in 20 to 30 days; one registration covers 5 pages
- Presentation-only and listener registration also offered
- Not listed in the CORE ICORE2026 portal or the CCF list
