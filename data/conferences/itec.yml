links:
  website: https://itec-conf.com/
notes:
- IEEE conference on electrified vehicles, aircraft and ships, held every June in the United States since 2012
- Mostly in Michigan (Dearborn, Detroit, Novi) with some editions in California and Illinois; 2020 and 2021 virtual
- Double-blind review of 3 to 5 page digests; final papers in IEEE two-column format
- Presented papers with a full regular registration go into IEEE Xplore; no-shows are excluded
- One full registration covers up to two papers; each extra paper 195 USD (2027)
- Presented papers can be extended for IEEE Transactions on Industry Applications and IEEE Transactions on Transportation Electrification
- Co-located with an exhibition and the IEEE Electrified Aircraft Technologies Symposium (2027)
- Separate regional series (ITEC Asia-Pacific, ITEC India) are not covered by this entry
- Not listed in the CORE ICORE2026 portal and not on the CCF list
