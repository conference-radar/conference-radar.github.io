notes:
- Organized by the Department of Electrical Engineering, Motilal Nehru National Institute of Technology (MNNIT) Allahabad, Prayagraj, India
- Earlier editions technically sponsored by the IEEE Uttar Pradesh Section and co-sponsored by the IEEE Joint Society Chapter of IE/PEL/CS
- Accepted and presented papers considered for IEEE Xplore; earlier editions are in Xplore
- Student conference; the first author of each paper must be a student
- Held in person at MNNIT Allahabad
- Editions in 2012, 2013, 2014, 2015, 2019, 2020, 2022, 2024 and 2027 (9th)
- EE focus (power, energy and control; electronics, communication and signal processing; computational intelligence and machine learning; mechanical systems; applied sciences)
- Papers up to 6 pages including references, submitted via Microsoft CMT
- Not listed in ICORE2026; not on the CCF list
