notes:
- Broad engineering conference run by the Faculty of Engineering of Universidad Catolica de Colombia in Bogota since 2015, with IEEE Colombia co-sponsorship
- Proceedings in IEEE Xplore for every edition since 2017 (2025 ISBN 979-8-3315-9132-8)
- Papers in English, IEEE double-column format, at most 6 pages, Word file only, submitted via EasyChair; accepted papers are presented orally
- XI CONIITI was in 2025 and XII CONIITI in 2026
- Held at the university convention center (Sede 4) in Bogota; 2026 had Italy as guest country
- Not listed in the ICORE2026 CORE portal
