notes:
- CVPR workshop on computer vision for architecture, engineering and construction (AEC) and the built environment
- Held at every CVPR since 2021; the 5th edition was a half-day workshop at CVPR 2026 in Denver
- Archival track (8 pages) goes into the CVPR Workshops proceedings and needs a CVPR author registration; non-archival track (4 pages) has a later deadline
- Hosts the Nothing Stands Still challenge on 3D point cloud registration of evolving construction sites
- Not listed in ICORE2026 or the CCF list
