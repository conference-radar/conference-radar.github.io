notes:
- Workshop of the IEEE-sponsored AINA conference (International Conference on Advanced Information Networking and Applications); follows AINA around the world
- Held every year since 2019 (Matsue 2019, virtual 2020 to 2023, Kitakyushu 2024, Barcelona 2025, Wellington 2026, Tirana 2027)
- Run from the NorNet testbed project at SimulaMet in Oslo; general chair Thomas Dreibholz
- Topics are multi-cloud and cross-cloud systems, cloud federation networking, mobile edge computing, 5G, resilience and low-latency transport
- Papers go into the Springer AINA workshop proceedings; the site says the series is submitted to ISI Proceedings, EI-Compendex, DBLP and Scopus
- Small workshop with full papers and a poster session; 4 papers in one session in 2026
- Deadline is usually late December and announced as a hard deadline
- Not listed in CORE ICORE2026 or the CCF list
