notes:
- Half-day workshop on building, deploying and evaluating AI agents in enterprise settings, held with ACM SIGKDD
- Held at KDD 2026 in Jeju, Korea (August 10, 2026, 8am to 12pm, ICC Jeju Room 402A)
- Organized mainly by NVIDIA Enterprise AI staff
- Three tracks; full papers up to 6 pages, demonstrations up to 4 pages, extended abstracts up to 2 pages, ACM template
- Single-blind review; previously submitted or published work is acceptable
- All accepted papers are presented as posters; PDFs are posted on the workshop website
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
