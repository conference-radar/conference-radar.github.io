id: icetis
name: ICETIS
full_name: International Conference on Electronic Technology and Information Science
type: conference
tier: minor
areas: [communications, general]
region: china
language: english
frequency: annual
organizer: AEIC (AiScholar, ais.cn) conference service with a host university each year (Guizhou Institute of Technology in 2027)
organizer_country: [china]
proceedings: IEEE
archival: true
indexing: [EI, Scopus]
typical:
  deadline_months: [4]
  conference_months: [5, 6]
links:
  website: http://www.icetis.org/
notes:
- Annual since 2016; 2027 is the 12th edition
- Recent editions in China (Sanya 2022, Dalian and Leeds 2023, Hangzhou 2024 and 2025, Guiyang 2026 and 2027); 2020 and 2021 were online
- Covers electronics engineering, computer engineering and information science
- 2025 edition advertised with IEEE publication on the official site; 2020 and 2021 papers went to IOP Journal of Physics Conference Series
- Proceedings are submitted to EI Compendex and Scopus
- Not listed in CORE ICORE2026
