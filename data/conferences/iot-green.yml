notes:
- Held in conjunction with IEEE DCOSS-IoT; 2nd edition at DCOSS-IoT 2026 in Reykjavik, listed again for DCOSS-IoT 2027 in Montreal
- IoT for urban sustainability and green technology
- Papers in the DCOSS-IoT conference proceedings, submitted to IEEE Xplore
