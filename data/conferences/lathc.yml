notes:
- One-day workshop co-located with IEEE/ACM CGO on programming models, compilers, accelerators and ML systems for heterogeneous computing
- Talk-based; submit a title, abstract and presenter biography via EasyChair, no manuscript
- Non-archival; no proceedings, presenters share slides that are posted on the website
- Work does not need to be original; recently published or submitted work is welcome
- Held since 2023 with CGO (Montreal 2023, Edinburgh 2024, Las Vegas 2025, Sydney 2026, Salt Lake City 2027)
- Co-chaired by J. Nelson Amaral (University of Alberta) and Yaoqing Gao (Huawei Canada); Huawei has sponsored past editions
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
