notes:
- One-day workshop on constraint solving, optimization and decision making, including interval and fuzzy uncertainty
- Co-located with either NAFIPS (2022 Halifax, 2023 Cincinnati, 2026 El Paso) or the SCAN symposium (2021 Szeged online, 2025 Oldenburg)
- 18th edition in 2026; no edition in 2024
- Short submissions of 2 to 5 pages in Springer svmult format, sent by email to the organizers; idea submissions also welcome
- Publication venue depends on the host conference; in 2026 accepted papers of 4+ pages went into the Springer NAFIPS 2026 proceedings
- 'Registration fee 2026: USD 50, USD 25 for students and retirees; free with NAFIPS 2026 registration'
- Remote participation possible in 2026
- Not listed in ICORE2026 or the CCF list
