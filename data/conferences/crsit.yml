id: crsit
name: CRSIT
full_name: International Conference on Communication, Remote Sensing and Information Technology
type: conference
tier: minor
areas: [communications, networking, vision]
region: china
language: english
frequency: annual
organizer: Host universities in China (2025 Kunming University of Science and Technology with Nanjing University of
  Information Science and Technology; 2026 Nanjing University of Information Science and Technology); website run on
  the AiScholar (ais.cn) conference platform
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
typical:
  deadline_months: [1]
  conference_months: [6]
links:
  website: https://www.crsit.net/
notes:
- Young conference started in 2025 covering wireless and optical communications, satellite communications, signal
  processing and remote sensing data and image processing
- Held in China (2025 Kunming, 2026 Nanjing, 2027 Lanzhou)
- The 2025 and 2026 proceedings were published by IEEE (Xplore DOIs 10.1109/crsit66101.2025 and
  10.1109/crsit69981.2026); organizers say accepted papers are submitted to EI Compendex and Scopus
- Each paper is reviewed by two or three committee members
- The 2025 edition reported more than 140 attendees
- Not listed in ICORE2026 or CCF
