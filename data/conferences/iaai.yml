notes:
- AAAI conference on deployed and emerging applications of AI, co-located with the AAAI conference (IAAI-27 is the 39th)
- Most years IAAI papers are published in a joint proceedings with AAAI (Proceedings of the AAAI Conference on Artificial Intelligence)
- 'Tracks: deployed highly innovative applications (8 pages), emerging applications (6 pages), deployment insights (6 page full papers, 2 to 4 page experience reports)'
- Single-blind review via OpenReview, no rebuttal; some papers are accepted conditionally on revisions
- Accepted deployed application papers receive the IAAI Deployed Application Award
- CORE ICORE2026 rank C
