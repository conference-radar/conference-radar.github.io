notes:
  - Workshop on lifelong learning, alignment and self-evolution of LLM-based agents
  - 1st edition at ICLR 2026 (Rio de Janeiro), 2nd edition at COLM 2026 (San Francisco); the host conference has changed between editions
  - Non-archival; papers under review at other venues are welcome
  - Long papers up to 9 pages and short papers up to 5 pages, excluding references and appendices; double-blind review on OpenReview
  - The name LLA comes from the OpenReview group, the site does not use it as an acronym
  - Not listed in ICORE2026 and not on the CCF list
