notes:
- Broad computing and communications conference run by the ICTCS / GR Scholastic team, sister event of ICTCS, ICTIS, ICT4SD and ICICT London
- Proceedings in Springer Lecture Notes in Networks and Systems under the title 'Smart Trends in Computing and Communications'
- 11th edition in Goa, India, 27 to 30 Jan 2027; SmartCom 2026 was held in Pune, India (Springer proceedings)
- Very large, high-acceptance event typical of this organizer; regarded as a minor venue
- Not the IEEE SMARTCOMP conference (ieee-smartcomp), which has a similar name
- Not listed in ICORE2026 (the only SmartCom match there is IEEE SMARTCOMP)
