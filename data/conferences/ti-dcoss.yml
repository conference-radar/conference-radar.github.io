notes:
- Co-located workshop of IEEE DCOSS-IoT; editions in 2023 (Pafos), 2025 (Lucca) and 2026 (Reykjavik), none in 2024; TI 2027 announced for Montreal
- Papers appear in the DCOSS-IoT conference proceedings and are submitted to IEEE Xplore
- Agentic and multi-agent IoT/AI, edge LLMs, digital twins, explainable AI, security, safety and privacy
- IEEE two-column format, up to 8 pages including references plus up to 2 appendix pages at 100 USD per page
- 2026 deadlines were extended; the original dates are not shown
- Not listed in ICORE2026 or the CCF list
