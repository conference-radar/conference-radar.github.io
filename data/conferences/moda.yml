notes:
- Workshop on monitoring and operational data analytics for HPC systems and data centers (telemetry, AI/ML for operations, energy efficiency, observability), held with ISC High Performance in Hamburg
- Held every year since 2020 (MODA20); 2026 was the 7th edition, renamed from "Monitoring & Operational Data Analytics" to add Observability
- Full papers of 6 to 12 pages in LNCS format, plus 1-page lightning talk abstracts; peer reviewed by the program committee
- Accepted and presented papers appear in the post-conference ISC workshop proceedings in Springer LNCS
- Submissions through the ISC Linklings system; in-person presentation required
- Not listed in CORE ICORE2026
