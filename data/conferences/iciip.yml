notes:
- Biennial conference held every odd year since 2011 at JUIT, Waknaghat near Shimla, Himachal Pradesh, India
- Proceedings in IEEE Xplore (2025 catalogue number CFP2569N-ART)
- 2025 edition in hybrid mode with ten tracks (medical imaging, smart cities, multimedia, quality assessment and security, computer vision, autonomous vehicles, visual surveillance, deep learning and generative AI, HCI, biometrics and forensics)
- Papers up to 6 pages (full) or 4 pages (short or poster) in IEEE format, at least three reviewers per paper, via Microsoft CMT
- Authors may submit at most 2 papers
- "Acceptance rate: 15.9% (2025, 131 of 821)"
- Not listed in ICORE2026
