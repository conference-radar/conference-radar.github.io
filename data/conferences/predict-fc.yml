notes:
- Affiliated workshop of Financial Cryptography and Data Security (FC); 1st edition (PREDICT'27) at FC 2027 in Barbados
- Program chairs 2027 Jeremy Clark (Concordia University) and Lucianna Kiffer (IMDEA Networks Institute)
- Interdisciplinary scope covering market design, automated market makers, manipulation, oracles and outcome
  resolution, privacy and security, decentralized prediction markets and AI agents
- Research papers (15 pages), short papers (8 pages) and SoK papers (20 pages) in LNCS format, double-blind review
- Accepted papers are published in Springer LNCS after the conference; 1-page research talks get no individual
  publication
- Submission via EasyChair
