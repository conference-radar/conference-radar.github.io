notes:
- Standalone IEEE workshop on defense and security technologies, bringing together academia, industry, defense and government
- Held in Italy every year since 2023 (Rome 2023, Naples 2024, Rome 2025, Turin 2026)
- Topics include imaging and sensing, radar and sonar signal processing, data fusion, machine learning, security and underwater technologies
- Extended abstracts of 4 to 5 pages are peer reviewed; accepted papers are submitted to IEEE Xplore
- Extended versions of presented papers are eligible for post-publication
- Not listed in ICORE2026
