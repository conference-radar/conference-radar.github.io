notes:
- Annual conference on reliability engineering and prognostics and health management (AI and ML for PHM, fault diagnosis, digital twins); each edition is named after its host city (PHM-Ji'nan 2026)
- Co-sponsored by the IEEE Reliability Society; accepted and presented papers are submitted for possible inclusion in IEEE Xplore and EI Compendex
- Held in China almost every year since 2010 (Beijing 2024, Xi'an 2025, Ji'nan 2026); Milan 2013 was the only edition abroad
- Full draft paper first, then final manuscript; one presenting-author registration per paper and papers must be presented to go to IEEE Xplore
- "Registration fee: 500 USD early, 560 USD regular for presenting authors (2026)"
- Reliability engineering in general, not computing only
- Not listed in CORE ICORE2026 or in the CCF 2026 list
