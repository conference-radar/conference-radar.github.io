notes:
- First edition, a half-day pilot workshop aligned with ECIR 2026 in Delft, Netherlands
- Covers claim and promise retrieval and verification, forecast accuracy, longitudinal IR, and corporate, policy and societal accountability via IR and NLP
- Led by Chung-Chi Chen (AIST, Japan) with organizers from 3DS Outscale (France), Chulalongkorn University (Thailand), National Taipei University (Taiwan), AIST and University of Tsukuba (Japan)
- Long papers up to 12 pages and short papers up to 6 pages in Springer LNCS format, double-blind, via EasyChair
- Proceedings in CEUR-WS are optional for authors
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
