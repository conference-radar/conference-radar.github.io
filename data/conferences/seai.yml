notes:
- Co-sponsored by IEEE and Huaqiao University or Fuzhou University; hosted by their computer science colleges with the Fujian Computer Society
- Held in Fujian, China every June (Xiamen 2021 to 2024, Fuzhou 2025 and 2026, Quanzhou 2027); 2022 was virtual
- All proceedings since 2021 in IEEE Xplore, indexed in EI Compendex and Scopus
- Topics cover AI methods and applications, software engineering, and software quality, testing and security
- Not listed in CORE ICORE2026 or the CCF list
