id: ic-ftai
name: IC-FTAI
full_name: International Conference on Future Telecommunications and Artificial Intelligence
type: conference
tier: minor
areas: [communications, ai]
region: africa
language: english
frequency: annual
organizer: IEEE Egypt Section AP-S/MTT-S Joint Chapter (Alexandria)
organizer_country: [other]
proceedings: IEEE Xplore
archival: true
fee: About 350 USD (2026, IEEE member, in person, non-Egyptian); 250 USD virtual
typical:
  deadline_months: [9]
  conference_months: [11]
links:
  website: https://r8.ieee.org/egypt-apmtt/ic-ftai-conference/
notes:
  - Run by the IEEE Egypt AP-S/MTT-S Joint Chapter with technical support from IEEE AP-S, MTT-S and the IEEE Egypt Section
  - Held in Alexandria, Egypt, in hybrid format (in person or online); editions since 2024
  - Accepted full papers go to IEEE Xplore (2025 proceedings added in February 2026)
  - Double-blind review; regular papers up to 6 pages, up to 2 extra pages at 100 USD each
  - Also has workshops, demonstrations, tutorials and a student project poster track
  - Not listed in ICORE2026 or the CCF list
