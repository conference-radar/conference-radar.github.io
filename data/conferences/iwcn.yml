notes:
- Device simulation workshop on electronic, thermal and spin transport, advanced CMOS, more-than-Moore devices and nanoelectronics modeling
- Started in 1992 as the International Workshop on Computational Electronics (IWCE); renamed IWCN in 2016
- Held every two years, rotating between the USA, Europe and Asia (Leeds 2017, Evanston 2019, online 2021, Barcelona 2023, Salt Lake City 2025, Hsinchu 2027)
- Two-page abstract for review, then a four-page final paper in IEEE format; IWCN 2027 papers are submitted to IEEE Xplore
- Earlier editions published abstracts on iwcn.info; IEEE Xplore proceedings are new for 2027
- Single-session format with keynotes, contributed talks and posters; students strongly encouraged
- International Wigner Workshop (IWW) runs as a satellite event just before
- Not ranked by CORE or CCF, whose lists cover computing venues
