notes:
- Workshop co-located with BIS (International Conference on Business Information Systems); 5th edition in 2026
- Papers appear in the BIS workshop post-conference proceedings in Springer LNBIP
- Long papers up to 12 pages, work-in-progress reports up to 6 pages, submission via EasyChair
- Topics cover blockchain, cryptocurrencies, DeFi, smart contract verification, security and privacy, and legal issues
- Short cycle, with the deadline about five weeks before the workshop
- Not listed in ICORE2026 and not on the CCF list
