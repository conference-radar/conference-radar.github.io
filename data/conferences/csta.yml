notes:
- Hosted on the Emerging Technologies Network site (emergingtechnet.org), which also hosts SNAMS and FMEC; hybrid format
- Accepted, registered and presented papers from CSTA and its co-located workshops are submitted to IEEE Xplore, Scopus indexing expected
- Full papers up to 8 pages in the IEEE A4 template, blind review, 2 extra pages for a fee; submission through Sparcly
- At least one author must register and present or the paper is dropped from the proceedings
- Late and special tracks have a later deadline (2026 submission November 5)
- Very fast review cycle (about two weeks from submission to notification)
- Not listed in ICORE2026; not on the CCF 2026 list
