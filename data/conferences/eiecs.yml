notes:
- Annual since 2021 and held in China (Changchun 2023 and 2025, Yanji 2024, Dongguan 2026, Hangzhou 2027)
- Broad electronics, communications and computer science scope (integrated circuits, RF, AI, vision, sensing)
- Proceedings published by IEEE (IEEE Xplore record for 2025), submitted to EI Compendex and Scopus
- Run by a commercial conference service with a host university; abstract-only presentation is also offered
- About 200 to 250 attendees with oral, online and poster sessions (2025, 2026)
- Not listed in CORE ICORE2026
