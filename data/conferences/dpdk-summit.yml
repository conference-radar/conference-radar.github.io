notes:
- Community summit of the DPDK project (Linux Foundation) on fast packet processing in user space
- Two days of talks on deployments, drivers, testing and tooling, plus time with maintainers
- Talks chosen through a call for proposals; no papers, talk recordings are posted on YouTube afterwards
- In-person speakers are strongly preferred and vendor sales pitches are not accepted
- 'Past venues: Montreal and Bangkok (APAC) 2024, Prague 2025, Stockholm 2026; Vienna announced for 2027'
- Not listed in the CORE ICORE2026 portal
