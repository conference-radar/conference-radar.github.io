notes:
- Workshop 8 at IEEE VTC2027-Spring (Hamburg); not in the VTC2026-Spring or VTC2026-Fall workshop lists
- Covers space-air-ground-water integrated networks, multi-dimensional resource optimization, joint computation, caching and communication, and AI methods such as multi-agent reinforcement learning and federated learning
- Organizers from HUST, KIT, Airbus Central Research and Technology, UNSW and UESTC
- Co-organizer Yan Zhang chairs the IEEE VTS committee on space-air-ground-water integrated networks
- VTC papers are 5 pages (up to 2 extra pages at 100 USD each), submitted through the VTC2027-Spring workshops and Recent Results TrackChair site
- VTC papers go to IEEE Xplore and may be removed if not presented at the conference
- Not listed in ICORE2026
