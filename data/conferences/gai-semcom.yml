notes:
- Workshop WS-37 co-located with IEEE GLOBECOM 2026 in Macau; full-day in-person workshop on 11 December 2026
- Covers generative AI for semantic communication, semantic compression, security, quantum and ISAC aspects
- General chairs from NIT Rourkela, IIT Jammu, MTU Ireland, NEC Laboratories and National Sun Yat-sen University; steering committee includes Deniz Gunduz and Dusit Niyato
- 2026 program has 21 papers in four sessions plus a keynote and a panel
- Accepted and presented papers go into the IEEE GLOBECOM workshop proceedings in IEEE Xplore; in-person presentation required (no-show papers removed)
- Submissions via EDAS through the GLOBECOM workshop call
- Not listed in ICORE2026
