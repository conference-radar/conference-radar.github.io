notes:
- Workshop on integrating several AI approaches (planning, SAT/SMT, neurosymbolic AI, LLM plus symbolic AI, cognitive architectures)
- 1st edition at ECAI 2024 (20 October 2024), 2nd at IJCAI 2025 in Montreal
- No proceedings series named on the official pages; accepted papers are posted as PDFs on the workshop website
- Full papers 7+1 pages, short papers 4+1 pages in IJCAI format, single-blind review via EasyChair
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
