notes:
- Workshop series on AI for anomaly detection in spatial, temporal and multimodal data, organized by the iSMART Lab at McGill University
- "Editions so far: WACV 2024, WACV 2025, AAAI 2026, AAAI 2027"
- Follows its host conference (Singapore 2026, Montreal 2027)
- Full papers up to 7 pages plus 2 pages of references in the AAAI-27 format, double-blind review on OpenReview
- No dual submission; in-person presentation required, no remote talks
- The workshop says papers from the previous edition appear in archival proceedings and that 2027 papers are intended to be archival, not yet confirmed
- Not listed in ICORE2026 and not on the CCF list
