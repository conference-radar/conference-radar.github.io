notes:
- Annual since 2013; 15th edition in 2027
- Co-sponsored by IEEE and the IEEE Photonics Society together with the host university
- Proceedings in IEEE Xplore, stated as indexed by EI Compendex and Scopus
- "Recent hosts: Macau 2019, online 2020, Xi'an 2021, Lanzhou 2022, Xi'an 2023, Guilin 2024, Beijing 2025, Xi'an 2026, Guangzhou 2027"
- Full papers 4 to 10 pages; first six pages covered by the registration fee
- Abstract-only presentation without publication is offered
- Not listed in the CORE portal (ICORE2026)
