id: queerinai
name: QueerInAI
full_name: Queer in AI Workshop
type: workshop
tier: minor
areas: [ai, nlp]
region: worldwide
language: english
frequency: multiple-per-year
organizer: Queer in AI (part of oSTEM, a US 501(c)(3) non-profit)
organizer_country: [usa]
proceedings: ACL Anthology (NAACL 2025 archival track)
archival: true
links:
  website: https://www.queerinai.com/
notes:
- Affinity group workshops and socials co-located with several AI and NLP conferences each year (NAACL, ICML, COLM, NeurIPS, EurIPS in 2025)
- The NAACL 2025 workshop had an archival track (short 4-page or long 8-page ACL format papers, peer reviewed) published as Proceedings of the Queer in AI Workshop in the ACL Anthology
- Non-archival track accepts art, poetry, videos and other creative work in any language
- NeurIPS editions present accepted submissions as talks and posters; the pages do not mention proceedings
- NeurIPS 2026 events (joint with Dis-Ability in AI) are tentative and split over Sydney, Paris and Atlanta plus a virtual session
- Deadlines AoE
- Not ranked in ICORE2026 and not on the CCF list
