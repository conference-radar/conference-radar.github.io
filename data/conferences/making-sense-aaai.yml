notes:
  - AAAI workshop on foundation models for sensor data (wearables and biosignals, audio, tactile, industrial telemetry, sensor-language models)
  - Listed as W42 in the AAAI-27 workshop program
  - 1st edition at AAAI-27 in Montreal, half day (afternoon, 14:00 to 18:00) on Tuesday 23 February 2027
  - Research track and demo and dataset track; long papers up to 7 pages and short papers up to 4 pages, AAAI-27 template, unlimited references and appendices
  - Double-blind review on OpenReview; submissions and reviews are not made public
  - Non-archival, no proceedings; accepted papers may be listed on the workshop website by opt-in
  - Best Paper and Best Demo or Dataset awards; in person presentation required
  - All deadlines AoE
  - Not listed in ICORE2026 or the CCF list
