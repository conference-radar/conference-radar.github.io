notes:
- Workshop on spatial reasoning in multimodal LLMs, world models, embodied agents and VLA models, and 3D scene understanding
- 2nd edition held as a half-day workshop at CVPR 2026 (Denver)
- Non-archival; new work and previously accepted papers both welcome
- Up to 8 pages excluding references, CVPR format, double-blind review on OpenReview; accepted papers presented as posters
- Different from MUSTCV (Multimedia Spatial Intelligence through Time) and MusIML
- Not on the CCF list
