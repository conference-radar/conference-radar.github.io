notes:
- Organized by ISI Kolkata (Center for Soft Computing Research, Physics and Applied Mathematics Unit) and the School
  of Computer Engineering, KIIT Bhubaneswar, India, in association with the IEEE Bhubaneswar Section
- Editions in 2015, 2016, 2017, 2020, 2022, 2024 (6th, 19 to 21 Dec) and 2026 (7th); roughly every two years since 2020
- All proceedings from 2015 to 2026 are in IEEE Xplore; the site states Scopus and Web of Science indexing
- Eight tracks covering AI and ML, NLP and LLMs, IoT and sensor networks, cryptography and blockchain, computer vision
  and generative AI
- Not listed in ICORE2026 or the CCF 2026 list
