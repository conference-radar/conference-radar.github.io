notes:
- Major European workshop on thermal and thermo-mechanical reliability issues in electronic components and systems, held since 1995
- Standalone event run by a European steering committee with academic and industry members
- Submission is a 2-page abstract, double-blind reviewed; accepted authors then submit a paper for the workshop proceedings
- Proceedings archived in IEEE Xplore
- Oral and poster presentations, keynotes and a short course the day before; best paper and best poster awards
- Held in a different European city each year (Budapest 2023, Toulouse 2024, Naples 2025, Berlin 2026, Graz 2027)
- Not ranked by CORE (not listed in ICORE2026) or CCF
