notes:
- Hosted by the Universite Francaise d'Egypte with French and Egyptian partner universities; partially sponsored by IEEE Egypt Section
- Started in 2026 (Cairo); 2nd edition in 2027 moves to Alexandria, Egypt
- Proceedings in IEEE Xplore, stated as covered by Scopus and EI
- Eight tracks on sustainability themes, including AI and machine learning, cybersecurity and blockchain, IoT and edge/cloud computing, robotics and quantum computing
- Double-anonymous review via Microsoft CMT; regular papers up to 10 pages, short papers up to 6, PhD posters up to 2
- Not listed in ICORE2026 or the CCF 2026 list
