notes:
- Full-day satellite workshop of IEEE ICASSP 2027 on speech and voice biomarkers for ALS, Parkinson's, Alzheimer's and related diseases
- Papers follow the ICASSP 2027 style and length, are peer reviewed on the ICASSP platform and published in IEEE Xplore
- One author of each accepted paper must present in person; authors need an ICASSP author registration by 10 Feb 2027
- Best Paper Award sponsored by the MDPI journal MAKE, with a planned MAKE special issue for extended papers
- Deadline extended from 11 Nov to 30 Nov 2026 and notification moved from 16 Dec to 31 Dec 2026
- Not listed in ICORE2026 or the CCF list
