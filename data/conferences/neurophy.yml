notes:
- Workshop on neuromorphic computing for physical layer processing in wireless communication and sensing
- 1st edition in 2026, co-located with EWSN 2026 in Dresden, Germany
- Co-chaired by researchers from University of Brescia, University of Padova, Eurecom and DTU; endorsed by the MultiX Horizon JU-SNS project
- Papers up to 6 pages all-inclusive in the EWSN-modified ACM format, double-blind review via HotCRP
- Accepted papers appear in the EWSN proceedings, archived in the ACM Digital Library and indexed in Scopus
- Submission deadline was extended twice in 2026 (June 20 -> July 12 -> July 19)
- Not listed in the CORE portal (ICORE2026)
