id: icwcsn
name: icWCSN
full_name: International Conference on Wireless Communication and Sensor Networks
type: conference
tier: minor
areas: [communications, networking]
region: asia-pacific
language: english
frequency: annual
organizer: Conference secretariat (contact icwcsn_conference@outlook.com) with a host university; Ocean University of China and Warsaw University of Technology chairs for 2026
organizer_country: [china]
proceedings: ACM DL (ACM ICPS)
archival: true
indexing: [EI Compendex, Scopus]
fee: About 430 USD (2026, regular author, early)
typical:
  deadline_months: [2, 3]
  conference_months: [4]
links:
  website: http://www.icwcsn.org/
notes:
- Smaller commercially run conference; secretariat contact via an outlook.com address and submission via zmeeting.org
- 13th edition in 2026; proceedings in the ACM International Conference Proceedings Series every year since 2020
- Proceedings stated as submitted to EI Compendex and Scopus
- "Recent hosts: Warsaw planned for 2020 but held online, Dalian 2021 (fully virtual), online 2022 and 2023, 2024 organized by Sichuan Normal University, Shenzhen 2025, Qingdao 2026"
- Tracks on PHY and fundamentals, MAC and cross-layer design, wireless networks, and emerging technologies and services
- Abstract-only registration offered for presentation without publication
- Not listed in the CORE portal (ICORE2026)
