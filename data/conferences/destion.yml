notes:
- Full-day workshop at IEEE/ACM CPS-IoT Week on modeling, simulation, synthesis, validation and verification tools for CPS and IoT
- 2026 themes were AI for design automation and design automation for AI (automotive, avionics, robotics, buildings, grid, medical devices)
- 8th edition in 2026, Saint Malo, France; location follows CPS-IoT Week
- Full papers up to 6 pages (IEEE two-column) or 2-page abstracts for short, tool, benchmark and demo papers; single-blind review via EasyChair
- Accepted papers appear in the DESTION 2026 proceedings; the CFP does not name a publisher
- At least one author must register and present in person
- Not listed in ICORE2026 or the CCF 2026 list
