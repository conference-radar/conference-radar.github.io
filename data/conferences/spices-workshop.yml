notes:
- Workshop on wireless and embedded systems security and privacy (IoT, CPS, 6G, PUFs, side channels), held with EWSN
- Papers up to 6 pages in the ACM template, double-anonymous review, submission via HotCRP
- Accepted papers are published in ACM as part of the EWSN proceedings
- Small workshop; 2 papers in 2025, run as a joint session with the EMERGE workshop
- 4th edition in 2025; the TII site also has pages for the 2023 and 2024 editions
- Not related to the IEEE SPICES signal processing conference
- Not listed in ICORE2026; not on the CCF 2026 list
