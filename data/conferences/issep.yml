id: issep
name: ISSEP
full_name: 'International Conference on Informatics in Schools: Situation, Evolution and Perspectives'
type: conference
tier: minor
areas: [general]
region: europe
language: english
frequency: annual
organizer: ISSEP Steering Committee with a local host university
organizer_country: [europe]
proceedings: Springer LNCS
archival: true
fee: About 250 EUR early, 300 EUR late for researchers (2026)
typical:
  deadline_months: [4, 5]
  conference_months: [9]
links:
  website: https://issep2026.tlu.ee/
notes:
- Research conference on informatics (computer science) education in schools, from early childhood to higher education, held since 2005
- Proceedings in Springer LNCS for selected full and short papers; other papers, posters and workshop abstracts go to local proceedings on Zenodo
- Full papers up to 12 pages, short papers up to 8 pages, LNCS format, double-blind review
- Includes a doctoral consortium, workshops and posters
- Held in Europe (Lausanne 2023, Budapest 2024, Trier 2025, Tallinn 2026)
- Not listed in ICORE2026; not on the CCF 2026 list
