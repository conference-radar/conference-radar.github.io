notes:
- Symposium and exhibition on electronics and semiconductor thermal management (cooling, thermal measurement and modeling)
- Sponsored and operated by the SEMI-THERM Educational Foundation (STEF), run by volunteers from the thermal industry
- First held in December 1984 in Phoenix, Arizona; the 43rd edition is in San Jose, California in March 2027
- Papers published in IEEE Xplore and the SEMI-THERM Technical Library
- "Three tracks: peer-reviewed paper, non-peer-reviewed paper, presentation only; all start from a two-page abstract"
- Strong industry participation, with an exhibition alongside the technical program
