notes:
- Hybrid conference co-sponsored by IEEE; the 2026 site also shows the IEEE-CS France Chapter, ESIEA and PayQlick logos
- Accepted and registered papers are submitted to IEEE Xplore (PDF eXpress conference ID 72320X); at least one author must register and present, onsite or online
- Papers in the IEEE conference template, submitted through Sparcly
- Main track plus a later special track and a co-located QCSA symposium
- Very fast review cycle (2026 main track notification 10 days after the submission deadline)
- General chairs in 2026 from the University of Murcia, Texas A&M University-San Antonio and the University of Houston
- Not listed in ICORE2026; not on the CCF 2026 list
