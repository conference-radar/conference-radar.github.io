notes:
- Workshop on generative AI for code, with a focus on security, safety, verification and software engineering of AI-generated code
- First edition at ECAI 2025 (Bologna), second at IJCAI-ECAI 2026 (Bremen)
- Regular papers up to 8 pages excluding references in CEUR single-column format; abstract-only oral presentations also accepted
- Double-blind review with at least three PC reviews, submission via EasyChair
- Regular papers in CEUR Workshop Proceedings (2025 is CEUR-WS Vol-4075)
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
