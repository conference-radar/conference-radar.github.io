notes:
- Research and practice workshop of XP (International Conference on Agile Software Development) on how agile teams work with AI assistants and agents
- Builds on the earlier autonomous teams workshops at XP
- First edition at XP 2026 in Sao Paulo, Brazil; XP 2027 is in Tampere, Finland
- Full papers up to 8 pages including references in Springer LNCS/LNBIP format; short industry contributions as 2-page papers or up to 5 slides
- All submissions peer reviewed; selected revised papers published in the XP workshop post-proceedings
- Not listed in CORE ICORE2026 or the CCF 2026 list
