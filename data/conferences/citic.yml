id: citic
name: CITIC
full_name: International Conference on Computer, Information Technology and Intelligent Computing
type: conference
tier: minor
areas: [general, ai, security]
region: southeast-asia
language: english
frequency: annual
organizer: Multimedia University (MMU) Faculty of Computing and Informatics and Faculty of Information Science and
  Technology, as part of the Digital Futures International Congress (DIFCON)
organizer_country: [malaysia]
proceedings: AIP Conference Proceedings (2024 to 2026)
archival: true
indexing: [Scopus]
typical:
  deadline_months: [2, 3]
  conference_months: [5, 6, 7]
links:
  website: https://difcon.mmu.edu.my/citic.html
notes:
- Computing conference of Multimedia University, Malaysia; 7th edition in 2027
- One of six co-located conferences of DIFCON, MMU's yearly academic congress (with MECON, ICTIM, ICCM, CLESS and ICLD)
- Held at MMU Cyberjaya in hybrid mode (2024 was virtual)
- Tracks cover AI and machine learning, software engineering, information systems, image processing, IoT and big data, and security and privacy
- Papers of 2025 and 2026 published in a special volume of AIP Conference Proceedings (max 6 pages); 2024 papers went to indexed journals or AIP proceedings
- For 2027 the site only says papers will appear as proceedings, book chapters or journal papers submitted for Scopus and WoS indexing; no publisher named yet
- Selected papers can be extended for partner journals (JOIV, IJASEIT and MMU Press journals)
- Not ranked by CORE (ICORE2026); not in the CCF list
