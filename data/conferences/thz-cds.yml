notes:
- Held as workshop W10 at IEEE VTC2026-Fall in Boston
- Aims to connect THz device researchers with application researchers (THz communications, devices and sensing)
- Co-organized by Arjun Singh and Priyangshu Sen of SUNY Polytechnic Institute (USA)
- Papers 5 pages, up to 2 extra pages at 100 USD each; submitted through the VTC2026-Fall workshop TrackChair site
- VTC papers go to IEEE Xplore; IEEE may exclude papers not presented at the conference
- Not listed in ICORE2026
