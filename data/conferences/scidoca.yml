notes:
- Workshop of the JSAI International Symposia on AI (JSAI-isAI), held with the JSAI annual conference in Japan each May or June
- Held since 2016 (tenth edition in 2026); chaired by Le-Minh Nguyen (JAIST), advised by Yuji Matsumoto (RIKEN AIP)
- Topics are scientific paper analysis, document and figure/table structure, citation analysis, summarization, retrieval and NLP for scientific documents
- Springer LNCS format; long papers up to 14 pages, short papers up to 7 pages, including references; anonymized review
- Also accepts papers already published or presented elsewhere
- Hybrid; online presentation possible
- JSAI-isAI is published as Springer LNAI proceedings; papers are selected for the volume
- Deadline is usually extended by several weeks
- Not listed in CORE ICORE2026 or the CCF list
