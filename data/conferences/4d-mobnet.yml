notes:
- Workshop co-located with IEEE ICC 2026 (Glasgow, WS08); first edition, not held at ICC 2024 or 2025
- The ICC workshop programme lists it as "Future 4D Mobility Networks"; the workshop page says "Future 4D Transportation Networks"
- Focus on testbed-validated work for ground, UAV, stratospheric and LEO satellite mobility networks with size, weight and power (SWaP) limits
- Topics include vehicle and satellite antennas, RIS, ISAC, channel measurement and radio maps, UAV detection and AI-driven resource management
- Co-chairs include Yufei Zhao, Marco Moretti, Haiming Wang, Wen-Xuan Long, Wang Miao and Deyu Lin
- Papers up to 6 pages in IEEE double-column format (a 7th page costs 100 USD); submissions via EDAS
- Accepted and presented papers go into the IEEE ICC workshop proceedings in IEEE Xplore; in-person presentation required (no-show papers removed)
- Not listed in ICORE2026
