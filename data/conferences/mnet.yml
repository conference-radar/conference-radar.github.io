notes:
- IJCAI workshop on mechanism design, auctions, matching and social choice on social networks
- 2nd edition (MNet-2025) held on 2025-08-29 during the IJCAI 2025 workshop days at the Guangzhou, China site
- Two submission rounds; the second round takes papers not accepted at IJCAI, ECAI, NeurIPS or similar conferences
- Up to 15 pages in LNCS/CCIS one-column format, double-blind, reviewed by at least two PC members, submitted via EasyChair
- Post-proceedings in Springer CCIS; each accepted paper can choose a full paper, a short paper or no publication
- At least one author must present in person
- Not listed in ICORE2026 or the CCF list
