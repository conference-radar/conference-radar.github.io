notes:
- Commercially organized broad conference on electrical, computer and energy technologies, run by ECER Events Limited, Hong Kong
- Accepted papers are submitted to IEEE Xplore and Scopus; the 2026 papers appeared in IEEE Xplore and are indexed by Scopus
- Held in a different city each year (Cape Town 2021 and 2023, Prague 2022, Sydney 2024, Paris 2025, Rome 2026)
- Hybrid format; authors can present in person or online
- Not listed in the ICORE2026 portal or the CCF 2026 list
