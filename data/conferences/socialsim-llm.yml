notes:
  - Workshop on LLM-based social simulation (agent populations, collective dynamics, validation, safety and policy)
  - Host conference changes; COLM 2025 and COLM 2026, then AAAI-27 (Montreal, Monday 22 February 2027) for the 3rd edition
  - 2027 theme is From Proxies to Populations; 2026 theme was Fidelity in Applications
  - Regular papers up to 7 pages, early-stage and replication or resource papers up to 4 pages, references excluded; double-blind via OpenReview
  - Non-archival; accepted papers presented as spotlights or posters
  - 2026 edition had a shared task alongside the paper track
  - Not listed in ICORE2026 or the CCF list
