notes:
- Yearly UK workshop on computational intelligence running since 2001; 25th edition in 2026
- Hosted by a different UK university each year (Aston 2023, Ulster 2024, Edinburgh Napier 2025, Coventry 2026)
- Accepted papers published by Springer in Advances in Intelligent Systems and Computing (AISC)
- Full papers up to 12 pages, short papers (position or work in progress) up to 6 pages
- Registration covers one paper; each extra paper by the same author costs GBP 100 (2026)
- Not listed in CORE ICORE2026 or the CCF 2026 list
