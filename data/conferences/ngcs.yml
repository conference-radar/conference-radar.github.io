notes:
- First edition announced for March 2027 in San Antonio, Texas (hybrid), with local chairs from Texas A&M University San Antonio
- Co-sponsored by the IEEE Lone Star Section (Region 5) and Bethlehem University
- Accepted and presented papers are submitted for possible inclusion in IEEE Xplore; no other publisher or indexing named
- Single-blind review; long papers 7 to 8 pages, short papers 4 to 6 pages, posters and demos 1 to 2 pages
- Tracks on security for AI, AI for security, quantum-ready security, secure software and cloud, threat intelligence, and governance
- Run from the same site and contact address as HAXD and the Generative AI Summer School (Intelligent Systems Events)
- Not listed in the CORE ICORE2026 portal
