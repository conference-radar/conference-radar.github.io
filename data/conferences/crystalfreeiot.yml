notes:
- Workshop on crystal-free and crystal-less radios, chip-scale wireless systems and system-level IoT design
- "Series: invited workshop at Inria Paris (2023), CPS-IoT Week in Hong Kong (2024), EWSN 2025 and EWSN 2026 in Dresden"
- Co-organized by researchers from Villanova University, HKUST (GZ) and Inria Paris
- Regular papers up to 6 pages and poster or demo papers up to 2 pages, ACM format, single-blind review via EasyChair
- Accepted papers are submitted for indexing in the ACM Digital Library with the EWSN proceedings
- Submission deadline was extended twice in 2026 (June 20 -> July 6 -> July 20)
- Not listed in the CORE portal (ICORE2026)
