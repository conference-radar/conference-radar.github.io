notes:
- European conference on free and open source silicon run by the FOSSi Foundation (a UK not-for-profit community interest company) and its volunteers
- Practitioner and research talks on open hardware, RISC-V cores, EDA tools, open PDKs, logic synthesis, verification and analog/mixed-signal design
- Three days (Friday to Sunday) with a Sunday unconference and workshops proposed on the day
- No papers or proceedings; talk recordings go to the FOSSi Foundation YouTube channel
- Pay-what-you-want or professional tickets; 2026 registration closed at capacity
- Venue moves around Europe (Valencia 2025, Ghent 2026)
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
