id: cccis
name: CCCIS
full_name: International Conference on Computer Communication and Information Systems
type: conference
tier: minor
areas: [networking, communications]
region: asia-pacific
language: english
frequency: annual
organizer: Sensors and Systems Society of Singapore (sponsor 2022, 2024, 2025); 2026 conference chairs from Multimedia University, Malaysia
organizer_country: [singapore]
proceedings: IEEE Xplore
archival: true
indexing: [Scopus, EI]
typical:
  deadline_months: [8]
  conference_months: [9]
links:
  website: https://www.cccis.org/
notes:
- 2026 was the 6th edition; editions in 2020, 2021, 2022, 2024, 2025 and 2026 (none in 2023)
- 2024 and 2025 proceedings in IEEE Xplore, indexed in Ei Compendex and Scopus; 2020 proceedings in the ACM Digital Library
- 2020 to 2022 and 2024 held virtually; 2025 in Hong Kong (sponsored by Hong Kong Chu Hai College); 2026 in Melaka, Malaysia
- Timing varies by year (Feb/Mar in 2024 and 2025, September in 2026)
- Single-blind review; submissions via online system or email
- Not related to IC3SIS (id ic3sis)
- Not listed in the ICORE2026 portal or the CCF 2026 list
