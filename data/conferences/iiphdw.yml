notes:
- Workshop for PhD students across engineering fields (automation, communications and signal processing, electrical engineering, computer science, maritime studies and more)
- All accepted and presented papers are submitted for inclusion in IEEE Xplore
- Selected 2027 papers can be extended for an MDPI Sensors special issue (journal submission until 2027-08-31)
- Rotates among universities in Poland, Germany, Czech Republic and Slovakia (Wismar 2019, Lublin 2022, Wismar 2023, Lublin 2025, Wismar 2027)
- Described as annual, but no 2024 or 2026 edition is listed on the history page
- Best Paper and Best Presentation awards, plus scholarships covering the registration fee
- Not listed in ICORE2026 and not on the CCF list
