notes:
- Broad EECS conference run by the Tunisian ASET Association, launched in 2017 and always held in Hammamet, Tunisia
- Ten areas including signal and image processing, AI, communication engineering, embedded systems and IoT, control and robotics, electronics, smart grid and renewable energy
- Proceedings submitted to IEEE Xplore (2026 volume ISBN 979-8-3195-4161-1); the site lists Scopus indexing
- Also takes invited session proposals, due two weeks before the paper deadline
- 2026 was the 9th edition; 2023 to 2025 were held in late April or early May, as is 2027
- Not listed in the ICORE2026 CORE portal
