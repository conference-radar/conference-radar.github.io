notes:
  - AAAI workshop on cooperative multi-agent decision-making and learning; the 2025 theme was Human-Multi-Agent Cognitive Fusion
  - First held at AAAI-24 (subtitled From Individual Needs to Swarm Intelligence), then at AAAI 2025 (Philadelphia, 3 March 2025, full day)
  - Short (2 to 4 pages) and long (6 to 8 pages) papers in AAAI format, single-blind peer review via EasyChair
  - Non-archival; work published or under submission elsewhere may be submitted
  - Not in the AAAI-26 or AAAI-27 workshop lists
  - Not listed in ICORE2026 or the CCF list
