notes:
- Annual developer and technology conference of Kakao, with keynotes and sessions on Kakao AI, products and infrastructure
- Held at the Kakao AI Campus, with shuttle buses from Gangnam and Pangyo stations
- Free to attend online and in person; in 2026 in-person seats went to selected applicants (2025 also had invited guests), one day per applicant
- Keynotes and sessions are livestreamed and replays are published after the event
- 2026 themes were AI in every connection (Day 1) and technology becoming trust (Day 2)
- Past editions listed on the official history page are 2018 to 2022, 2024 and 2025 (no 2023 edition listed)
- The third day of 2025 (September 25) was a Kakao Crew Day for Kakao group employees only
- No call for papers and no proceedings
- Not listed in the CORE ICORE2026 portal
