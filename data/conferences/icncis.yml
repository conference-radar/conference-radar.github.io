notes:
- Small annual conference on networking, communications and information security, first held in 2021 and held in China (Mianyang 2023, Harbin 2025)
- Run with the AEIC Academic Exchange Information Center (AiScholar) and a host university (Central South University hosted the 2023 edition in Mianyang)
- 2025 proceedings published by IEEE (IEEE Xplore), submitted to EI Compendex and Scopus; papers at least 4 pages
- Abstract-only presentation without publication is also offered
- Not listed in CORE ICORE2026
