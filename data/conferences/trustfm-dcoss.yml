notes:
- New workshop co-located with IEEE DCOSS-IoT 2027 in Montreal; 1st edition in 2027
- Not the same venue as the WWW workshop TrustFM (Trustworthy Foundation Models for Web Intelligence)
- Papers appear in the DCOSS-IoT 2027 workshop proceedings in IEEE Xplore
- Foundation models for sensor, time-series and multimodal data, robustness, explainability, efficient and federated FMs
- Single-blind, at least three reviews; regular papers up to 6 pages, short or position papers up to 4 pages
- Submission via EasyChair (opens soon per the CFP); deadlines 23:59 AoE
- Not listed in ICORE2026 or the CCF list
