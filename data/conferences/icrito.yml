notes:
- Organized by the Amity Institute of Information Technology at Amity University, Noida (Delhi NCR), India
- Accepted and presented papers are submitted to IEEE Xplore; earlier proceedings are in IEEE Xplore and Scopus indexed
- Held in 2010, 2013 to 2018, 2020, 2021, 2024 and 2025; no edition in 2026, 13th edition moved to February 2027
- Broad scope covering reliability engineering, ICT, optimization, AI, network security, IoT, blockchain, cloud and data science
- Papers up to 6 pages in IEEE double-column format, double-blind review via Microsoft CMT
- Hybrid format with in-person and virtual participation
- Not listed in ICORE2026
