notes:
- Annual conference of Amity University in Noida, India; the 2027 edition (January) is the 17th
- The official past conference page links IEEE Xplore proceedings for the editions from 2013 to 2026 (no 2015 entry); the 2012 papers appeared in an IJCA special issue
- 2027 edition technically co-sponsored by the IEEE UP Section (IEEE conference record 71526), with IET as knowledge partner
- Broad scope covering cloud computing, data science, AI and ML, IoT, cybersecurity, blockchain, NLP and computer vision
- Double-blind review by at least two reviewers through Microsoft CMT; 5 to 6 page papers, extra pages charged
- Different venue from iwc-confluence
- Not listed in CORE ICORE2026 or the CCF list
