id: ic-sit
name: IC-SIT
full_name: International Conference on Intelligent Computing and Sustainable Innovations in Technology
type: conference
tier: minor
areas: [ai, data, general]
region: south-asia
language: english
frequency: biennial
organizer: Silicon University, Odisha
organizer_country: [india]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [4, 8]
  conference_months: [9, 11]
links:
  website: https://ic-sit.netlify.app/
notes:
- Organized and hosted by Silicon University, Bhubaneswar, Odisha, India
- Proceedings in IEEE Xplore (IEEE conference record 69723 for 2026, 63503 for 2024)
- Hybrid; delegates can attend in person or present remotely
- Editions so far in 2024 (1st) and 2026 (2nd)
- Broad IT scope in six tracks (intelligent learning, data science and business analytics, communication networks, and others)
- Papers up to 6 pages in IEEE two column format, similarity index below 20%
- Selected extended papers invited to a special issue of SN Computer Science
- Not listed in ICORE2026; not on the CCF list
