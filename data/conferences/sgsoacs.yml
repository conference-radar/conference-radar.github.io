links:
  website: https://sgsoacs.eu/
notes:
- Small symposium promoting applied computer science collaboration mainly between Spanish and German universities; 2026 was the 12th edition
- Topics include complex event processing, cyber security and blockchain, data science, human activity recognition, smart cities, software architecture, engineering and testing
- Accepted papers published by Springer Nature in CCIS (11th edition proceedings appeared in 2025)
- Full papers 12 to 15 pages, short papers 6 to 11 pages; one-page extended abstracts are presented but not published
- At least three PC reviews per paper, no rebuttal; submission through Springer Meteor
- Held in Central Europe (Vienna 2025, Oberursel near Frankfurt 2026)
- Not listed in the CORE ICORE2026 portal or the CCF list
