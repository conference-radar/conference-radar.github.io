notes:
- Workshop co-located with IEEE ICC 2026 (Glasgow, WS07); first edition, not held at ICC 2024 or 2025
- Covers FR3 (7 to 24 GHz) channel measurements and modeling, RF hardware and massive MIMO, spectrum management, ISAC, multi-band 6G and testbeds
- Accepted and presented papers go into the IEEE ICC workshop proceedings in IEEE Xplore; in-person presentation required (no-show papers removed)
- Submissions via EDAS through the ICC workshop call
- Not listed in ICORE2026
