notes:
- Workshop on blockchain theory and applications; held with ISCC in 2020 and 2021, with IEEE PerCom since 2022; 8th edition in 2027
- Papers go into the PerCom workshop proceedings in IEEE Xplore
- Double-blind review; 6 pages in IEEE format, one extra page can be bought
- Every accepted paper needs a full author registration (no workshop discount) and in-person presentation
- Location follows PerCom (Washington DC 2025, Pisa 2026, Goa 2027)
- Not the same venue as BRAINS (Conference on Blockchain Research and Applications for Innovative Networks and Services)
- Not listed in ICORE2026; not on the CCF 2026 list
