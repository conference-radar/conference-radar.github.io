notes:
- Called World Conference on Computer and Information Security for the 2024 and 2025 editions; renamed from the 3rd edition (2026)
- Host changes each year (2025 Xiangtan University, 2026 Huizhou University); AiScholar provided technical support and logistics in 2026
- Proceedings of 2025 and 2026 in IEEE Xplore (2025 via IEEE CPS); 2024 proceedings in Springer LNICST
- Broad CS topics (AI, vision, software, cloud, blockchain) plus information security (network security, IoT security, privacy, biometrics)
- Held in China (2024 Guilin, 2026 Huizhou); 2025 edition was online
- Not listed in CORE ICORE2026 or the CCF list
