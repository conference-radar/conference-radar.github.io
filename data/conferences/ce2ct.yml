notes:
- Run by Graphic Era Hill University, Bhimtal Campus, Uttarakhand, India; technically co-sponsored by IEEE (IEEE conference record 68422)
- First edition 21-22 February 2025 under the auspices of the IEEE Uttar Pradesh Section, published in IEEE Xplore and indexed in Scopus
- Second edition 2-4 July 2026, in person at the Bhimtal campus
- Staged submission rounds with rolling notification (three rounds in 2026)
- Broad scope covering computer science, electrical, electronics and communication technologies
- Not listed in CORE ICORE2026 or the CCF 2026 list
