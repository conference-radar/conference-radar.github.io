notes:
- Indian edition of the Accellera-supported DVCon series on design and verification of chips and systems
- Steering committee of industry and academic members (Analog Devices, Intel, Google, Qualcomm, Siemens EDA, IIT Palakkad, ...) with Accellera chairs
- "Topics: architecture exploration and system design (incl. ESL and high-level synthesis), design implementation, design verification and pre-silicon validation, AMS verification, post-silicon validation, AI/ML design"
- Extended abstract of 600 to 1,200 words first, then a final paper of up to 8 pages; papers and posters selected
- Past proceedings (2014 to 2023) are linked to the DVCon online proceedings archive run by Accellera
- 2026 edition held in Bangalore with tutorials, workshops, panels, a design contest and an exhibition
- Not listed in the CORE ICORE2026 portal or on the CCF list
