links:
  website: https://www.icrera.org/
notes:
- Annual conference on renewable energy, power electronics and smart grids, held since 2012; power and energy scope rather than computing
- Proceedings of the 2012 to 2025 editions are in IEEE Xplore and indexed in Scopus
- Selected papers go to IEEE Transactions on Industry Applications, IJRER, ijSmartGrid and AIra
- Rotates between countries (Nagasaki 2024, Vienna 2025, Paris 2026, Glasgow 2027)
- Submission is a 3 to 5 page long digest in IEEE format via Microsoft CMT; includes an IEEE IAS workshop
- Late deadlines, about two months before the conference
- Not listed in CORE ICORE2026 or in the CCF 2026 list
