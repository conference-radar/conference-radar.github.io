notes:
- Half-day workshop on large language models for HPC (programming environments, runtimes, scientific applications, hardware design, benchmarking), held with ISC High Performance in Hamburg
- First edition in 2025, second in 2026; chaired by Pedro Valero-Lara (ORNL)
- Full papers of 6 to 12 pages in Springer LNCS format including references, plus up to two extra pages after review
- Accepted papers appear in the ISC High Performance workshop proceedings published by Springer
- Submissions through the ISC Linklings system (EasyChair in 2025); a Best Paper Award is given
- Not listed in CORE ICORE2026
