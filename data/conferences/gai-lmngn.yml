notes:
- Workshop on generative AI and large models for 6G networks (resource allocation, semantic communication, space-air-ground and vehicular networks, in-network training and inference, security)
- Co-chaired in 2026 by Sihua Wang (BUPT), Liang Li (Pengcheng Laboratory), Ye Hu and Mingzhe Chen (University of Miami) and Biqian Feng (University of Macau); steering committee Zhu Han, Shuguang Cui, Kai-Kit Wong and Arumugam Nallanathan
- WS20 at IEEE ICC 2026 (Glasgow); the same chairs run WS-40 "Generative AI Empowered Next-Generation Networks" at IEEE GLOBECOM 2026 (Macau)
- Workshop papers go into the ICC or GLOBECOM proceedings and IEEE Xplore; no-show papers are removed
- Not listed in ICORE2026 or in the CCF 2026 list
