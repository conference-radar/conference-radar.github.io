notes:
- European edition of DFRWS (sister events in the USA and Asia-Pacific); renamed Digital Forensics Conference (DFC) Europe from 2027
- 'Full research papers (up to 10 pages, blinded) get double-blind review and may appear in Forensic Science International: Digital Investigation (Elsevier)'
- Also takes practitioner talks and demos, posters, workshops, Birds of a Feather sessions and a co-located Digital Forensics Doctoral Symposium
- Held in a different European city each year (Linkoping 2026, Edinburgh 2027)
- Not listed in CORE ICORE2026
