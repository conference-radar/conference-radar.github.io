notes:
- Broad ICT conference run by the GR Foundation group (sister events SmartCom, ICTIS, ICT4SD, ICICT London)
- Proceedings in Springer Lecture Notes in Networks and Systems
- Held in India every year; Jaipur in 2020, 2021, 2023, 2024 and 2025, Chandigarh in 2022, Ahmedabad in 2026
- Hybrid; in 2026 only the first day (16 Dec) is physical and the remaining three days are online
- Three tracks (ICT for infrastructure and computation, engineering applications, e-governance); submissions through the
  SmartCom submission portal
- Very large, high-acceptance event typical of this organizer; regarded as a minor venue
- Not the Italian Conference on Theoretical Computer Science (ictcs) or the Jordanian ICTCS (ictcs-jo)
- Not listed in ICORE2026
