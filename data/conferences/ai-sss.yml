notes:
- Workshop of IEEE/ACM BDCAT (held jointly with UCC) on AI for secure software and systems; 3rd edition in 2026 after 2024 and 2025
- Organized by Yasir Malik (Bishop's University) with Fehmi Jaafar and Haifa Nakouri (UQAC)
- Papers up to 6 pages in IEEE double-column format via EasyChair; at least three reviews per paper
- Proceedings published by IEEE and submitted to IEEE Xplore; one author must register for the conference
- Follows UCC/BDCAT (Sharjah 2024, Nantes 2025, Florianopolis 2026)
- Not found in the ICORE2026 CORE portal search
