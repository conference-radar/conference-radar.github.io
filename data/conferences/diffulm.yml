  website: https://7amin.github.io/diffulm-neurips2026/
notes:
  - NeurIPS 2026 workshop on diffusion language models and related non-autoregressive methods (foundations, efficiency, reasoning, systems)
  - Described as the first NeurIPS workshop dedicated to diffusion language models
  - Two tracks, extended abstracts (up to 4 pages) and short papers (up to 8 pages), in the NeurIPS 2026 style
  - Double-blind review on OpenReview with at least three reviews per submission
  - Non-archival; work already published at an archival venue is not eligible
  - Best Paper and Best Student Paper awards
  - Each accepted paper gets one reserved NeurIPS registration at the Sydney site
  - Not listed in ICORE2026 or the CCF list
