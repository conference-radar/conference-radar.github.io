notes:
- 2nd edition held as workshop W9 at IEEE VTC2026-Fall in Boston
- Topics are energy-efficient and AI-native vehicular networks (zero-touch automation, vehicular digital twins, renewable-powered roadside units, satellite and UAV links, EV charging networks)
- Co-organizers from Prince Sultan University (Saudi Arabia), Toronto Metropolitan University (Canada) and BITS Pilani Hyderabad (India)
- Papers 5 pages, up to 2 extra pages at 100 USD each; submitted through the VTC2026-Fall workshop TrackChair site
- Final papers go through the VTC2026-Fall IEEE Conference Publishing upload, for archiving in IEEE Xplore; IEEE may exclude papers not presented
- Not listed in ICORE2026
