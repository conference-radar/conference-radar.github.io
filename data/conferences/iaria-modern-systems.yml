notes:
- Organized by IARIA as part of the SocSys congress, co-located with PANDEMICS ANALYTICS, SOCIETY TRENDS, AIVTS and other IARIA events (annual since 2022)
- Covers systems engineering, including lifecycle and requirements, cyber-physical and embedded systems, cloud and IoT, ML-enabled systems, safety and cyber-security by design
- Published open access in the IARIA ThinkMind library (ISBN 978-1-68558-436-8 in 2026); prints via Curran Associates; selected papers invited to IARIA journals
- Not listed in ICORE2026 or the CCF 2026 list; IARIA events are generally regarded as low-selectivity
- Held in Nice (2022), Valencia (2023), Nice (2024), Barcelona (2025), Lisbon (2026); onsite and online participation offered
