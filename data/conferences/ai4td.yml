notes:
- Research workshop of XP (International Conference on Agile Software Development) on how AI creates and helps manage technical debt in agile development
- First edition at XP 2026 in Sao Paulo, Brazil; XP 2027 is in Tampere, Finland
- Long papers up to 9 pages, discussion papers and industrial experience reports up to 6 pages, tool or method demos up to 4 pages and lightning talks up to 2 pages, Springer LNCS template
- Single-blind review with at least three reviews per paper
- Accepted long and short papers appear in the digital library (Springer XP post-conference proceedings); tool demos and lightning talks are not published
- Best papers may be invited to a journal special issue (tentative)
- Not listed in CORE ICORE2026 or the CCF 2026 list
