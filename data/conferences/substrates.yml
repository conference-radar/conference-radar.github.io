notes:
- Workshop on software substrates, malleable software and interactive computational media, held with ‹Programming› since 2025
- Editions in Prague 2025, Munich 2026 and Kyoto 2027
- 2026 accepted 2 to 4 page papers, videos up to 10 minutes and demo descriptions; proceedings with reviews posted on software-substrates.github.io (informal, no DOI)
- From 2027, peer-reviewed papers (ACM sigplan format, about eight pages suggested, no page limit) go into the ‹Programming› Conference Companion in the ACM DL
- Demos and short talks (video up to 5 minutes) are reviewed but appear only in the web proceedings
- Discussion-centered format with a discussant after each talk; remote participation possible
- Not listed in ICORE2026 or the CCF 2026 list
