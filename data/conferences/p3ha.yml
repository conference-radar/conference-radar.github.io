notes:
- Half-day CVPR workshop on photorealistic 3D head avatars, run around the NeRSemble benchmark challenges
- 1st edition at CVPR 2025 (Nashville), 2nd at CVPR 2026 (Denver)
- No call for papers; the program is invited talks plus talks by the challenge winners
- 2026 challenges were single-view 3D face reconstruction and a monocular FLAME avatar challenge
- Each challenge winner gets a 15-minute oral slot and an NVIDIA-sponsored GPU
- Not on the CCF list
