notes:
- One-day workshop co-located with ICCAD, held since 2024 (3rd edition in 2026)
- Invited talks plus a poster session; the open call is for 1 to 3 page poster proposals via EasyChair
- Accepted 200 to 250 word poster abstracts are posted on the workshop website; non-archival
- At least one author per accepted poster must register for ICCAD and present in person
- 'Past venues: Newark NJ 2024, Munich 2025, San Jose 2026 (following ICCAD)'
- Not listed in the CORE ICORE2026 portal
