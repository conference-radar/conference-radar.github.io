notes:
- Workshop on energy-efficient and trustworthy AI for wireless communications and networking, co-located with IEEE GLOBECOM
- Held at GLOBECOM 2025 (WS-09, Taipei, afternoon session) and GLOBECOM 2026 (WS-32, Macau, half day)
- 2026 co-chairs are Yan Kyaw Tun, Nguyen Van Huynh, Dusit Niyato, Yaru Fu, Viet Quoc Pham and Zhu Han
- 2026 program has 9 papers in two sessions
- Workshop papers go into the GLOBECOM proceedings and IEEE Xplore
- Not listed in ICORE2026 or in the CCF 2026 list
