notes:
- Half-day workshop on using low- and mixed-precision hardware for scientific computing while keeping accuracy and stability (iterative refinement, Ozaki schemes, precision tuning tools, HPC benchmarks)
- 1st edition with IPDPS 2026 in New Orleans was invited talks and a panel only, non-archival with no paper call
- From 2027 there is a call for papers; accepted papers appear in the IPDPS workshop proceedings, which IPDPS submits to IEEE Xplore after the conference
- 2027 submissions go through the IPDPS Linklings system; at least one author must register and present in person
- About six selected-paper presentations planned for 2027, plus invited contributions
- Work that only applies established mixed-precision techniques to AI training or inference is out of scope
- Not listed in the CORE portal (ICORE2026); not on the CCF 2026 list
