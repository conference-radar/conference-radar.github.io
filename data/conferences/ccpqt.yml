id: ccpqt
name: CCPQT
full_name: IEEE International Conference on Computing, Communication, Perception and Quantum Technology
type: conference
tier: minor
areas: [communications, general]
region: china
language: english
frequency: annual
organizer: Conference committee of Chinese universities (general chairs from Northeastern University, Southeast University and Beijing University of Technology)
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
fee: 3,800 CNY per paper regular, 3,600 CNY student author, 1,500 CNY attendance only (2027)
typical:
  deadline_months: [6]
  conference_months: [8, 10]
links:
  website: https://www.ccpqt.org/
notes:
- Chinese conference on computing, communication (wireless, optical, satellite, quantum), perception and sensing, and quantum technology
- Proceedings of every edition since 2022 are in IEEE Xplore
- Held in China every year (Xiamen 2022 and 2023, Zhuhai 2024, Ordos 2025, Huludao 2026 per IEEE metadata, Beijing 2027)
- 2027 edition at the International Cultural Exchange Center of Beijing University of Technology
- Papers up to 5 pages per registration, extra pages charged; registration handled by email with the secretariat
- Not listed in the CORE ICORE2026 portal or the CCF list
