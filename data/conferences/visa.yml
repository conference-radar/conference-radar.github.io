notes:
  - Workshop on virtual ISAs between programming models and accelerator backends, including MLIR dialects, PTX, SPIR-V, tile ISAs and interfaces for LLM code agents
  - First edition held with MICRO 2026 in Athens as a half-day afternoon workshop with invited talks and six accepted papers
  - Short papers of 4 to 6 pages in the IEEE two-column template (work in progress, position, vision, early results)
  - Single-blind review through HotCRP by at least three committee members
  - Non-archival; accepted papers are available on the workshop site and can be published elsewhere later
  - Not listed in CORE ICORE2026 or the CCF list
