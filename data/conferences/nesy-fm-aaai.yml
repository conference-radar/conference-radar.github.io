notes:
  - AAAI workshop on integrating foundation models with symbolic AI (verification, program synthesis, theorem proving, symbolic memory, constraint-guided learning)
  - Listed as W31 in the AAAI-27 workshop program
  - 1st edition at AAAI-27 in Montreal, half day (afternoon) on Tuesday 23 February 2027
  - Non-archival; full papers up to 8 pages and short papers up to 4 pages in the AAAI 2027 template, appendices unlimited
  - Position papers, benchmarks, system descriptions and work in progress also welcome
  - Submitted via OpenReview, three reviews per paper planned with senior meta-review
  - Accepted papers presented as posters, selected ones as orals; in person only
  - All deadlines AoE
  - Not listed in ICORE2026 or the CCF list
