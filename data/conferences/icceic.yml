id: icceic
name: ICCEIC
full_name: International Conference on Computer Engineering and Intelligent Control
type: conference
tier: minor
areas: [ai, networking, security, general]
region: china
language: english
frequency: annual
organizer: Host Chinese university each year (South China University of Technology in 2026, Guangdong University of
  Technology in 2025), with technical services by AiScholar
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI Compendex, Scopus]
fee: 630 USD regular, 570 USD early bird before Aug 31, 600 USD student (2027, 4 pages)
typical:
  deadline_months: [8]
  conference_months: [10]
links:
  website: http://www.icceic.org/
notes:
- Held in China every October; 2025 and 2026 editions were both in Guangzhou
- The 2026 edition was titled IEEE-ICCEIC and held with IEEE sponsorship; proceedings of the 2020 to 2025 editions are
  IEEE conference proceedings, and the site lists all of them as EI and Scopus indexed
- Broad topics from AI and computer vision to software engineering, network engineering, network security and control
- Abstract-only submissions are accepted for presentation without publication
- Not listed in CORE ICORE2026 or the CCF list
