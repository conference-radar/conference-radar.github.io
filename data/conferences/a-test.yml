notes:
- Workshop on automated testing; formerly titled Workshop on Automated Test Execution
- Host conference changes, ESEC/FSE 2022 (Singapore), ISSTA/ECOOP 2024 (Vienna), IEEE ICST 2025 (Naples)
- 2025 edition was the 16th and merged with INTUITESTBEDS (user interface test automation), with a focus on UI testing
- Full papers 8 to 10 pages, work-in-progress and tool papers up to 4 pages, IEEE template; three reviews per paper
- 2025 accepted papers published in the IEEE digital library with the ICST workshops
- Different from the ICSE AST conference (id ast)
- Not listed in the ICORE2026 portal or the CCF 2026 list
- 17th edition in 2026 co-located with PROFES 2026 in Karlskrona, theme testing AI systems and AI-enabled software
