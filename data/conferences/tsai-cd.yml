notes:
- Workshop of the IEEE Conference on Dependable and Secure Computing (DSC); first held at DSC 2026 at Fordham University, New York
- Accepted papers are published in IEEE Xplore as part of the IEEE DSC proceedings; one author must register for the conference
- Full papers up to 6 pages and poster papers up to 2 pages, IEEE two-column format, submitted through EDAS
- Half-day workshop in 2026 with ten technical presentations and a distinguished talk; advance registration through DSC
- Sometimes listed elsewhere as AICyDef; the official acronym is TSAI-CD
- Not listed in ICORE2026; not on the CCF 2026 list
