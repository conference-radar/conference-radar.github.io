id: ccisp
name: CCISP
full_name: International Conference on Communication, Image and Signal Processing
type: conference
tier: minor
areas: [communications, vision]
region: china
language: english
frequency: annual
organizer: Asia Pacific Institute of Science and Engineering (APISE) with Sichuan University and a host university
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI Compendex, Scopus]
typical:
  deadline_months: [5, 7]
  conference_months: [11]
links:
  website: http://www.ccisp.org/
notes:
- Sponsored by APISE and co-organized by Sichuan University; mostly held in Chengdu (2026 Hefei, 2024 Gold Coast,
  Australia, 2021 virtual)
- Proceedings in IEEE Xplore since 2020, indexed in Ei Compendex and Scopus; 2016 to 2019 went to IOP Journal of
  Physics Conference Series
- Two submission rounds; each paper reviewed by 2 to 3 experts, results in 20 to 30 days
- Technically sponsored by an IEEE section (IEEE Nanjing Section in 2026)
- Selected extended papers recommended to MDPI journals
- Not listed in CORE ICORE2026 or the CCF list
