notes:
  - ICML workshop on resource-efficient and adaptive inference of foundation models (elastic architectures, early exit, MoE, speculative decoding, compression, HW/SW co-design)
  - Held at ICML 2026 in Seoul
  - Non-archival; work under submission elsewhere is accepted, but simultaneous submission to other ICML 2026 workshops is discouraged
  - Full papers and short position or experience papers, up to 6 pages excluding references in ICML format; double-blind review on OpenReview
  - Also ran an Efficient Qwen inference competition in 2026
  - Not listed in ICORE2026 and not on the CCF list
