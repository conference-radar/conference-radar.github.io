notes:
- Conference and expo on real-time and multimedia communications, network technologies, AI, security and quality of experience
- Held every year at Illinois Institute of Technology, Chicago
- Research track papers are peer reviewed and accepted and presented papers are submitted to IEEE Xplore
- Regular papers 4 to 8 pages, work-in-progress papers up to 4 pages (IEEE two-column)
- The IEEE CQR workshop is collocated and its papers go through the research track submission
- Not listed in ICORE2026
