notes:
- Large federated congress run by the American Council on Science and Education; sister event of CSCI (December)
- Held every July in Las Vegas (Luxor Hotel), about 21 joint conferences in 2026
- Tracks include SAM (Security and Management), ICWN (Wireless Networks), ICAI (Artificial Intelligence), PDPTA, IPCV, ICDATA and SERP
- Proceedings by Springer Nature; 2024 track papers appeared as revised selected papers in Springer CCIS
- Rolling review with a decision about one week after submission, final cutoff in early July
- Online presentation options offered alongside the in-person event
- Very large event with rolling decisions, widely regarded as low tier
- "CORE rank: National: USA (ICORE2026, listed as WORLDCOMP); not on the CCF 2026 list"
