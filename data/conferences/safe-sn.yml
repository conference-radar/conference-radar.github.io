notes:
- Small workshop on privacy, security, trust and misinformation in social networks
- 1st edition with ASONAM 2024 at the University of Calabria, Rende, Italy; 2nd edition with SNAMS 2025 in Vienna, Austria
- Program chairs are Francesco Buccafurri (Univ. Mediterranea of Reggio Calabria) and Sara Lazzaro (Univ. of Calabria)
- Full papers up to 6 pages in IEEE format, submitted via EasyChair; at least one author must register and present
- Accepted papers appear in the IEEE Proceedings of SNAMS 2025 as workshop papers
- Not found in ICORE2026; not on the CCF 2026 list
