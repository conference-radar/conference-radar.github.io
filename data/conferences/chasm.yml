links:
  website: https://sites.google.com/view/chasm-micro26/home
notes:
  - Workshop on disaggregated and heterogeneous AI infrastructure, covering compilation and orchestration, memory pooling, interconnects and characterization of AI workloads
  - Held with MICRO 2026 in Athens as a morning workshop
  - Full papers 8 to 10 pages and short or position papers 4 to 6 pages, excluding references, in ACM templates
  - Double-blind review by at least three program committee members; submissions through EasyChair
  - Accepted papers are published on the workshop site only
  - Not listed in CORE ICORE2026 or the CCF list
