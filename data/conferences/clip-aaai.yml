id: clip-aaai
name: CLIP-AAAI
full_name: AAAI Workshop on Creative AI for Live Interactive Performances
type: workshop
tier: minor
areas: [ai]
region: worldwide
language: english
frequency: annual
organizer: CLIP workshop organizers (chair at the University of Nottingham); co-located with AAAI
organizer_country: [europe]
proceedings: Springer CCIS
archival: true
typical:
  deadline_months: [10, 11]
  conference_months: [1, 2]
links:
  website: https://sites.google.com/view/clip27
notes:
  - AAAI workshop on creative AI for live interactive performances (music, dance, real-time generative models, live demos)
  - Not the MICCAI CLIP workshop (clip-miccai)
  - 1st edition at AAAI-26 in Singapore (26 January 2026); 2nd edition at AAAI-27 in Montreal
  - Accepted original full papers can be published in Springer CCIS (2026 edition in CCIS volume 2865)
  - Full papers up to 15 pages excluding references in Springer format, or extended abstracts up to 300 words presented as posters
  - Submission via EasyChair
  - Invitation-based attendance, up to about 30 participants; presentations in person only
  - Submission deadlines AoE
  - Not listed in ICORE2026 or the CCF list
