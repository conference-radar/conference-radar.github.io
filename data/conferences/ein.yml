notes:
- Workshop co-located with IEEE INFOCOM; first held with INFOCOM 2026 in Tokyo (half day), second edition with INFOCOM 2027 in Honolulu (full day)
- Topics are networking for embodied and agentic intelligence (semantic communication, edge and in-network computing for embodied AI, multi-agent coordination, testbeds and simulators)
- Accepted and presented papers appear in the IEEE INFOCOM workshop proceedings and IEEE Xplore
- Papers up to 6 pages in IEEE two-column format including references; single-blind review (EDAS in 2026, ReviewsDue in 2027); at least one author must present in person
- Steering committee chaired by Baochun Li (University of Toronto); 2027 general co-chairs from Stevens Institute of Technology and HKUST (Guangzhou)
- Ten accepted papers in the 2026 program
- Not listed in ICORE2026
