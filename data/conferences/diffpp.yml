notes:
- Informal workshop on automatic differentiation of parallel and HPC programs, differentiable languages and frameworks, for scientific computing and machine learning
- Held with PPoPP since 2024 (PPoPP 2024, PPoPP 2025, PPoPP 2026 in Sydney)
- Invited talks plus lightning talks; lightning talk proposals submitted through a Google form, rolling review
- Previously published material is welcome; accepted abstracts are shared on the website only, no formal publication
- Half-day program on February 1, 2026 at ICC Sydney (HPCA/CGO/PPoPP/CC 2026)
- Not listed in the ICORE2026 portal or the CCF 2026 list
