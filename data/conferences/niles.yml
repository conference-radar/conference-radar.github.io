notes:
- Run by Nile University and held on the NU campus in Sheikh Zayed, Giza, Egypt; 8th edition in 2026 (series since 2019)
- IEEE-sponsored (NILES2024 carried IEEE conference record 63360); papers are Scopus-indexed
- Four tracks -> electrical engineering, communications, industrial and mechanical engineering, and computer science, informatics and biomedical engineering
- Short papers, 4 pages in IEEE double-column format, submitted anonymously via EDAS
- "Similarity limits: 30% overall, 10% to a single source (2026)"
- Not listed in ICORE2026 or the CCF 2026 list
