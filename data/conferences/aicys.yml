- Selected papers are recommended to the Journal of Advanced Manufacturing Technology (JAMT, Scopus), for an additional fee
- Full papers up to 6 pages, reviewed through Microsoft CMT
- Two-day event (2026 programme on September 14 and 15); very low registration fee
- Not listed in ICORE2026; not on the CCF 2026 list
