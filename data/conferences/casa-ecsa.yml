notes:
- Half-day workshop co-located with the European Conference on Software Architecture (ECSA)
- Covers architectures of context-aware, autonomous and smart systems, self-adaptive systems, IoT, edge and cloud, model-driven engineering, AI and LLMs in such systems, robotics and CPS security
- 2025 was the 8th edition (ECSA 2025, Limassol)
- ECSA 2026 tracks and workshops proceedings published by Springer in LNCS (volume 16991)
- Full papers up to 16 pages and short or position papers up to 8 pages in LNCS style, at least 3 reviewers per paper
- At least one author must attend and present
- Not to be confused with CASA (Computer Animation and Social Agents)
- Not listed in ICORE2026 or the CCF 2026 list
