notes:
- Workshop on systems for immersive, mixed and virtual reality environments (17th edition in 2025), co-located with ACM MMSys
- Accepted papers are archived in the ACM Digital Library as part of the ACM MMSys proceedings
- Full papers up to 6 pages and short papers up to 3 pages, excluding references; ACM sigconf template, double-blind review on HotCRP
- At least one author must present in person
- Rotates worldwide with MMSys (Stellenbosch 2025, Hong Kong 2026, Ghent 2027)
