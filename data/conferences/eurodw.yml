notes:
- One-day doctoral workshop for PhD students in computer systems, co-located with EuroSys every year; 20th edition in 2026
- Held with EuroSys in Europe (online 2020 and 2021, Rennes 2022, Rome 2023, Athens 2024, Rotterdam 2025, Edinburgh 2026)
- Submissions are 2-page research proposals (2-column, 10pt, references excluded) describing the planned PhD work
- No published proceedings, so work in progress and simultaneous submissions are allowed
- Not listed in CORE ICORE2026 or the CCF list
