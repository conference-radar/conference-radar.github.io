notes:
- Small online conference run by the STEAM Robotics Academy with technical support of the IEEE El Salvador Section
- Online every year since 2020; sessions run on El Salvador time (UTC-6)
- All six editions so far (2020 to 2025) are in IEEE Xplore and indexed in Scopus; 2026 is IEEE conference record 72035
- Four tracks (AI and machine learning, networks, IoT, signal processing); full papers up to 6 pages, double-blind review via Microsoft CMT
- Low registration fee (100 to 150 USD in 2026)
- Not listed in the CORE ICORE2026 portal or the CCF list
