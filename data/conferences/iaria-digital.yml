notes:
- Organized by IARIA as the lead event of the DigiTech congress, co-located with IoTAI, GPTMB and AIMEDIA
- Broad scope on digital transformation (communications, transportation, healthcare, smart cities, factories, agriculture, security and privacy)
- Published open access in the IARIA ThinkMind library; prints via Curran Associates; selected papers invited to IARIA journals
- Onsite and online participation options offered in recent editions
- Held in southern Europe (Valencia 2022, Porto 2023 and 2024, Venice 2025, Nice 2026, Valencia 2027)
- Moved from November (2021, 2022) and September (2023) to early July from 2024
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
