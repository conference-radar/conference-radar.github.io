notes:
- Organized by IARIA as part of the DigitalWorld congress, co-located with ICDS, ACHI, eTELEMED, eKNOW, ALLSENSORS and other IARIA events (12th edition in 2027)
- Covers accessibility and inclusive design for IoT and smart environments, assistive technology, accessible interaction and accessibility testing
- Published open access in the IARIA ThinkMind library (ISSN 2519-8378); prints via Curran Associates; selected papers invited to IARIA journals
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Held in southern Europe (Nice, Porto, Venice, Barcelona in recent years); onsite and online participation options
- IARIA deadlines are often extended after the initial date
