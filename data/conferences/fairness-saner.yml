id: fairness-saner
name: FAIRNESS
full_name: International Workshop on Fairness in Software Systems
type: workshop
tier: minor
areas: [software, ai]
region: worldwide
language: english
frequency: annual
organizer: FAIRNESS workshop chairs (University of Salerno, Polytechnique Montreal, University of Bari), co-located with IEEE SANER
organizer_country: [europe, canada]
proceedings: IEEE Xplore (SANER companion proceedings, SANER-C)
archival: true
typical:
  deadline_months: [10, 12]
  conference_months: [3]
links:
  website: https://fairness27.github.io/
notes:
  - Workshop on software fairness, bias in ML models and LLMs, fairness in the development lifecycle, fairness debt and agentic systems
  - Held every year with IEEE SANER since 2025 (Montreal 2025, Limassol 2026, Richmond 2027)
  - Accepted papers appear in the SANER companion proceedings (SANER-C) in IEEE Xplore; at least one author must register (full, non-student) and present
  - Full papers 5 to 8 pages, short papers 4 pages, position papers 2 pages, IEEE format, double-anonymous review
  - 2026 edition had 4 accepted papers plus a panel
  - Each edition uses its own website (the 2026 site fairnessworkshop.github.io no longer resolves)
  - Not listed in the CORE portal (ICORE2026)
