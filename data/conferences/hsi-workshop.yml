id: hsi-workshop
name: HSI
full_name: "Workshop on Human-Scene Interaction: Towards Scene-Aware Motion, Communication, and Embodied Agents"
type: workshop
tier: minor
areas: [vision, ai]
region: europe
language: english
organizer: Workshop organizers from KTH Royal Institute of Technology, Max Planck Institute for Informatics, Saarland University and University of Cambridge; 2026 edition co-located with ECCV
organizer_country: [europe]
proceedings: ECCV Workshops proceedings (Springer LNCS)
archival: true
typical:
  deadline_months: [7]
  conference_months: [9]
links:
  website: https://www.hsi-workshop.com
notes:
- Workshop on scene-aware human motion generation, vision-language-motion alignment, VLA models for manipulation, and human-object and human-scene interaction datasets
- Half-day (morning) workshop at ECCV 2026 in Malmo
- Archival track papers are peer reviewed and published in the ECCV 2026 Workshop Proceedings (Springer LNCS)
- Non-archival track accepts previously published or ongoing work for presentation only
- Includes a challenge; challenge submissions are treated as archival papers
- Submissions on OpenReview in ECCV format
- Not listed in ICORE2026 (the CORE "HSI" is Human System Interaction, a different venue) and not on the CCF list
