notes:
- Academic symposium on blockchain and decentralized systems, Ethereum oriented but open to any blockchain research
- Co-located with the ETH Prague community event; 2026 held at the Municipal House (Obecni dum), Prague
- First full edition in 2026, growing out of a poster session at ETH Prague 2025
- Double-blind review via EasyChair; full papers 10 to 20 pages, short papers 5 to 9 pages, single-column CEURART
- Accepted papers to be submitted to CEUR-WS; authors may instead publish a 4-page extended abstract with a link
  to the full paper (then not eligible for best paper awards)
- Poster track accepts previously published work
- Not listed in ICORE2026 or the CCF list
