notes:
- ICLR workshop on the theory, principles and efficacy of deep generative models (diffusion, flow and other generative models)
- 1st edition at ICLR 2025, 2nd edition at ICLR 2026 in Rio de Janeiro
- Non-archival; no formal proceedings, accepted papers appear on OpenReview and may be published elsewhere
- Long papers up to 8 pages and short or tiny papers up to 4 pages, excluding references and appendices; double-blind review on OpenReview
- Not the INSTICC DeLTA conference (Deep Learning Theory and Applications), which has its own entry
- Not listed in ICORE2026 or the CCF list
