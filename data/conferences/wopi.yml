notes:
- Co-located workshop of COMSNETS 2027 in Bengaluru, India; theme "Realising O-RAN's Open Interfaces from Standards to Systems"
- O-RAN open interfaces, Near-RT and Non-RT RIC, xApps and rApps, disaggregated RAN, testbeds and field trials, RAN security
- Workshop papers (regular and invited) appear in the conference proceedings and are submitted to IEEE Xplore
- Double-blind review; up to 6 pages in IEEE format including references; submission via EDAS
- Accepted papers presented as posters with spotlight pitches; rest of the programme is invited talks and a panel
- Deadlines were extended twice (submission 16 Oct -> 30 Oct -> 6 Nov 2026; notification 16 Nov -> 25 Nov -> 30 Nov; camera-ready 30 Nov -> 5 Dec, firm)
- Not listed in ICORE2026 or the CCF list
