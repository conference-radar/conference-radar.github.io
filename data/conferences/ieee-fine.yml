notes:
- The 2026 Osaka edition appears to be the first; no earlier editions are on the official site. Covers 6G, Open RAN, AI for networks, network automation, semantic communications and network security
- Site shows IEEE, IEEE Communications Society and IEEE Computer Society logos; the sponsorship role is not stated
- Accepted papers go to IEEE Xplore (indexed by EI); IEEE Computer Society format, 8 pages for review, up to 10 with page charges
- Double-blind review; three submission rounds in 2026 (March, April and May)
- Selected papers recommended to IEEE TNSE and Elsevier Computer Communications for fast-track review
- Co-located workshops ESTNI and WFN in 2026
- The CFP gives ieee-fine.org/2026 as the address; the working site is icfine.org/2026
- Not listed in CORE ICORE2026 or the CCF list
