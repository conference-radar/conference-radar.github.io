notes:
- Turkish biomedical and clinical engineering congress with international participation, held yearly since at least 2010
- Organized by the Biomedical and Clinical Engineering Association of Turkey with Izmir University of Economics
  (plus Gaziantep University in 2026); IEEE EMB Turkey Section is technical co-sponsor
- Papers in Turkish or English, up to 5 pages in IEEE format (4 pages in 2025), at least 2 reviewers, submitted via CMT
- Accepted and presented papers are submitted to IEEE Xplore
- Held at a resort or city hotel in Turkey (Bodrum 2024, Famagusta in Northern Cyprus 2025, Gaziantep 2026)
- Includes an industry exhibition, an IEEE EMBS student paper contest and panels on medical technology
- Selected 2025 papers were invited to extended versions in Electrica and Electronics and Signal Processing journals
- Not listed in CORE ICORE2026 or the CCF 2026 list
