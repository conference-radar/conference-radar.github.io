notes:
  - Half-day KDD workshop on AI for cognitive and mental health, covering AI as assessment, emotional support and psychological intervention
  - Held at KDD 2026 in Jeju, Korea (9 August 2026, ICC Jeju)
  - Long papers up to 8 pages and short papers up to 4 pages in the ACM sigconf format, double-blind review via EasyChair
  - Accepted papers stay on the workshop website and are not in the ACM Digital Library
  - The lead organizer previously organized workshops at ICDE 2025 and ICDM 2025
  - Not listed in ICORE2026 or the CCF list
