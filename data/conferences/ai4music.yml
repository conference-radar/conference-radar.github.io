id: ai4music
name: AI4Music
full_name: Workshop on Artificial Intelligence for Music
type: workshop
tier: minor
areas: [ai]
region: worldwide
language: english
frequency: multiple-per-year
organizer: Purdue Artificial Intelligence in Music (AIM) with University of Michigan and UC San Diego researchers
organizer_country: [usa]
proceedings: "Depends on the host: IEEE Xplore for the ICME 2025 edition; AAAI 2025 and NeurIPS 2025 papers only on the workshop websites"
archival: false
typical:
  deadline_months: [4, 8, 11]
  conference_months: [3, 6, 12]
links:
  website: https://ai4musicians.org/events
notes:
  - Workshop series on AI for music (analysis, creation, performance, production, retrieval, music education) run by the Purdue AIM group
  - "2025 editions: AAAI 2025 (Philadelphia, 3 March), IEEE ICME 2025 (30 June) and NeurIPS 2025 (San Diego, 7 December)"
  - The NeurIPS 2025 edition was titled AI for Music, Where Creativity Meets Computation, and was non-archival
  - The ICME 2025 edition followed ICME submission rules (up to 6 pages, double-blind) and hosted the winners session of the 2025 Music Transcription Competition
  - Proceedings depend on the host conference; ICME 2025 papers went to the website and IEEE Xplore, AAAI 2025 papers to the workshop website only
  - Different from EAIM, the AAAI workshop on emerging AI technologies for music
  - Not listed in ICORE2026 or the CCF list
