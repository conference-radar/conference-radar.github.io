  conference_months: [6]
links:
  website: https://varworkshop.github.io/
notes:
- Half-day CVPR workshop on real-time, real-world vision-based assistants (streaming vision-language models, egocentric video, activity understanding)
- First edition at CVPR 2025 (Nashville), second at CVPR 2026 (Denver)
- 2026 tracks are full-length papers with proceedings (up to 8 pages), extended abstracts (up to 4 pages, non-archival) and papers accepted to CVPR 2026
- In 2025 all submissions were non-archival extended abstracts or CVPR main conference papers
- Double-blind review on Microsoft CMT; demos accompanying papers are encouraged
- Hosts two challenges each year (2026 AI Coach challenge on fitness and cooking)
- 1 paper in the CVPR 2026 workshop proceedings on CVF Open Access
- Not listed in ICORE2026 or the CCF list
