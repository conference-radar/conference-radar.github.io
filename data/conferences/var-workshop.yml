organizer: Organizing team from Qualcomm AI Research, Meta Reality Labs, National University of Singapore, University of British Columbia and York University
organizer_country: [usa, singapore, canada]
proceedings: IEEE Xplore and CVF Open Access (CVPR Workshops proceedings, full-paper track since 2026); extended abstracts non-archival
archival: true
