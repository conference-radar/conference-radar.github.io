notes:
- CVPR workshop on visual perception in an open world (open-set recognition, long-tailed data, few-shot detection and related topics)
- Held at every CVPR since 2021; the 6th edition was a half-day workshop at CVPR 2026 in Denver
- No call for papers on the 2025 or 2026 pages; program is invited talks and challenge sessions
- 2026 ran the Few-Shot Object Detection Challenge v3 (organized by CMU); 2025 ran an Object Instance Detection challenge and a Foundational Few-Shot Object Detection challenge
- Related to the Dealing with Novelty in Open Worlds (DNOW) workshop held at WACV 2022 and 2023
- Not listed in ICORE2026 or the CCF list
