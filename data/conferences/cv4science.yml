notes:
- CVPR workshop on applying computer vision to scientific discovery (astronomy, ecology, earth observation, biology and more)
- Held at CVPR 2024, CVPR 2025 (Nashville, full day) and CVPR 2026 (Denver, half day)
- No long-form workshop papers; junior researchers submit a title, short abstract and one figure via a Google Form for a poster
- Poster submissions reviewed on a rolling basis; selected posters may get a short spotlight talk
- Program is mostly invited talks by senior researchers
- Not on the CCF list
