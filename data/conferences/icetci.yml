notes:
- First held in 2021; the site says the 2021 (141 papers) and 2022 (299 papers) proceedings are in IEEE Xplore, and
  later editions up to 2026 are also IEEE conference proceedings
- Hybrid format (online and offline); papers up to 6 pages, extra pages 50 USD each
- Tracks on electronic engineering, power electronics, communication technology, information systems and control
- Not listed in CORE ICORE2026 or the CCF list
