notes:
- Co-located with ICCAD; editions in 2021, 2022, 2023 and 2026
- Recognizes already published hardware and embedded security papers (2026 call covered papers published 2020 to 2025)
- Submission is a two-page self-nomination letter (contributions and long-term impact), via EasyChair
- Shortlisted papers are presented at the in-person workshop; selected Top Picks are invited to an IEEE Design & Test special issue
- Non-archival; workshop-only registration 250 USD (2026)
- Not listed in the CORE ICORE2026 portal
