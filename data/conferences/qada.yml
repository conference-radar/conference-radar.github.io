id: qada
name: QADA
full_name: Workshop on Quantum Algorithm Design Automation
type: workshop
tier: minor
areas: [general, software]
region: north-america
language: english
frequency: annual
organizer: Workshop organizers from Delft University of Technology (QuTech) and Fujitsu Research India; co-located with IEEE Quantum Week (QCE)
organizer_country: [europe, india]
proceedings: IEEE Xplore (IEEE QCE workshop proceedings, Volume 2)
archival: true
typical:
  deadline_months: [6, 7]
  conference_months: [9]
links:
  website: https://sites.google.com/view/ieee-qada
notes:
- Workshop at IEEE Quantum Week (IEEE International Conference on Quantum Computing and Engineering, QCE)
- Editions QADA-23 (Bellevue), QADA-24, QADA-25 (Albuquerque) and QADA-26 (Toronto)
- Themes are soft-computing based QADA, quantum information based QADA, and UI/UX of quantum computers
- Short workshop papers of 2 to 4 pages, submitted via EasyChair, following the QCE technical paper guidelines
- Accepted papers go into the QCE proceedings Volume 2
- One-day format with invited talks and accepted papers; supported by QWorld and the Quantum Intelligence Alliance
- Not listed in ICORE2026 or the CCF list
