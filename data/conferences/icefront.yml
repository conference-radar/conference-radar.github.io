notes:
- Run by the Faculty of Engineering, MBSTU, Tangail, Bangladesh; technically co-sponsored by the BUET ACM Chapter
- Proceedings published in the ACM International Conference Proceedings Series (ICPS)
- Broad engineering scope with tracks on AI and ML, software engineering and data science, cybersecurity and
  privacy, IoT and smart systems
- Double-blind review via Microsoft CMT; 6 to 8 pages in the ACM sigconf template
- Online presentation allowed for authors who cannot attend in person
- First edition in 2026; originally planned for June 25-26, 2026 and moved to December
