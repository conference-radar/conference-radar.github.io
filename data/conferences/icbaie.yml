notes:
- Annual since 2020 and held in China (online 2022, Shenzhen 2024, Shanghai 2025, Xi'an 2026)
- Covers big data, AI and IoT engineering, with a strong intelligent manufacturing flavor in recent keynotes
- 2026 papers are reviewed by two or three reviewers and published by IEEE (ISBN 979-8-3195-4838-2), submitted to IEEE Xplore, EI Compendex, Scopus and Inspec
- 2026 edition announced in a dual-venue format, hosted at Xi'an University of Technology
- Abstract-only submissions accepted for presentation without publication
- Not listed in CORE ICORE2026
