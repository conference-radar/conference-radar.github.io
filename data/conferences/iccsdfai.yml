notes:
- Series led by the CyberTech Research and Innovation Center of Astana IT University, Kazakhstan
- 2025 held at Astana IT University, Kazakhstan; 2026 at Istinye University, Istanbul, Turkey, with several Kazakh, Turkish, UK and Moroccan partner institutions
- Technical sponsorship by IEEE from 2026; 2026 proceedings published in IEEE Xplore
- 2025 proceedings published by Generis Publishing (Methods and Trends in Cybersecurity, Digital Forensics and AI Applications)
- 4 to 6 page IEEE format papers submitted through Microsoft CMT
- Three tracks in 2026 (cybersecurity and forensics, infrastructure and applied systems, governance and financial security); also hosts a CTF and hackathon
- Not listed in CORE ICORE2026 or the CCF list
