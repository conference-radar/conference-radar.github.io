notes:
- Satellite workshop of the VLSI Symposium on silicon-related nanoelectronics, held since 1996; 30th edition in 2025
- Sponsored by the JSAP Silicon Technology Division and IEEE EDS
- Follows the VLSI Symposium, alternating each June between Kyoto and Honolulu; registration goes through the VLSI Symposium site
- Submissions are 2-page abstracts (one page of text, one of figures); accepted papers go to IEEE Xplore
- Covers sub-10 nm transistors, nanodevice physics and modeling, 2D materials, quantum and neuromorphic devices
