  conference_months: [4, 5]
links:
  website: https://ictisthailand.com/
notes:
- Broad ICT conference from the same organizer group as ICTCS, SmartCom, ICT4SD and ICICT London (GR Scholastic)
- Proceedings published by Springer in the Smart Innovation, Systems and Technologies (SIST) series under the title
  'ICT for Intelligent Systems'; ICTIS 2025 filled at least 14 volumes
- 2027 edition is hybrid and split in two phases; Bangkok, Thailand (7 to 9 Apr 2027, physical on 7 Apr) and New York,
  USA (19 to 21 May 2027, physical on 21 May)
- Host cities move around; ICTIS 2024 was held in Las Vegas, USA and ICTIS 2025 in New York, USA (Springer proceedings), with the organizer based in Ahmedabad, India
- Very large, high-acceptance event typical of this organizer; regarded as a minor venue
- Not listed in ICORE2026
