notes:
- Workshop on computer vision with small data; the 2026 edition focused on data-efficient, dynamics-aware video understanding
- Held at WACV 2024, WACV 2025 and CVPR 2026 (3rd edition); the subtitle and focus change each year
- Algorithmic track full papers (up to 8 pages) appear in the CVPR workshop proceedings; Emerging Applications short papers (up to 4 pages) are non-archival
- Every submission must include a Small Data Statement at the end of the introduction
- 2026 edition included the TimeBlind challenge on fine-grained temporal video understanding
- Not listed in ICORE2026 or the CCF list
