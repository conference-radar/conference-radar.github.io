notes:
- Workshop 10 at IEEE VTC2027-Spring in Hamburg, held on 20 June 2027; no earlier edition found
- Topics are satellite and aerial networks as backup for terrestrial networks, and resilient design of integrated TN-NTN infrastructure (routing, planning, AI for recovery, free-space optics)
- Chairs from TU Darmstadt, IMDEA Networks, TU Delft and ESA-ESOC; keynote by Mohamed-Slim Alouini (KAUST)
- Submissions through the VTC2027-Spring workshop TrackChair site; accepted papers go into the VTC proceedings in IEEE Xplore
- Not listed in ICORE2026
