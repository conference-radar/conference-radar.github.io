notes:
- Workshop on deepfake and forgery detection, disinformation detection, provenance analysis and anti-forensics, with a focus on multimodal methods
- 1st edition at ICPR 2022, 2nd at WACV 2025, 3rd at ECCV 2026 in Malmo; the host conference changes each time
- Run by the Signal and Information Processing Lab at the University of Warwick, technically sponsored by IAPR TC6 (Computational Forensics)
- Papers follow the ECCV 2026 template; accepted papers are published by Springer and/or ECVA with the ECCV workshops
- Submission via OpenReview; IAPR TC6 Best Paper Award
- Not listed in ICORE2026 or the CCF list
