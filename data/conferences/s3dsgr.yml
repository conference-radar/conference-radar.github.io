notes:
- Workshop on large-scale 3D scene generation, reconstruction and geometric scene understanding
- 1st edition at ECCV 2024, 2nd at ICCV 2025 in Honolulu, 3rd at ECCV 2026 in Malmo
- Papers up to 14 pages (ECCV format) or 8 pages (ICCV format), double-blind review on OpenReview, no dual submission
- Accepted papers are included in the host conference workshop proceedings
- Authors are expected to help with reviewing
- Not listed in ICORE2026 or the CCF list
