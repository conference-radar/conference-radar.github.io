links:
  website: http://ic-icsp.org/
notes:
- Annual conference on intelligent computing and signal processing held since 2017; the 2027 edition is the 12th
- Held in China, mostly Xi'an (every year 2021 to 2025), Hefei 2026 and Chongqing 2027; earlier editions in Bangkok
  2017, Wuhan 2018, Zhuhai 2018 and online 2020
- Proceedings published by IEEE since 2021 (IOP JPCS in 2019 and 2020, MATEC in 2018); organizers say papers are
  submitted to IEEE Xplore, EI Compendex and Scopus
- Each paper is reviewed by two or three reviewers from the committees
- Do not confuse with the IEEE International Conference on Signal Processing (also ICSP, Beijing, file icsp-cn)
- Not listed in ICORE2026 or CCF (the CORE "ICSP" entry is the Software and System Processes conference)
