notes:
- Smaller commercially organized conference on mobile and wireless communications, future internet architectures and AI for networks
- Run through a conference secretariat (zmeeting submission system) with a host university each year
- Publisher changes by year (IEEE Xplore 2024, Springer LNDECT 2025, ACM ICPS 2026)
- Held in Japan 2022 to 2025 (Okayama, Nagoya, Kagoshima, Okinawa); 10th edition in Paris in 2026
- Double-blind review; abstract-only submissions are presented but not published
- Not listed in CORE ICORE2026
