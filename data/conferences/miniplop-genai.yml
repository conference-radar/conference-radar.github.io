notes:
- Pattern writing workshop (MiniPLoP format) at XP on patterns for using generative AI across the software lifecycle
- Papers are discussed in a writers' workshop with authors listening, in the PLoP tradition
- Short papers of 3 to 5 pages with patterns or pattern ideas; published papers follow Springer LNBIP instructions
- In person only; at least one author must attend
- First edition at XP 2026 in Sao Paulo, Brazil; XP 2027 is in Tampere, Finland
- Not listed in CORE ICORE2026 or the CCF 2026 list
