notes:
- Half-day workshop on secure, safe and time-predictable integration of heterogeneous SoCs built on open hardware, including AI-assisted verification and security analysis
- Editions with DAC in San Francisco (2023, 2024) and with ICCAD in San Jose (2026); no 2025 edition
- Peer-reviewed workshop papers up to 4 pages (IEEE conference format), single-blind review, submission via EasyChair; shorter submissions welcome
- Program also has invited talks and an open panel discussion
- In 2024 accepted papers and slides were posted on the workshop website as informal proceedings
- Not listed in the CORE ICORE2026 portal
