notes:
- Organized and co-sponsored by IEEE Industry Applications Society, Pateh International Trading Services and the Malaysian Society of Industrial Control Technology; Universiti Teknologi MARA is also a sponsor
- The site lists Pateh International Trading Services as based in Qatar
- Held in Pattaya, Thailand in 2024 and 2025
- Proceedings in IEEE Xplore (ISSN 2832-9848), Scopus indexed
- Covers power systems, control, power electronics, signal processing, communications, industrial informatics and e-health
- Up to 30% of the best papers may be recommended to IEEE Transactions on Industry Applications (2024)
- Not listed in ICORE2026; not on the CCF list
