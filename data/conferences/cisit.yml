notes:
- Run by the Institute of Computer Science, University of Siedlce (Poland), with the IEEE CS Poland Chapter; IEEE conference 70267 in 2026
- Held at the University of Siedlce, on-site or hybrid
- Each edition has a theme; 2026 was Cybersecurity in the Age of AI
- Extended abstracts of 5 to 6 pages are peer reviewed; final papers up to 6 pages in IEEE Xplore
- Post-conference full papers (up to 12 pages) get a second review for the journal Studia Informatica
- Fee about 175 EUR early bird, 200 EUR regular (2026)
- Camera-ready due after the conference (2026)
- Not listed in ICORE2026 (portal search returns no results) or the CCF list
