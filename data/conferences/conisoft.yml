notes:
- Mexican software engineering research conference (14th edition in 2026), technically co-sponsored by the IEEE Computer Society
- Run by the Mexican software engineering network (Red Mexicana de Ingeniería de Software) with a different Mexican host university each year
- Two tracks, scientific papers in English and scientific papers in Spanish
- English track papers go to IEEE Xplore and the IEEE CSDL (per the 2025 call); Spanish track papers go to Ibero-American journals
- Full papers 8 to 10 pages, work in progress 6 to 8 pages; anonymized submission via Microsoft CMT
- Extended versions of selected English papers may be invited to a special issue of Programming and Computer Software (Springer)
- Always held in Mexico (La Paz 2025, Zacatecas 2026); 2025 edition was hybrid
- Not listed in ICORE2026; not on the CCF 2026 list
