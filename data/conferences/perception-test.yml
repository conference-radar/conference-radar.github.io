notes:
- Challenge workshop on the Perception Test video benchmark, held with the major computer vision conference of the year
- Computer Perception workshop at ECCV 2022, then challenges at ICCV 2023, ECCV 2024, ICCV 2025 (Honolulu) and ECCV 2026 (Malmo)
- "2026 tracks: Unified VQA, Grounded VQA, KilometerVision and KilometerAudio (hour-long walking-tour videos)"
- Prizes totalling 20K EUR in 2026 (50K EUR across 6 tracks in 2025)
- No paper track; participants submit technical reports and the organizers publish a challenge summary report on arXiv
- Organized by Viorica Patraucean, Joao Carreira and colleagues at Google DeepMind with Shiry Ginosar, Dima Damen and Andrew Zisserman
- Not listed in ICORE2026 or the CCF list
