notes:
- Workshop on reinforcement learning from world feedback (measurable real-world outcomes such as efficiency, safety and economic signals) instead of human preference feedback
- First held with ICML 2026 in Seoul
- Non-archival; papers under review at other venues (e.g. NeurIPS 2026) are welcome
- Full papers up to 9 pages or short proof-of-concept papers of 2 to 4 pages in ICML or NeurIPS format; double-blind review on OpenReview
- Sponsored by NTU AI-CoRE
- Not listed in ICORE2026 and not on the CCF list
