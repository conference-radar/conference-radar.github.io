links:
  website: https://conferences.amity.edu/ICIPTM2027/
notes:
- Organized by Amity University at its Sector 125 campus in Noida (Delhi NCR), India
- Accepted, registered and presented papers are submitted to IEEE Xplore
- Despite the name, the call is dominated by computing, networking, security, control and electronics topics
- Papers that only discuss qualitative, managerial, policy or economic aspects are declared out of scope
- Papers up to 6 pages in IEEE format, up to 2 extra pages at 25 USD each, via Microsoft CMT
- Short submission to conference cycle of about six weeks, with deadlines in January
- Not listed in ICORE2026
