notes:
- Run by VNRVJIET in Hyderabad, technically co-sponsored by the IEEE Hyderabad Section (2026 IEEE conference ID 69869)
- Accepted and presented papers are submitted to IEEE Xplore; 2022 and 2024 proceedings are in IEEE Xplore
- 2026 edition held at VNRVJIET, Hyderabad; earlier editions in 2022 and 2024 (proceedings linked from the CFP page)
- Tracks on VLSI, robotics and IoT, communications and networking, signal processing, computational intelligence, data science, power and energy
- Double-blind review, up to 5 pages (8 with page charges), submission via Microsoft CMT
- Not in the CCF 2026 list
