  conference_months: [9, 10]
links:
  website: https://sites.google.com/view/neuslam/home
notes:
- Workshop on dense neural SLAM (NeRF and Gaussian splatting based SLAM, neural pose estimation, online reconstruction)
- 1st edition (Dense Neural SLAM Workshop) at ECCV 2024 in Milan, 2nd at ICCV 2025 in Honolulu, 3rd at ECCV 2026 in Malmo
- Proceedings track takes 14-page full papers in ECCV format with double-blind review on OpenReview for the ECCV workshop proceedings
- Nectar track for already published work is presented as posters only and not published
- Half-day program with four keynotes, a poster session and a panel
- Not listed in ICORE2026 or the CCF list
