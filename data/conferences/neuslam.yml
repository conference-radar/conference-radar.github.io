frequency: annual
organizer: Workshop organizers from University of Amsterdam, University of Bologna, Zhejiang University and Rock Universe; co-located with ECCV or ICCV
organizer_country: [europe, china]
proceedings: ECCV Workshops proceedings (Springer) or ICCV Workshops proceedings (CVF Open Access), proceedings track only
archival: true
typical:
