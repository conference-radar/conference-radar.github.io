notes:
- Workshop on bringing programming language and tool ideas to hardware accelerator design (HDLs, HLS, design automation)
- Held with ASPLOS every year since 2021; 2026 was hybrid, in person in Pittsburgh and online over Zoom
- Submissions are 2-page position papers (excluding references) in the two-column SIGPLAN acmart format via HotCRP
- Single-blind peer review by an interdisciplinary program committee
- Non-archival; accepted PDFs are posted on the workshop website
- Not listed in the CORE portal (ICORE2026); not on the CCF 2026 list
