notes:
- One-day workshop on quantum computing and quantum communication (NISQ devices, hybrid HPC+QC, quantum ML and optimization, QKD), held with the biennial PPAM conference
- Organized by the Poznan Supercomputing and Networking Center; editions in 2022 (Gdansk), 2024 (Ostrava) and 2026 (Poznan)
- Full papers up to 15 pages in LNCS style (12 pages until 2024), or 2-page abstracts for presentation only
- Presented papers appear in the PPAM proceedings, published by Springer in LNCS after the conference
- Camera-ready deadline comes after the conference (November)
- Not listed in CORE ICORE2026
