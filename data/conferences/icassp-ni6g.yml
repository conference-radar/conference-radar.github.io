notes:
- One-day satellite workshop of IEEE ICASSP 2027 on integrated sensing and communication (ISAC), cooperative localization, multi-agent sensing and AI-native ISAC for 6G
- The workshop has no official acronym; NI-6G is a short label used on this site
- Per the ICASSP 2027 call for satellite workshops, papers follow the ICASSP 2027 style and length, are reviewed on the main conference platform and the workshop organizers run the review
- Accepted ICASSP 2027 workshop papers are published in IEEE Xplore under a separate workshop record; one author must present in person
- Invited speakers include Yonina Eldar, Gerhard Fettweis, Fredrik Gustafsson, Athina Petropulu and Moe Win
- Paper deadline extended from 11 Nov to 25 Nov 2026
- Not listed in ICORE2026 or the CCF list
