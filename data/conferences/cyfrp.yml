notes:
- Special session of the European Interdisciplinary Cybersecurity Conference (EICC) for national and EU-funded research projects to present results and find collaborators
- Held with EICC (Rennes 2025, Darmstadt 2026)
- Single-blind review, unlike the EICC main track; papers may name projects and funding
- Accepts very short papers (5 pages or less) besides full (12 to 16 pages) and short (6 to 11 pages) papers
- Submitted through the EICC EasyChair (CyFRP track); papers published by Springer Nature in CCIS as part of the EICC proceedings
- Papers under 4 pages may be moved to the back matter and are then not indexed
- Not listed in the CORE ICORE2026 portal or the CCF list
