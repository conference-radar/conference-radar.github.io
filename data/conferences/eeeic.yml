notes:
- Annual European conference on electrical power systems, renewable energy and environmental issues; 26th edition in 2026
- Held jointly with Industrial and Commercial Power Systems Europe (I&CPS Europe, 10th edition in 2026)
- Organized by the not-for-profit EEEIA (based in Rome) with the host university; 2026 hosted by Instituto Superior Tecnico, Lisbon
- Hybrid; registered authors may present on site or remotely (2026)
- Rolling review via Microsoft CMT; notification within 3 weeks of submission and final paper within 2 weeks after that
- Only presented papers go into the electronic proceedings in IEEE Xplore
- Indexed in Scopus since 2010 and Web of Science CPCI since 2013 according to the conference
- Not listed in the CORE ICORE2026 portal and not on the CCF list
