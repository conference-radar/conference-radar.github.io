notes:
- The only IEEE PES conference dedicated exclusively to power quality (harmonics, supraharmonics, flicker, unbalance, voltage sags and transients)
- Started in 1984 as the IEEE International Conference on Harmonics in Power Systems (ICHPS); renamed ICHQP in 1996
- Held every two years in even years, rotating worldwide (2016 Belo Horizonte, 2018 Ljubljana, 2020 Dubai online, 2022 Naples, 2024 Chengdu, 2026 Dresden)
- Full papers up to 5 pages in the IEEE PES template, single-blind review via Microsoft CMT
- Presented papers are archived in IEEE Xplore; not presented papers can be excluded
- Recently accepted IEEE Transactions papers can apply for presentation at the conference
- One full registration covers up to two papers; a student registration covers one paper (2026)
- Not listed in the CORE ICORE2026 portal and not on the CCF list
