notes:
- Long-running workshop of IEEE/ACM UCC (15th edition in 2026) on cloud and edge computing and application management
- Papers up to 6 pages including references in IEEE double-column format (2026); double-blind review
- Proceedings with UCC; the 2026 UCC author instructions say workshop papers go to IEEE Xplore, while the 2025 page says ACM publishes them via IEEE Xplore and ACM DL
- One author must register for the conference and present in person
- Honorary chairs from LNCC (Brazil), University of Zaragoza and UNICAMP
- Follows UCC (Nantes 2025, Florianopolis 2026)
- Not found in the ICORE2026 CORE portal search
