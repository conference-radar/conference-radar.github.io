notes:
- Workshop held with ANT (International Conference on Ambient Systems, Networks and Technologies); 4th edition in 2027
- Since 2026 papers appear open access in Elsevier Procedia Computer Science with the ANT proceedings
- 2024 and 2025 editions were published as Springer volumes
- Papers up to 6 pages in Procedia format, reviewed by 2 to 3 program committee members
- Topics include causal reasoning in multi-agent systems and LLMs, agentic AI and explainable AI
- Not listed in ICORE2026 and not on the CCF list
