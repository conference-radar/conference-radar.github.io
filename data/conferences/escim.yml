notes:
- Small European symposium on computational intelligence and mathematics (fuzzy logic, soft computing), continuing the earlier Gyor symposia
- Full papers up to 6 pages in Springer LNCS style; books of abstracts (full proceedings for 2015 and 2016) are posted on the website
- Best papers go to a volume of the Springer series Studies in Computational Intelligence; extended best papers are reviewed for a special issue of a JCR journal (IJUFKS for 2026)
- Moves around Europe each year (Krakow 2024, A Coruna 2025, Timisoara 2026, Porto 2027)
- Not listed in CORE ICORE2026
