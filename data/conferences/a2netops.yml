id: a2netops
name: A2NetOps
full_name: "AAAI Workshop on Autonomous Network Operations: Agents for Autonomous Network Operations - Causal Reasoning, Uncertainty, and Safe Action"
type: workshop
tier: minor
areas: [networking, ai]
region: north-america
language: english
organizer: Workshop organizers led by Cisco AI Engineering and Research, with Pennsylvania State University, NVIDIA and Meta; co-located with AAAI
organizer_country: [usa]
proceedings: None (non-archival; titles, abstracts and author lists of accepted papers public on OpenReview)
archival: false
typical:
