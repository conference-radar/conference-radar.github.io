links:
  website: https://a2netops.github.io
notes:
  - First edition at AAAI-27 (Montreal, Palais des congres), one-day workshop on Tuesday 23 February 2027
  - AI agents for network operations, network automation and autonomous networking (diagnosis, causal reasoning, safe tool use, rollback)
  - Explicitly not a cybersecurity workshop; focus is operating and automating networks
  - Full papers up to 8 pages, short, position and demo papers up to 4 pages, references included; AAAI-27 anonymous two-column template via OpenReview
  - Non-archival; AAAI does not publish workshop papers in its Digital Library and submission PDFs stay private unless the organizers enable release
  - Presentations must be in person; registered participants may attend remotely
  - Program committee mostly from Cisco, plus Airbnb, Google, Microsoft and PayPal
  - Not listed in ICORE2026 or the CCF list
