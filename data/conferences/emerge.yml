notes:
- Workshop on MLOps, TinyML and federated learning for resource-constrained IoT and embedded wireless devices
- Satellite workshop of EWSN; held since 2024 (Abu Dhabi 2024, Leuven 2025, Dresden 2026)
- Organized in 2026 by researchers from Imperial College London, Technical University of Cluj-Napoca and Digital Catapult
- Papers up to 6 pages including references, letter-size two-column ACM-style format, submitted via HotCRP; author names included (not anonymous)
- Accepted papers appear in the EWSN proceedings, indexed in the ACM Digital Library and Scopus
- Not listed in the CORE portal (ICORE2026)
