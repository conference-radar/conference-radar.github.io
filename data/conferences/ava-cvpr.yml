notes:
- CVPR workshop on computer vision and autonomous systems for accessibility and people with disabilities
- Previous editions at CVPR 2023 (2nd) and CVPR 2024 (3rd); the 2025 page states no edition number
- Extended abstracts of up to 4 pages in CVPR format, not anonymized; previously published work is allowed
- Non-archival; accepted abstracts are presented as posters and are not included in the workshop proceedings
- Runs challenges on EvalAI (2025 tracks were 3D human motion generation and navigation instruction generation)
- Not listed in ICORE2026 or the CCF list
