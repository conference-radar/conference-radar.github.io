notes:
- European edition of Community Over Code (formerly ApacheCon), the official conference of The Apache Software Foundation
- Practitioner talks on Apache projects in many tracks (search, big data, IoT, community, geospatial, fintech, ...); 18 tracks and more than 160 sessions in 2026
- No papers or proceedings; talks only
- European editions are irregular (Berlin 2019, Glasgow 2026); separate North America, Asia and Sydney editions exist
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
