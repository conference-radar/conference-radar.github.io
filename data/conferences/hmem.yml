notes:
- Workshop on heterogeneous memory and memory systems (CXL, unified memory, data placement) for HPC; formerly the Workshop on Heterogeneous Memory Systems
- Running since 2020; co-located with ICS (2020 to 2022), SC'23, CLUSTER'24, SC'25 and SC'26
- Traditional-style workshop without formal proceedings; authors may post their PDF on the workshop site and publish the work later
- Position papers and completed or early work up to 10 pages (IEEE two-column, double-blind), or 2-page abstracts of recently published work
- Submission through the SC submissions portal
- Listed as a symposium-style workshop (no proceedings) for SC26
- Not listed in CORE ICORE2026
