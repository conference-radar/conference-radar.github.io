id: aiblock
name: AIBlock
full_name: International Conference on Application Intelligence and Blockchain Security
type: conference
tier: minor
areas: [security, crypto, ai]
region: worldwide
language: english
frequency: annual
organizer: Lancaster University, SPTAGE Lab and NORCICS (2026); technical sponsor Asia-Pacific Association of Cognitive Intelligence (AACI)
organizer_country: [europe]
proceedings: Springer (LNCS format post-proceedings)
archival: true
fee: 600 USD full registration (2026); 300 USD student non-author
typical:
  deadline_months: [3, 5]
  conference_months: [7]
links:
  website: https://aiblock.sptagelab.org/2026/
notes:
- Application intelligence security and blockchain security (smart contracts, cryptocurrency analysis, AI and ML security, intrusion detection)
- Started as an ACNS satellite workshop (6th edition in 2024 was "International Workshop on Application Intelligence and Blockchain Security" with ACNS 2024)
- Standalone conference since 2025 (7th edition, Beijing, hybrid); 8th edition in 2026 at Lancaster University, UK, also hybrid
- Proceedings published by Springer; LNCS format with an 18 page main body and 20 pages in total
- 2025 used two submission rounds; 2026 had a single extended deadline
- Selected papers invited to SCI-indexed journal special issues; best paper award
- Not listed in CORE ICORE2026
