full_name: International Conference on Reachability Problems
type: conference
tier: minor
areas: [general]
region: europe
language: english
frequency: annual
organizer: RP Steering Committee with a local host institution
organizer_country: [europe]
proceedings: Springer LNCS
archival: true
fee: About 350 EUR early regular, 200 EUR early student (2025)
typical:
  deadline_months: [7]
  conference_months: [9, 10]
links:
  website: https://rp25.software.imdea.org/
notes:
- Theory conference on reachability problems in computational models, verification, automata, logic and algebraic structures, held since 2007
- Proceedings in Springer LNCS
- Regular papers up to 12 pages in LNCS format excluding bibliography and appendices, single-blind review
- Also accepts presentation-only submissions (published elsewhere or 2-page abstracts), not included in the proceedings
- Small conference; 12 regular papers accepted in 2025
- Held in Europe (Kaiserslautern 2022, Nice 2023, Vienna 2024, Madrid 2025)
- Not listed in ICORE2026; not on the CCF 2026 list
