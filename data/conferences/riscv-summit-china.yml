notes:
- Main RISC-V community summit in China, hosted by RIOS Lab; 2026 was the sixth edition
- Call for presentations (talks), not papers; no proceedings are mentioned on the official site
- 2026 tracks -> AI, datacenter and HPC, software ecosystem, chip design and verification, automotive/industrial/robotics, embedded and IoT, industry-academia collaboration
- Each track accepts academic research and industrial deployment talks; work already presented at peer-reviewed venues (ISCA, MICRO, HPCA, ASPLOS, DAC, ...) is in scope
- Large event with keynotes and an expo (2026 expected 3600+ onsite attendees and 450+ exhibitors)
- Sibling events are RISC-V Summit Europe and RISC-V Summit North America
- Not listed in CORE ICORE2026
