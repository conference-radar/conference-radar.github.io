notes:
- Organized by LIAM at Mohamed Boudiaf University of M'sila, Algeria, with the Algerian Society of Industrial and Applied Mathematics (ASIAM)
- Biennial since 2014 (2014, 2016, 2018, 2020, 2022, 2024, 2026), always held in M'sila
- Broad computer science scope (AI and ML, data science, networks, software engineering, databases, cybersecurity, optimization, bioinformatics)
- 2026 papers of six pages in IEEE double-column format, double-blind review via Microsoft CMT
- 2026 site says accepted papers go in the official conference proceedings, intended to be submitted for indexing; publisher not named
- Not listed in ICORE2026 or the CCF 2026 list
