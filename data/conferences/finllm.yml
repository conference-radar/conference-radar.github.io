notes:
- IJCAI workshop (called a symposium in 2023 and 2026) on LLMs and AI agents in finance
- Editions at IJCAI 2023 (Macau), IJCAI 2025 (Guangzhou, alongside Montreal) and IJCAI 2026 (Bremen); no 2024 edition
- No formal proceedings; accepted papers get review feedback and discussion, and selected papers may be invited to a journal special issue
- Accepts work recently published or under review elsewhere
- Papers up to 7 pages plus 2 pages of references in IJCAI format, single-blind review via EasyChair
- Deadlines 23:59:59 AoE
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
