notes:
- Electronics engineering conference run by the ECE department of IIIT Kottayam in association with the IEEE Kerala Section
- Held on the IIIT Kottayam campus in Valavoor, Pala, Kerala; 2026 is the second edition
- Accepted papers that pass the IEEE quality check are published in IEEE Xplore; posters appear only in the conference proceedings
- Tracks on VLSI and embedded systems, communication systems, IoT and sensor networks, security and privacy, RF and microwave, and signal processing
- Single-blind review, up to 6 pages in IEEE two-column format, submission via Microsoft CMT
- Separate call for posters open to students and researchers, with cash prizes per track
- Not in the CCF 2026 list
