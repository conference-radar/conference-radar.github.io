notes:
- Workshop WS-34 co-located with IEEE GLOBECOM 2026 in Macau
- Covers sensing as a native RAN capability for 6G (cooperative and multi-modal sensing, sensing-aware resource management, data fusion, service exposure)
- Program co-chairs include Joerg Widmer, Michele Rossi and Jacopo Pegoraro
- Accepted and presented papers go into the IEEE GLOBECOM workshop proceedings in IEEE Xplore; in-person presentation required (no-show papers removed)
- Submissions via EDAS through the GLOBECOM workshop call
- Not listed in ICORE2026
