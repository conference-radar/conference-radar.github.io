notes:
- Invitation-only workshop of about 100 people on databases, transaction processing and large-scale systems,
  held every two years since 1985
- Held at Asilomar Conference Grounds, Pacific Grove, California
- Invitations based on a one-page, single-author position statement; one submission per author
- No formal proceedings; presenters are encouraged to post their slides, and talks are not recorded
- Mix of industry and academic participants; discounted fee for students
