notes:
- Annual since 2018, held in China in December (Sanya 2023, Guangzhou 2024, Nanjing 2025, Hangzhou 2026)
- Proceedings in the ACM DL for 2019 to 2023 and in IEEE Xplore for 2024 and 2025; 2026 proceedings by IEEE, indexed by EI Compendex and Scopus
- 2026 hosted by the College of Computer Science and Technology, Zhejiang University of Technology
- Submission via Microsoft CMT; submission deadline only about three weeks before the conference
- Presenter only and listener registration are also offered
- Not listed in CORE ICORE2026
