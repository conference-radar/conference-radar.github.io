links:
  website: https://research.ece.cornell.edu/retrieve/
notes:
  - Workshop on architecture and systems support for retrieval primitives such as attention and KV-cache lookup, ANN search, recommendation embeddings, databases and tiered memory
  - First edition held with MICRO 2026 in Athens as a half-day afternoon workshop
  - Papers up to 6 pages excluding references in the IEEE Computer Architecture Letters (CAL) two-column format
  - Double-blind review through HotCRP
  - Accepted papers appear in the workshop proceedings; paper PDFs are posted on the workshop site
  - Not listed in CORE ICORE2026 or the CCF list
