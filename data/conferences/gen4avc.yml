id: gen4avc
name: Gen4AVC
full_name: Workshop on Generative AI for Audio-Visual Content Creation
type: workshop
tier: minor
areas: [vision, ai]
region: worldwide
language: english
frequency: annual
organizer: Workshop organizers led by Sony AI, with UIUC, Adobe Research, Luma AI, University of Maryland and Australian National University
organizer_country: [japan, usa, australia]
proceedings: None (non-archival)
archival: false
typical:
  deadline_months: [7]
  conference_months: [9, 10]
links:
  website: https://gen4avc.github.io/eccv2026/
notes:
  - Workshop on audio-visual generation (joint generation, video-to-audio and audio-to-video, editing, evaluation)
  - 1st edition at ICCV 2025 (Honolulu), 2nd at ECCV 2026 (Malmo), half-day morning session
  - Non-archival; regular track papers up to 4 pages in CVPR style, double-blind review via OpenReview
  - Invited track for papers already accepted at ECCV 2026 or recent top venues, no formal review
  - A different workshop from AVGenL
  - Not listed in ICORE2026 or the CCF list
