notes:
- North American conference on free and open source silicon run by the FOSSi Foundation (a UK not-for-profit community interest company), sister event of ORConf
- Talks on FPGA tools, verification with Verilator and cocotb, hardware description languages, RISC-V, analog layout, open PDKs and tapeouts
- Three days (Friday to Sunday) with a Sunday unconference and workshops
- No papers or proceedings; talk recordings on YouTube and slides linked from the program
- Pay-what-you-want or professional tickets
- Held in North America (Santa Barbara 2025, Waterloo 2026)
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
