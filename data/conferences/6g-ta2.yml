notes:
- Workshop of IEEE WiMob on 6G technologies, architectures and applications; 3rd edition in 2026
- Follows WiMob (Paris 2024, Marrakech 2025, Avignon 2026)
- Papers up to 6 pages in IEEE double-column format (2 extra pages can be bought, 8 maximum); single-blind review
- Papers appear in the WiMob proceedings and are submitted to IEEE Xplore
- Chaired by Fidan Mehmeti (TU Munich) with co-chairs from AUB and TU Dresden in 2026
- Not found in the ICORE2026 CORE portal search
- The WiMob 2024 programme has a 6G-TA2 session; no separate 6G-TA2 session appears in the WiMob 2025 or 2026 programmes
