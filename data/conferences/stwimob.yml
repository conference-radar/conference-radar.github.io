notes:
- Long-running workshop of IEEE WiMob (19th edition in 2026); has no separate website, pages sit on the WiMob site
- Covers the same topics as the WiMob symposia (wireless communications, next generation mobile networking, AI for networking, blockchain, security and privacy)
- Some papers are ones with borderline review scores at the WiMob main conference
- Same submission guidelines as WiMob (6 IEEE pages, up to 2 extra pages for a fee, EDAS)
- Papers appear in the WiMob proceedings in IEEE Xplore; papers not presented may be excluded
- Large for a workshop (ten STWiMob sessions on the 2026 workshop day)
- Follows WiMob (Paris 2024, Marrakech 2025, Avignon 2026)
- Not found in the ICORE2026 CORE portal search
