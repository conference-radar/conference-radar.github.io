notes:
  - Conference held in China (12th edition in 2026; 7th edition in 2021 held online), run from East China Normal University
  - 2026 edition at Suzhou Chien-shiung Institute of Technology, Taicang, Jiangsu (near Shanghai)
  - Proceedings in IEEE Xplore and EI Compendex; the site says all 11 past proceedings were indexed within three months
  - Broad scope covering control and automation, power and energy, intelligent systems, communications and networking,
    signal processing, data mining, software engineering and bioinformatics
  - Papers up to 6 pages, extra pages US$60 each; one full registration per paper
  - Selected papers invited to SCI journal special issues after extension
  - Not listed in ICORE2026 or the CCF 2026 list; a small regional venue
