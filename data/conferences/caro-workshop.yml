notes:
- Practitioner workshop of the anti-malware research community CARO; each edition has its own site (caro2025.org, caro2027.org)
- 2027 theme is cybersecurity in the evolving world of agentic AI and personal data challenges; technical submissions and case studies on other topics are also welcome
- Submissions are a title and abstract only (no paper upload) for a 20, 30 or 40 minute presentation, via the CPDP Conferences platform
- 2027 edition held in Brussels alongside CPDP (Computers, Privacy and Data Protection)
