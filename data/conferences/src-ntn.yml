notes:
- WS-03 at IEEE GLOBECOM 2026 in Macau
- Topics are physical-layer security, covert communications, AFDM and RSMA, fluid antennas, RIS, digital twins and trustworthy AI for satellite and other non-terrestrial networks
- Co-chairs Zan Li and Chao Wang (Xidian University), Wee Kiat New (Huawei), Shengyu Zhang (SUTD), Kai-Kit Wong (UCL) and Derrick W. K. Ng (UNSW)
- Short name SRC-NTN is used in this list only; the workshop has no official acronym
- Accepted and presented papers go into the IEEE GLOBECOM 2026 Conference Proceedings and IEEE Xplore; no-show papers can be removed
- Submissions via EDAS through the GLOBECOM workshop call
- Not listed in ICORE2026
