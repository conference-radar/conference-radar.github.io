notes:
  - Workshop plus a 4D micro-expression recognition challenge on Kaggle, using the 4DME dataset
  - "Organizers: Yante Li (CAAS Agricultural Information Institute), Xiaobai Li (Zhejiang University and University of Oulu), Hui Yu (University of Glasgow), Patrick Le Callet (University of Nantes)"
  - 1st edition at IJCAI 2025 (29 Aug 2025, Montreal and Guangzhou), papers in CEUR Workshop Proceedings
  - 2nd edition at IJCAI-ECAI 2026 in Bremen, workshop WS09, half day on 17 Aug 2026
  - 2026 papers in Springer LNCS format (full 12, short 6, poster 4 pages), published in Springer LNCS
  - Each paper must be presented onsite by an author
  - Not on the CORE portal (ICORE2026) or the CCF 2026 list
