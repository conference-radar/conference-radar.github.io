notes:
- Annual since 2022; fully virtual in 2022 (Singapore), then hybrid in Xi'an (2023), Singapore (2024) and Tokyo (2025)
- 2026 edition held at the University of Electro-Communications (UEC), Tokyo
- 2026 papers go to the ACM International Conference Proceedings Series; 2024 proceedings appeared in IEEE Xplore
- Double-blind review with two or three reviewers; abstract-only presentation and listener registration also offered
- Run by a commercial conference service, generally regarded as low tier
- Not listed in ICORE2026 or the CCF 2026 list
