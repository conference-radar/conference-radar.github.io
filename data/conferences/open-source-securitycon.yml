notes:
- One-day open source security event co-hosted by CNCF and OpenSSF on the Monday of KubeCon + CloudNativeCon
- Held twice a year, with KubeCon Europe (spring) and KubeCon North America (autumn)
- Talks chosen from the shared CNCF co-located events call for proposals; presentations (25 min), panels (35 min) and lightning talks (10 min)
- Topics include AI in OSS security, regulation and public policy, supply chain and application security, OSPOs and security education
- Included in the All-Access KubeCon + CloudNativeCon pass; no papers or proceedings
- Not listed in ICORE2026 and not on the CCF list
