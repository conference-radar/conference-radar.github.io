notes:
- Half-day workshop on causality and uncertainty in generative AI for decision making and policy, held with ACM SIGKDD
- Held at KDD 2026 in Jeju, Korea (August 10, 2026, afternoon, ICC Jeju)
- Organized by University of Florida faculty, led by Mattia Prosperi
- Short papers of 1,500 to 2,500 words excluding references, single-blind review
- Accepted papers are not in the KDD proceedings; authors keep the right to publish elsewhere
- A post-workshop special issue in Springer's Journal of Healthcare Informatics Research was under negotiation (extended versions, extra review, APCs)
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
