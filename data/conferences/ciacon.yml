notes:
- Practitioner cybersecurity conference in New Delhi, India; named after the CIA triad (confidentiality, integrity, availability), not linked to any intelligence agency
- 2026 edition had a pre-conference training day (8 hour Agentic AI and MCP security workshop) and one conference day at PHD House, Hauz Khas, New Delhi
- A separate Capture The Flag ran on 2026-09-19 at Cybercube, Gurugram
- Talks selected through a call for papers with blind peer review by the CIA Conference review board
- Industry talks only; no proceedings are mentioned on the site
- Group discounts of 15% (3 to 5 tickets) and 25% (6 to 10 tickets)
