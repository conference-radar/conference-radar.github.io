notes:
- Interdisciplinary conference on the analysis of mobile phone and mobility data (CDRs, location data, Wi-Fi traces, app usage)
- Submissions are 2-page extended abstracts via JEMS, presented as short talks or posters
- No formal proceedings; accepted abstracts go into a public Book of Abstracts, and work published elsewhere is welcome
- Runs a co-located Data Challenge with a released dataset (Niterói bus data in 2026)
- Fully in-person; remote presentations are not possible (2026)
- Rotates between Europe and the Americas (Madrid 2023, Washington DC 2024, Paris 2025, Niterói 2026)
- Deadlines were extended several times in 2026
