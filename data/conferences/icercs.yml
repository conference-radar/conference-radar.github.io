notes:
- Organized by Karpagam Academy of Higher Education (deemed university), Coimbatore, Tamil Nadu, India
- The 2023 and 2024 proceedings are in IEEE Xplore; 2026 papers are submitted for inclusion in IEEE Xplore
- Extended versions of selected papers are recommended to SCIE journals
- Full papers up to 8 pages in double-column format, double-blind review through Microsoft CMT
- Very short gap between the paper deadline and the conference
- Not listed in ICORE2026 or the CCF 2026 list
