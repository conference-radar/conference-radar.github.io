notes:
- New ACNS satellite workshop, 1st edition in 2027 at Royal Holloway, University of London, run by a UK team
- "Scope: federated and split learning, differential privacy, privacy attacks, private generative models and synthetic\
  \ data, applied to regulated or cyber-physical settings (healthcare, industrial IoT, energy, transport); general\
  \ privacy-preserving AI without that link is out of primary scope"
- Regular, short, systems/survey and dataset/benchmark papers in LNCS format; at least three reviews per paper; submission
  through Microsoft CMT
- Accepted papers appear in the joint ACNS workshop post-proceedings in Springer LNCS; in-person presentation required
- Full-day, in-person workshop
- Not listed in ICORE2026 or the CCF list
