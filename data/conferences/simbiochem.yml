notes:
- Workshop on machine learning for molecular and biological simulation (learned potentials, differentiable simulation, physically grounded architectures)
- 1st edition at EurIPS 2025 in Copenhagen (December 6, 2025); 2nd edition at NeurIPS 2026 in Sydney
- Non-archival with no formal proceedings; camera-ready papers are collected on a proceedings page on the website
- Previously presented or under-review work is welcome
- Double-blind review on OpenReview, 5 to 8 pages in NeurIPS format, no rebuttal phase
- "Acceptance: 29 of 37 papers (2025), 53 of 79 papers (2026)"
- Five 2025 papers were invited by Nature Portfolio editors to submit extended versions
- Not listed in ICORE2026 or the CCF list
