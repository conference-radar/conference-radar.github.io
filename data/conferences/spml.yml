full_name: International Conference on Signal Processing and Machine Learning
type: conference
tier: minor
areas: [ai, communications]
region: china
language: english
frequency: annual
organizer: Chinese host universities (Xijing University for 2027) with a conference secretariat (spml.contact@gmail.com)
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
fee: 580 USD standard author registration (2027; 550 USD before April 20); 530 USD student (500 USD before April 20)
typical:
  deadline_months: [2]
  conference_months: [7]
links:
  website: https://www.spml.net/
notes:
- Started in 2018; held in China (online 2021 and 2022, Tianjin 2023, Qingdao 2024, Hohhot 2025, Hangzhou 2026, Xi'an 2027)
- Proceedings in the ACM Digital Library for 2018 to 2024; SPML 2025 proceedings in IEEE Xplore; all indexed by Ei Compendex and Scopus
- Hybrid onsite and online; abstract only presentation (no publication) also offered
- Papers 4 to 6 pages; extra pages charged
- Deadlines have been extended more than once (SPML 2026 extended to May 20, 2026)
- Not listed in the CORE ICORE2026 portal or the CCF list
