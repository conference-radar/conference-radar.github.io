notes:
- Annual since 2023; held in China (Beijing 2024, Jiaozuo 2025, Baotou 2026)
- NCIC 2024 proceedings in Springer Lecture Notes in Networks and Systems (LNNS vol. 1360), indexed in EI Compendex and Scopus
- NCIC 2023 proceedings (ISBN 979-8-3503-7194-9) indexed in EI Compendex and Scopus
- Two submission rounds; deadlines and dates are often moved
- Not listed in CORE ICORE2026 and not on the CCF list
