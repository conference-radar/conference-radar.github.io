notes:
- Held in conjunction with IEEE DCOSS-IoT; 8th edition on June 24, 2026 in Reykjavik, and listed again for DCOSS-IoT 2027 in Montreal
- ICT as an enabler for the circular economy (IoT, crowdsensing, low-power networks, blockchain, smart infrastructure, data-driven business models)
- Papers up to 8 pages in IEEE two-column format plus up to 2 appendix pages at 100 USD per page; single-blind review via EasyChair
- Papers appear in IEEE Xplore; no-show papers are excluded from the proceedings
- Sponsored by the 3D Circular project; registration through DCOSS-IoT
- Not listed in CORE ICORE2026 or the CCF 2026 list
