notes:
- Annual two-day cybersecurity symposium run by CERIAS at Purdue University, held since 2000
- Held at the Purdue Memorial Union (PMU), West Lafayette, Indiana; 2020 and 2021 were virtual
- Programme of panels, technical talks, a fireside chat and a student poster session; no call for papers and no published proceedings
- Posters received by the deadline are included in the materials handed to attendees; many talks are posted on YouTube
- CERIAS prints posters for Purdue students who send them by the poster deadline
- "Listed in CORE ICORE2026 as Information Security Symposium (CERIAS), rank National: USA"
