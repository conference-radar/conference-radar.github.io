notes:
- WS30 at IEEE ICC 2026 in Glasgow, a half-day workshop on 28 May 2026
- Topics are 6G for cobots, drones, humanoid, mobile and social robots (embedded AI, ISAC, RIS, URLLC, edge cloud, DECT NR+, SLAM, testbeds)
- Organizers include Frank Fitzek (TU Dresden), Florian Kaltenberger (EURECOM), Christian Wietfeld (TU Dortmund) and Sami Haddadin (TU Munich and MBZUAI)
- Short name NCR-6G is used in this list only; the workshop has no official acronym
- Not in the ICC 2025 workshop list
- Accepted and presented papers go into the IEEE ICC 2026 proceedings and IEEE Xplore; no-show papers can be removed
- Submissions via EDAS through the ICC workshop call
- Not listed in ICORE2026
