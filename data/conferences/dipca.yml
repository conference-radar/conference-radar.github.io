notes:
- Annual since 2024 and held in a different Chinese city each spring (Zhuhai 2024, Xi'an 2025, Suzhou 2026, Urumqi 2027)
- The 2024 edition ran as IPCA 2024, a sub-conference of CVIDL 2024 in Zhuhai
- Covers image processing and computer vision plus AI, computer systems and intelligent applications
- 2027 papers are reviewed by two or three reviewers and published by IEEE (ISBN 979-8-3195-6806-9), then submitted to EI Compendex and Scopus
- 2027 edition supported by two IEEE SMC technical committees (Embodied AI Systems; Cybernetics of Complex Systems)
- Hybrid online and onsite format in 2025
- Not listed in CORE ICORE2026
