notes:
- Workshop of IEEE WiMob on cooperative wireless networking (relaying, D2D, RIS, UAV-assisted, vehicular, cell-free,
  AI-driven resource allocation); 13th edition in 2026
- Run from the Universidade de Vigo (Spain) with co-chairs from UPCT Cartagena and RWTH Aachen
- Papers up to 6 IEEE pages (2 extra pages can be bought), submission via EDAS; published in the WiMob proceedings
  and submitted to IEEE Xplore
- Past editions listed on the site for 2015, 2016, 2017, 2019 and every year from 2021; follows WiMob (Paris 2024,
  Marrakech 2025, Avignon 2026)
- The WiMob 2025 and 2026 programs list no separate CWN session
- Not found in the ICORE2026 CORE portal search
