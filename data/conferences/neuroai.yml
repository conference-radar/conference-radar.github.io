notes:
- Workshop linking AI, computational neuroscience and neuromorphic engineering, held with AAAI
- First edition at AAAI-26 in Singapore (Jan 27, 2026), second edition (NeuroAI 2.0) at AAAI-27 in Montreal
- 2026 proceedings published in PMLR volume 308
- Full papers up to 8 pages are archival; short papers up to 4 pages are non-archival
- Double-blind review on OpenReview, AAAI two-column format
- At least one author of each accepted paper must attend
- Not listed in ICORE2026 and not on the CCF list
