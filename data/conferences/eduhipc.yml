id: eduhipc
name: EduHiPC
full_name: Workshop on Education for High Performance Computing (at HiPC)
type: workshop
tier: minor
areas: [general, systems]
region: south-asia
language: english
frequency: annual
organizer: CDER Center (Center for Parallel and Distributed Computing Curriculum Development and Educational Resources), held with IEEE HiPC
organizer_country: [usa, india]
proceedings: IEEE Xplore (HiPC Workshop Proceedings)
archival: true
typical:
  deadline_months: [10]
  conference_months: [12]
links:
  website: https://cdercenter.org/eduhipc-2026/
notes:
- Workshop on HPC and parallel and distributed computing education, held with IEEE HiPC in India every year (8th edition in 2026)
- Sister workshop of EduHPC at SC, run by the same CDER Center community
- Tracks for educational research (up to 8 pages), research to education and student engagement (4 to 6 pages), plus 2-page poster abstracts
- Papers published in the HiPC Workshop Proceedings; the 2025 call says they are included in IEEE Xplore
- Not listed in CORE ICORE2026
