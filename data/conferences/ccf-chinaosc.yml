notes:
- Annual open source conference of the China Computer Federation, run with the CCF Open Source Development Technical Committee
- Keynotes, summit forums and parallel themed forums on open source software, operating systems, chips, large models and supply chain security
- Talks and forums only, no paper track or proceedings; forum proposals are reviewed by the program committee
- Held in a different Chinese city each August (Shanghai 2025, Chongqing 2026); talks mostly in Chinese
- 2026 edition co-hosted by Chongqing University with the theme of AI for software engineering and software engineering for AI
