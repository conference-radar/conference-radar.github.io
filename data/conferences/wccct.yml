id: wccct
name: WCCCT
full_name: IEEE World Conference on Computing and Communication Technologies
type: conference
tier: minor
areas: [networking, communications, security, ai, systems, general]
region: china
language: english
frequency: annual
organizer: Rotating Chinese host university with IEEE sponsorship (Southwest Jiaotong University in 2027, Ocean University of China in 2026)
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [IEEE Xplore, EI, Scopus]
typical:
  deadline_months: [12]
  conference_months: [4]
links:
  website: https://www.wccct.org/
notes:
  - Annual conference since 2020 (10th edition in 2027; 2020 planned for Warsaw but held online); host university changes each year
  - Held in Chengdu, Shenzhen, Qingdao and Dalian; 2021 to 2023 editions in January, from 2024 in April
  - Proceedings in IEEE Xplore and indexed in EI Compendex and Scopus (2020, 2021 and 2023 to 2026; 2022 not listed)
  - 2027 tracks include edge intelligence, large model inference, AI chips, 6G and SDN, space-air-ground networks,
    cybersecurity and trusted computing, and quantum computing and communication
  - Full papers 4 to 10 pages; one regular registration covers 5 pages, extra pages charged
  - Not listed in ICORE2026 or the CCF 2026 list; a small regional venue
