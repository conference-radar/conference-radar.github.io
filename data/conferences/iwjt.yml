notes:
- Workshop on semiconductor junction formation (doping, annealing, epitaxy, contacts), devices and characterization, started in 2000
- Held in Japan or China until 2025; 2026 in Grenoble was the first edition outside Asia
- Sponsored by IEEE EDS; 2025 technically co-sponsored by the IEEE EDS Japan Joint Chapter and Kansai Chapter
- Submissions are 2 to 4 page camera-ready papers, reviewed for oral or poster; accepted papers are published in IEEE Xplore
- About 100 attendees from Asia, Europe and the US; best paper and young researcher awards
- No edition in 2024 (2023 then 2025)
