notes:
- Run by KLE Institute of Technology (KLE Society), Hubballi, Karnataka, India
- Co-sponsored by IEEE NKSS (North Karnataka Subsection) and the IEEE Information Theory Society per the official site
- All editions from 2021 to 2025 are in IEEE Xplore; held in Hubli/Hubballi except 2024 (Bangalore)
- Five tracks -> data science, computing technologies, computational intelligence, communication and networking, signal
  and image processing
- Submission via Microsoft CMT
- Not listed in ICORE2026 or the CCF 2026 list
