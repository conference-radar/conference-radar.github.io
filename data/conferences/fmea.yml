notes:
- CVPR workshop on LLMs, VLMs and other foundation models for embodied agents; held at CVPR 2025 (Nashville) and CVPR 2026 (Denver)
- Non-archival; accepted papers are hosted on the workshop website and dual submission is allowed
- Research papers up to 8 pages, short papers of 4 pages, plus position and survey papers, in CVPR format with anonymous review
- 34 papers accepted in 2026 and 21 in 2025, all presented as posters
- Runs embodied agent benchmarks and challenges (ENACT, EmbodiedBench, Embodied Agent Interface, RoboMME)
- Same group also ran related tutorials at AAAI 2025, NAACL 2025 and ICCV 2025
- Not listed in ICORE2026 or the CCF list
