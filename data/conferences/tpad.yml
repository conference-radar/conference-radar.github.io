notes:
- Full-day satellite workshop of IEEE ICASSP 2027 on adversarial robustness and security of camera, LiDAR and radar perception for automated driving
- Submissions must state attacker access, injection point, stages affected and measurement point
- Papers follow the ICASSP 2027 style and length, are reviewed on the ICASSP platform and published in IEEE Xplore under a separate workshop record
- One author of each accepted paper must present in person
- Program has a keynote (Panos Nasiopoulos, University of British Columbia), contributed sessions, a poster session, a roundtable and an executive panel
- Paper deadline extended from 11 Nov to 2 Dec 2026
- Not listed in ICORE2026 or the CCF list
