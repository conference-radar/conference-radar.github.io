notes:
- Annual since 2022 (virtual 2022, Chengdu 2023, Fuzhou 2024, Harbin 2025, Chengdu 2026 and 2027)
- Run by a conference secretariat with a Chengdu contact address (no society or university named as organizer)
- Proceedings in IEEE Xplore (IEEE CPS for 2022 to 2024, IEEE for 2025 and 2026), indexed by EI Compendex and Scopus
- Papers of 5 pages are suggested; extra pages are charged at registration
- Abstract only presentations (oral or poster) are also offered
- Not listed in the CORE ICORE2026 portal; no CCF rank set
