areas: [communications, networking, data]
region: china
language: english
frequency: annual
organizer: Conference secretariat (contact@jcice.org, Chengdu) with a general chair from Beijing Information Science and Technology University in 2027
organizer_country: [china]
proceedings: IEEE Xplore (IEEE CPS up to 2024, IEEE from 2025)
archival: true
