notes:
- Small commercially run conference; the 2025 edition was hosted by Dalian University of Technology and run by the AEIC Academic Exchange Center
- 2025 edition held online via Zoom on 30 August 2025 with about 30 attendees; 2026 edition planned in Xi'an
- AICE 2026 proceedings published by IEEE (ISBN 979-8-3195-0808-9) and submitted to IEEE Xplore, EI Compendex and Scopus
- Each paper reviewed by two or three reviewers; proceedings papers at least 4 pages
- Broad scope covering AI algorithms, NLP, vision, blockchain and computational engineering applications
- Not ranked in ICORE2026 (the AICE listed there is the Australian Institute of Computer Ethics Conference)
