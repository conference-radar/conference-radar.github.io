notes:
- Workshop on federated learning and privacy-preserving computing on HPC systems, held with IEEE HiPC in India
- Topics include FL orchestration on HPC, secure aggregation, differential privacy, homomorphic encryption, MPC, TEEs and poisoning defences
- Accepted papers appear in the HiPC Workshops (HiPCW 2026) proceedings volume with its own ISBN
- Full papers of 6 to 10 pages in IEEE double-column format, submitted via Linklings
- At least one author must present in person with a full main-conference registration
- Not listed in CORE ICORE2026
