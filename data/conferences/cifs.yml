notes:
- Workshop held every year since 2019 with IEEE/ACM UCC (and BDCAT); 8th edition in 2026
- Topics are IoT, fog, edge and cloud continuum architectures, serverless, edge AI and security of these systems
- Research papers up to 6 pages and industry reports of 3 to 6 pages in double-column format; double-blind review
- Proceedings with UCC; the 2026 UCC author instructions say workshop papers go to IEEE Xplore, while the 2023 to 2025 workshop pages say ACM publishes them via IEEE Xplore and ACM DL
- One author must attend in person and register at the full rate
- Follows UCC (Taormina 2023, Sharjah 2024, Nantes 2025, Florianopolis 2026)
- The UCC 2026 site lists it as "Cloud, IoT and Fog Systems (and Security)"
- Not found in the ICORE2026 CORE portal search
