notes:
- New conference on AI for networks and networks for AI; first edition in 2026
- Organized by DNAC; 2026 general chairs from Cnam and NeuroTel.AI and from Orange Innovation (France)
- Technically co-sponsored by IEEE and IEEE ComSoc; accepted and presented papers are submitted to IEEE Xplore
- Regular papers up to 8 pages, short papers up to 5 pages, demos and positions 2 to 4 pages, IEEE 2-column style via EDAS
- 2026 held at the Inria Paris building, with an opening workshop by the NET4AI ANR project
- Not listed in CORE ICORE2026
