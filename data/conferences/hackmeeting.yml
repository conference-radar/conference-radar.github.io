  website: https://hackmeeting.org/
notes:
- Yearly self-organized gathering of the Italian hacker and digital counterculture scene, held since 1998 (first edition at CPA Firenze Sud)
- Three days of talks, workshops, ten-minute talks and a LAN space, hosted in social centres; no organizers or audience, only participants
- Talks and labs are proposed by email on the hackmeeting mailing list; talks may be audio recorded
- Main language Italian; the site has Spanish and English translations
- A separate Spanish Hackmeeting runs yearly (2026 edition 9 to 12 October at CSN, Valencia)
- No proceedings
- Not listed in ICORE2026; not on the CCF list
