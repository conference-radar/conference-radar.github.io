notes:
  - Workshop on benchmarking, evaluating and deploying agentic AI systems for enterprise operations
  - 1st edition at AAAI 2026 in Singapore (26 January 2026); 2nd edition at NeurIPS 2026 in Sydney (11 December 2026)
  - Host conference changes between editions
  - Non-archival with double-blind review on OpenReview; dual submission welcome
  - 2026 NeurIPS edition takes papers up to 4 pages in NeurIPS style, references and appendices unlimited
  - At least one author must present in person
  - Not listed in ICORE2026 or the CCF list
