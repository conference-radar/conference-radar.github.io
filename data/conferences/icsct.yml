id: icsct
name: ICSCT
full_name: International Conference on Software and Computing Technologies
type: conference
tier: minor
areas: [software, general]
region: southeast-asia
language: english
frequency: annual
organizer: Commercial conference secretariat (contact icsct@iap.org, confsys.iconf.org submission system); 2025 sponsored by Duy Tan University
organizer_country: [china]
proceedings: Journals IJCTE or JSW (accepted full papers)
archival: true
typical:
  deadline_months: [7]
  conference_months: [7, 8]
links:
  website: https://icsct.org/
notes:
- Annual since 2017; held in Danang, Vietnam in 2023 and 2024 (hybrid) and at Duy Tan University, Danang in 2025; virtual 2020 to 2022; Hong Kong in 2019
- No separate conference proceedings; all accepted, registered and presented full papers are published in the International Journal of Computer Theory and Engineering (IJCTE) or the Journal of Software (JSW)
- Abstract only presentation without publication is also offered
- Run by a commercial conference secretariat with a GMT+8 phone contact; 2025 sponsored by Duy Tan University and co-sponsored by the University of Da Nang and Ho Chi Minh City University of Technology
- Not listed in ICORE2026
