notes:
- First edition, a special session of Euromicro PDP 2027 (Barcelona, Spain)
- Covers modeling and simulation of IoT, edge, fog and cloud systems, digital twins, simulator validation and benchmarking, orchestration and resource management
- Chaired by Attila Kertesz (University of Szeged, Hungary) and Amjad Ullah (Edinburgh Napier University, UK); linked to the Horizon Europe project Swarmchestrate
- Papers up to 8 pages in IEEE conference format, double-blind, submitted through the PDP 2027 EasyChair system
- Accepted papers published in the PDP proceedings by IEEE CPS, submitted for Scopus indexing
- At least one author must register and present at PDP
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list (PDP itself is CORE C)
