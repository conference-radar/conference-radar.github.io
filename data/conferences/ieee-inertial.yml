notes:
  - IEEE Sensors Council symposium on inertial sensors (MEMS and quantum gyroscopes, accelerometers, IMUs) and navigation systems, held every year since 2014
  - Single-track meeting with one day of tutorials and three days of technical sessions
  - Rotates worldwide (Avignon 2022, Kauai 2023, Hiroshima 2024, Lindau 2025, Destin 2026, Singapore 2027)
  - "Submission options: A, abstract for the INERTIAL proceedings; B, 4-page manuscript to IEEE Sensors Letters; C, 2-page late news abstract"
  - Industry authors can present with an abstract only (not submitted to IEEE Xplore)
  - EE sensors venue outside the usual CS rankings, not listed in ICORE2026
