links:
  website: https://curateddata.github.io/
notes:
  - Workshop on data-centric efficient learning (dataset distillation, data pruning, synthetic data, data selection)
  - 1st edition at ICCV 2025 (Honolulu, 34 accepted papers, 13 in CVF Open Access); 2nd at ECCV 2026 (Malmo)
  - Archival papers 4 to 14 pages in ECCV format; non-archival track accepts other templates and work under review or accepted elsewhere
  - Submissions via OpenReview; full-day workshop
  - Not listed in ICORE2026 or the CCF list
