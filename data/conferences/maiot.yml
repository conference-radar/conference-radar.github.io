notes:
- Workshop on middleware for AI plus IoT systems across the IoT, edge and cloud continuum (AI model lifecycle, privacy and security, energy efficiency, interoperability)
- Run by the EU-funded PANDORA project; co-chairs Georgios Bouloukakis, Hans-Arno Jacobsen, Asterios Stroumpoulis and (2026) Konstantinos Tserpes
- 1st edition with Middleware 2025 in Nashville (December 16, 2025), 2nd with Middleware 2026 in Tarragona (December 15, 2026)
- Hybrid workshop (virtual and on site), although the Middleware main conference is in person only
- Papers up to 6 pages in ACM SIGPLAN format, double-blind review via HotCRP; also accepts work in progress, demos and position papers
- Accepted papers appear in the Middleware companion proceedings in the ACM DL; one author needs a full pre-conference registration
- Five papers in the 2026 program
- Not listed in the ICORE2026 portal or the CCF 2026 list
