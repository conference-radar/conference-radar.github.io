notes:
  - AAAI workshop on foundation models and generative AI for finance, with a research track and a benchmark track
  - 1st edition at AAAI-27 in Montreal, one day on Monday 22 February 2027
  - Non-archival, no proceedings; submissions on OpenReview stay private, camera-ready PDFs optionally posted on the workshop site
  - Long papers up to 7 pages and short papers up to 4 pages of technical content, AAAI-27 template, unlimited references and appendices
  - Double-blind review on OpenReview with at least two reviews and a meta-review per paper
  - Best Paper and Best Benchmark awards; at least one author must attend in person
  - Submission deadlines AoE
  - Not listed in ICORE2026 or the CCF list
