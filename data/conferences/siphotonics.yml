notes:
- IEEE Photonics Society conference on silicon photonics, formerly the IEEE Group IV Photonics Conference (held since
  2004)
- Rotates worldwide every April (2023 Washington DC, 2024 Tokyo Bay, 2025 London, 2026 Ottawa, 2027 Taipei)
- Topics cover active and passive silicon photonic devices, electronic-photonic and heterogeneous integration,
  materials and fabrication, and applications such as AI, HPC, quantum, 6G and LiDAR, plus industry sessions
- Submissions are 2-page papers with a 45-word abstract; accepted papers that are presented go to IEEE Xplore
- All accepted authors must register and present in person
- Photonic devices venue rather than computer science; not listed in ICORE2026 or CCF
