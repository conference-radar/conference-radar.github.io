notes:
- Organized by IARIA as part of the DigitalWorld congress, co-located with ICDS, ACHI, GEOProcessing, eLmL, eKNOW, ALLSENSORS and SMART ACCESSIBILITY (19th edition in 2027)
- Covers eHealth services, telemedicine, electronic health records, patient self-management and health informatics
- Published open access in the IARIA ThinkMind library (ISSN 2308-4359); prints via Curran Associates; selected papers invited to IARIA journals
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Held in southern Europe (Nice, Porto, Venice, Barcelona in recent years); onsite and online participation options
- IARIA deadlines are often extended after the initial date
