notes:
- Co-located workshop of the IEEE Symposium on Security and Privacy (SPW); 1st edition in 2027 in Montreal
- Run by the Cyber Science Lab at the University of Guelph; general chair Ali Dehghantanha
- Three tracks, forensic investigation of AI systems, forensic examination of AI-generated content, and evidence
  (admissibility, chain of custody)
- Research and SoK papers 13 pages plus 5 pages of references and appendices, short papers 6 pages; IEEE compsoc
  format, double-blind via HotCRP
- All accepted papers appear in the IEEE Security and Privacy Workshops proceedings in IEEE Xplore
- Papers early-rejected from IEEE S&P 2027 can be revised and submitted
- At least one author must present in person
- Not the same venue as AIFC (AI and Forensics and Cybersecurity workshop at COMPSAC)
