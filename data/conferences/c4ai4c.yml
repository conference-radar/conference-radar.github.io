notes:
- Workshop on security of AI systems and on AI methods for cybersecurity
- Moves between IEEE host conferences (SMC 2023 Honolulu, SMC 2025 Vienna, CAI 2026 Granada, ICASSP 2027 Toronto)
- 2027 edition is a full-day ICASSP 2027 satellite workshop; papers are submitted with the ICASSP author kit through the ICASSP CMS workshop system
- ICASSP 2027 satellite workshop papers appear in IEEE Xplore under a separate workshop record
- Not listed in ICORE2026 and not on the CCF list
