notes:
- Workshop on automated software engineering for resilient, safe, secure and norm-aware (responsible) AI-based systems
- Held on October 12, 2026 with ASE 2026 in Munich; two keynotes, break-out groups and four paper talks
- The CFP states that accepted papers are included in the ASE conference proceedings
- Regular papers up to 8 pages and short papers up to 4 pages including references, IEEE conference format; at least 3 PC reviews per paper
- Submissions via HotCRP (rssr26.hotcrp.com)
- Not to be confused with the railway safety conference RSSRail (id rssrail)
- Not listed in the CORE portal (ICORE2026)
