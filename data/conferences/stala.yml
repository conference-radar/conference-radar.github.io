notes:
- New NDSS co-located workshop in 2027 (Seoul, Korea, Monday 22 Mar 2027)
- Topics include jailbreaks and prompt injection, agent hijacking through tools and MCP, RAG and memory poisoning, red teaming,
  fuzzing of LLM systems, guardrail evaluation and security assurance evidence
- Double-blind review with two to three reviews per paper; full papers up to 8 pages, short, position and experience papers
  up to 4 pages (excluding references and appendices), NDSS 2027 template
- Accepted papers published by the Internet Society in the NDSS 2027 co-located workshop proceedings before the workshop
- Negative results explicitly welcome; artifact release strongly encouraged
- 2027 keynotes by Ahmad-Reza Sadeghi (TU Darmstadt) and Masashi Sugiyama (RIKEN AIP / University of Tokyo)
- Region follows the host NDSS Symposium, usually held in San Diego, USA (the 2027 edition is in Seoul, Korea)
- Not listed in ICORE2026
