notes:
- Workshop of IEEE WiMob on e-health applications and services over pervasive wireless networks; held every
  year since 2013 (14th edition in 2026)
- Accepted papers are published in the WiMob proceedings and submitted to IEEE Xplore; selected papers may be
  invited to a journal special issue
- Organizer and general chair from Univ Rennes, CNRS, IRISA; co-chairs from University College London, Gustave
  Eiffel University and University of Pau in 2026
- Follows WiMob around the world (Paris 2024, Marrakech 2025, Avignon 2026); virtual in 2020
- Registration is the WiMob registration; full-day workshop at WiMob
- Not found in the ICORE2026 CORE portal search
