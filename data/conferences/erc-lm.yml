notes:
- One-day satellite workshop of IEEE ICASSP 2027 on explainability, robustness (adversarial inputs, prompt injection, hallucination) and controllability of speech and audio language models
- Four-page papers, single-blind peer review
- The ICASSP 2027 call for satellite workshops states that accepted workshop papers are published in IEEE Xplore under a separate workshop record
- Invited speakers include Nick Bryan, Dinesh Manocha, Bo Li, Wenwu Wang and Alexandre Defossez
- Paper deadline extended to 18 Nov 2026 AoE
- Not listed in ICORE2026 or the CCF list
