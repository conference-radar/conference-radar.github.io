notes:
- 1st edition in 2026, hybrid, at the City of Innovation (CIM), Cadi Ayyad University, Marrakech, Morocco
- Run by Cadi Ayyad University (Morocco); organizing committee entirely Moroccan, scientific committee mostly Moroccan with members from France, the USA and elsewhere
- Papers to be published in Springer Studies in Computational Intelligence; a second Springer series (ASTI, IEREK) listed as pending
- Selected papers may be invited as extended versions to Scopus-indexed journals
- Very short cycle in 2026 with camera-ready three days before the event
- Not listed in ICORE2026 (portal search returns no results) or the CCF list
