notes:
- Not the SPIN model checking symposium; this is the Amity University signal processing and networks conference in Noida (Delhi NCR), India
- Held every year from 2014 to 2025; no 2026 edition, 13th edition in February 2027
- Proceedings in IEEE Xplore for 2014 to 2021, 2023 and 2024; Springer Lecture Notes in Electrical Engineering (LNEE) for 2022, 2025 and 2027
- Tracks on signal, image and video processing, AI and deep learning, communication systems and IoT, embedded systems and robotics, VLSI, and Earth system signal processing
- Papers 8 to 15 pages in Springer format, blind review via Microsoft CMT; papers under 4 pages are not published
- Hybrid format with in-person and virtual participation
- Not listed in ICORE2026
