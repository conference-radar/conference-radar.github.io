id: acmlc
name: ACMLC
full_name: Asia Conference on Machine Learning and Computing
type: conference
tier: minor
areas: [ai]
region: asia-pacific
language: english
frequency: annual
organizer: Conference secretariat at iacsitp.com (contact acmlc@iacsitp.com); co-organized by Renmin University of China in 2026
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
fee: 505 USD regular author (2026; 470 USD early bird, 430 to 460 USD student); 315 to 350 USD presentation only
typical:
  deadline_months: [5]
  conference_months: [7]
links:
  website: https://www.acmlc.org/
notes:
- Smaller commercially organized conference; secretariat works on China time (GMT+8)
- 2026 is the 8th edition; proceedings published by IEEE and submitted to EI Compendex and Scopus
- Proceedings history -> IJMLC journal (2017 to 2021), IEEE Xplore (2022), ACM ICPS in the ACM DL (2024, 2025), IEEE (2026)
- Held in Asia (Singapore 2017, Ho Chi Minh City 2018, Hong Kong 2019 and 2025, Bangkok 2022 and 2024, Beijing 2026); 2021 was moved online from Bangkok; no 2020 or 2023 edition
- At least 4 pages; one registration covers 5 pages; abstract only presentation without publication also offered
- Not listed in the CORE ICORE2026 portal or the CCF list
