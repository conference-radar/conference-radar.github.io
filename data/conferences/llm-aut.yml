notes:
  - First edition at AAAI-27 (Montreal), full-day in-person workshop on Tuesday 23 February 2027
  - Security of deployed, tool-using LLM agents (prompt injection, memory poisoning, tool misuse, multi-agent security, defenses, benchmarks)
  - Full papers up to 7 pages excluding references in AAAI two-column format, double-blind via OpenReview
  - At least two reviews per paper, a third for borderline submissions
  - Non-archival; expanded work can be submitted elsewhere
  - Advisory board includes Florian Tramer (ETH Zurich), Neil Gong (Duke) and Virginia Smith (CMU)
  - Not listed in ICORE2026 or the CCF list
