id: iciba
name: ICIBA
full_name: IEEE International Conference on Information Technology, Big Data and Artificial Intelligence
type: conference
tier: minor
areas: [ai, data]
region: china
language: english
frequency: irregular
organizer: IEEE China Council and Chongqing Global Union Academy of Science and Technology
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI]
fee: 500 USD author, 450 USD student or IEEE member (2027)
typical:
  deadline_months: [7]
  conference_months: [8]
links:
  website: http://www.iciba.org/
notes:
- Sponsored by IEEE China Council and Chongqing Global Union Academy of Science and Technology; chaired from
  Chongqing University of Technology
- Accepted papers are submitted for inclusion in IEEE Xplore; at least two reviewers per paper; papers of 4 pages or
  more, five pages included in the fee
- 2027 is the 6th edition; earlier editions were in 2020, 2021, 2023, 2024 and 2026 (no 2022 or 2025 edition), all with
  IEEE conference proceedings
- Short gap between deadline and conference (deadline about five weeks before the event)
- Not listed in CORE ICORE2026 or the CCF list
