notes:
- IEEE co-sponsored multi-conference on electrical engineering and information technology (systems, signals, devices, communications and computing)
- The 24th edition SSD'27 is in Tunis, Tunisia
- Papers are submitted through EDAS in IEEE format, with IEEE PDF eXpress and the IEEE copyright form; the site links past proceedings as "SSD in IEEE Xplore"
- The official site states SSD papers are in IEEE Xplore and indexed in Scopus since 2008
- Regular paper deadline for 2027 was extended from 2026-11-02 to 2026-11-30
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
