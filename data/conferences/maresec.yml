notes:
- Small standalone German workshop on resilience, safety and security of maritime systems (ports, ships, AUVs, maritime communications and critical infrastructure)
- All submissions are peer-reviewed; full papers 4 to 6 pages or extended abstracts 1 to 2 pages in two-column IEEE format via EasyChair
- Proceedings are published open access on Zenodo with a DOI per paper (one Zenodo community per year since 2021)
- Authors of high-quality papers are invited to submit extended versions to Transactions on Maritime Science (ToMS)
- Editions 2021 to 2024 and 2026 in Bremerhaven, 2025 (hybrid) and 2027 at the University of Rostock
- Also has a call for special sessions with its own proposal deadline
- Not listed in CORE ICORE2026
