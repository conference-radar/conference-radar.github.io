notes:
- Small one-day standalone edge computing workshop run by Ukrainian universities, held at Zhytomyr Polytechnic State University with online broadcast
- Proceedings in CEUR-WS (2021, 2023, 2024, 2025; planned for 2027); 2026 proceedings were in ACM ICPS
- Selected papers invited to post-proceedings in the Journal of Edge Computing after a second review round
- Blind peer review; at least one author must present
- Not listed in CORE ICORE2026
