notes:
- Organized by the School of Computer Science and Engineering (SCOPE), VIT Chennai, and held on the VIT Chennai campus; 9th edition in 2026
- Accepted, registered and presented papers are submitted for inclusion in IEEE Xplore
- Double-blind review through Microsoft CMT; papers of at most 6 pages; similarity index must be below 10%
- An author may submit at most two papers
- Tracks cover AI and ML, smart cities, green computing, blockchain, edge and 5G/6G computing, cybersecurity, Industry 4.0, AR/VR and quantum computing
- Not listed in ICORE2026; a small regional venue
