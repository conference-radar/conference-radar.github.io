notes:
- Full-day workshop (WS-24) at IEEE GLOBECOM 2026 in Macau on generative edge AI, multimodal IoT and LLMs for connected healthcare
- 2026 co-chairs are M. Shamim Hossain (King Saud University), Min Chen (SCUT), Selwa A.F. Al-Hazzaa (KACST) and Victor C.M. Leung (Shenzhen University)
- 2026 program has 19 papers in four sessions, a keynote and a panel
- First edition at GLOBECOM 2026; not in the GLOBECOM 2025, ICC 2025 or ICC 2026 workshop lists
- Workshop papers go into the GLOBECOM proceedings and IEEE Xplore
- Not listed in ICORE2026 or in the CCF 2026 list
