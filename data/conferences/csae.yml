notes:
- Annual since 2017; held in China until 2021 (Shanghai, Hohhot, Sanya), virtual in 2020 and every year since 2022
- 2026 edition was planned for Shanghai on October 17 to 19 and changed to an online meeting on November 21 to 22
- Proceedings in the ACM International Conference Proceedings Series since 2018 (DEStech in 2017), indexed by EI Compendex and Scopus
- Rolling submission batches; notification about a month after submission
- Not listed in CORE ICORE2026
