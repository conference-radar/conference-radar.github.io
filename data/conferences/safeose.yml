notes:
- New NDSS co-located workshop in 2027 (Seoul, Korea, 22 Mar 2027); it grows out of the SDIoTSec workshop held at NDSS since 2024
- Scope is security at the ecosystem level, including open-source AI and agent ecosystems (MCP, A2A and similar), standardized
  IoT (Matter, MQTT, CoAP, BLE), SBOM and provenance, and governance and disclosure
- Double-blind review; regular papers up to 8 pages excluding appendices, NDSS workshop template
- Accepted papers appear in the official workshop proceedings published by the Internet Society
- Also runs an Open-Source AI Security Hackathon with its own deadline (30 Nov 2026); winners present at the workshop
- Research program chairs Gang Wang and Xiaojing Liao (UIUC); steering committee includes Luyi Xing, Jean Camp and Elisa Bertino
- Partly supported by an NSF Safe-OSE award
- Region follows the host NDSS Symposium, usually held in San Diego, USA (the 2027 edition is in Seoul, Korea); its predecessor SDIoTSec was held in San Diego 2024 to 2026
- Not listed in ICORE2026
