notes:
- Smaller commercially organized conference on AI and blockchain; secretariat contact uses an acm-sg.org address
- Proceedings in the ACM Digital Library (2024 and 2025 volumes), indexed by EI Compendex and Scopus
- Double-blind review; abstract-only submissions are presented but not published
- Online 2020 to 2022, then held in Japan (Aizu 2023, Tokyo 2024 and 2025, Osaka 2026)
- Not listed in CORE ICORE2026
