notes:
- Workshop co-located with ICCCN (International Conference on Computer Communications and Networks), technically co-sponsored by IEEE and IEEE ComSoc
- Topics are resilient and secure cloud and network infrastructure for IoT and industrial IoT
- Papers up to 6 pages in IEEE double-column format, submitted through the ICCCN EasyChair
- Accepted papers presented onsite go into the ICCCN proceedings and IEEE Xplore; papers not presented onsite appear in the proceedings only
- First edition in 2025 (Tokyo); not in the ICCCN 2026 workshop list
