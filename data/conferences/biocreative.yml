notes:
- Critical Assessment of Information Extraction Systems in Biology, a long-running community challenge on biomedical and clinical text mining with shared tasks plus a workshop
- Held in the USA and Spain in earlier editions, virtual in 2021; recent editions are co-located with a host conference (BioCreative VIII with AMIA 2023 in New Orleans, BioCreative IX with IJCAI 2025 in Montreal)
- BioCreative IX focused on LLMs for clinical and biomedical NLP with three shared tasks (MedHopQA, clinical sentence segmentation, ToxHabits on Spanish clinical text)
- Short papers of 4 to 6 pages plus references in the CEUR template, peer reviewed, submitted via ChairingTool; at least one author must attend in person
- Proceedings of BioCreative IX are published on Zenodo (non-archival); accepted papers may be considered for a journal special issue
- Not listed in ICORE2026 or the CCF list
