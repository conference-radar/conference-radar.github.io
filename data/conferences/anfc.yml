notes:
- New conference run by DTR Society (registered in Newark, Delaware, USA); 1st edition 2025 near Nice, 2nd 2026 in Lisbon, 3rd 2027 near Barcelona
- Hybrid, with on-site and remote presentation
- Papers published by DTR Society Press with ISBN and ISSN and in the DTR Society Digital Library
- Not yet indexed; the organizer says Scopus, DBLP and Google Scholar indexing is planned
- 2027 page uses the name International Conference on Advanced Networking and Future Communications
- Not listed in ICORE2026 and not on the CCF list
