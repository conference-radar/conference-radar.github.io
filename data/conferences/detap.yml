notes:
- Afternoon workshop (13:30 to 17:00) on defining, measuring and governing decentralisation in blockchains and other systems,
  including legal and normative angles
- 1st edition held with AFT 2026 in London (Space House, near the LSE venue)
- No proceedings; authors may optionally post papers on the workshop website
- Submissions are a title and talk abstract, with an optional full or short paper; work published or under
  review elsewhere is welcome
- Free to attend, registration required and places limited
- Not listed in ICORE2026 or the CCF list
