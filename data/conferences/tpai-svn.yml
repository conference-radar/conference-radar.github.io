notes:
- Held as workshop W11 at IEEE VTC2026-Fall in Boston
- Topics are AI-driven security for vehicular networks (privacy-preserving ML, blockchain trust management, adversarial ML, model poisoning and backdoor attacks)
- Organizers from the University of the West of England and Edinburgh Napier University (UK) and Prince Mohammad Bin Fahd University (Saudi Arabia)
- Papers 5 pages, up to 2 extra pages at 100 USD each; submitted through the VTC2026-Fall workshop TrackChair site
- VTC papers go to IEEE Xplore; IEEE may exclude papers not presented at the conference
- Not listed in ICORE2026
