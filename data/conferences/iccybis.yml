notes:
- Hosted by the School of Computer Science, Nusa Putra University; co-hosts for 2027 are Universitas Paradita,
  Universitas Pertahanan (Indonesia) and University of Buraimi (Oman)
- The IEEE Indonesia Section conference list names the IEEE CIS Indonesia Chapter as organizer and uses the acronym
  IConCIS
- Accepted and presented papers are to be submitted for inclusion in IEEE conference proceedings; IEEE Xplore and
  Scopus inclusion listed as pending
- Three tracks (cybersecurity, artificial intelligence, intelligent systems)
- Single-blind review with at least 3 reviewers; 5 to 6 pages in the IEEE template; submission via SimplyConf
- 2027 edition is held at Menara Merdeka, Jakarta, and is listed as hybrid by IEEE Indonesia Section
