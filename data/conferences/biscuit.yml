id: biscuit
name: BISCUIT
full_name: International Workshop on Biomedical Image and Signal Computing for Unbiasedness, Interpretability, and Trustworthiness
type: workshop
tier: minor
areas: [vision, ai]
region: worldwide
language: english
frequency: annual
organizer: Workshop organizers from KTH Royal Institute of Technology, CentraleSupelec (University Paris-Saclay) and Princeton University; co-located with ICCV or ECCV
organizer_country: [europe, usa]
proceedings: ECCV Workshops proceedings (Springer) or ICCV Workshops proceedings (CVF Open Access)
archival: true
typical:
  deadline_months: [7]
  conference_months: [9, 10]
links:
  website: https://rom42pla.github.io/biscuit_workshop/
notes:
- Workshop on fair, interpretable and trustworthy computer vision and signal processing for biomedical data
- 1st edition at ICCV 2025 in Honolulu (half day), 2nd at ECCV 2026 in Malmo (full day)
- Double-blind review on OpenReview in the main conference template, no rebuttal; each submission must name a co-author as reviewer
- Accepted papers appear in the host conference workshop proceedings and are presented as posters, some as orals
- At least one co-author must register and attend
- Not listed in ICORE2026 or the CCF list
