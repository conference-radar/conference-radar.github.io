id: icect-numl
name: ICECT
full_name: International Conference on Engineering and Computing Technologies
type: conference
tier: minor
areas: [ai, security, software, communications, networking, general]
region: south-asia
language: english
frequency: irregular
organizer: Faculty of Engineering and Computing, National University of Modern Languages (NUML), Islamabad; technically
  co-sponsored by IEEE
organizer_country: [other]
proceedings: IEEE Xplore
archival: true
fee: "PKR 15,000 to 20,000 for local authors, USD 100 to 150 for overseas authors (2027, per the CFP flyer)"
links:
  website: https://numl.edu.pk/icect/
notes:
- Run by the Faculty of Engineering and Computing at NUML and held on the NUML H-9 campus in Islamabad, Pakistan
- Technically co-sponsored by IEEE; presented papers are submitted for inclusion in IEEE Xplore
- Selected papers can also go to the NUML International Journal of Engineering and Computing (NIJEC, HEC Y category)
- Described as annual, but editions so far were 2021, 2022, 2024 (3rd, 23 May), 2025 (4th, 13 to 14 Nov) and 2027 (5th)
- Three tracks -> computing and technologies (AI, LLMs, security, cloud, NLP), software engineering, and intelligent
  systems in engineering (robotics, wireless and next-generation networks, IoT, power, VLSI)
- IEEE conference paper format; submission via Microsoft CMT
- Not listed in ICORE2026 or the CCF 2026 list
