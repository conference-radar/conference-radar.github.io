notes:
- Half-day workshop on reconfigurable computing (FPGAs and adaptive systems) held with IEEE HiPC in India since 2024 (3rd edition in 2026)
- Short papers up to 4 pages excluding references (IEEE two-column template), presented as talks
- Poster abstracts up to 2 pages are presented but not included in the proceedings
- Short papers appear in the HiPCW proceedings (with ISBN) and eligible papers are then submitted to IEEE Xplore; authors may opt out
- The 2025 edition was a keynote and tutorials only; 2026 introduced the first peer-reviewed short-paper track
- Not listed in CORE ICORE2026
