notes:
  - Annual conference since 2018 (10th edition in 2027), held in Chengdu, China in May (2023 to 2027 editions)
  - Co-sponsored by IEEE Chengdu Section and the Sichuan Institute of Electronics, supported by UESTC, Sichuan University
    and Southwest Jiaotong University
  - Proceedings in IEEE Xplore and EI Compendex (Scopus also stated up to 2024)
  - Broad electronics scope with tracks on antennas and microwaves, electronic materials and devices, communication and
    networks, and power engineering
  - Regular papers 4 to 10 pages, page charge 70 USD per page beyond 6; abstract-only presentations are not published
  - Not the same as ICET (International Conference on Emerging Technologies, Pakistan)
  - Not listed in ICORE2026 or the CCF 2026 list
