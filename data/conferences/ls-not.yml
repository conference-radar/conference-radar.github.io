notes:
- Held in conjunction with IEEE DCOSS-IoT every year since 2023 (2023 Pafos, 2024 Abu Dhabi, 2025 Lucca, 2026 Reykjavik)
- Long and short range wireless technologies (LPWAN and others) for IoT
- Proceedings in IEEE Xplore with the DCOSS-IoT proceedings
- Up to 8 pages including figures and references, IEEE conference template
- Not double-blind; author names must appear; submission via EasyChair
- Submission deadline extended by several weeks in 2025 and 2026
- DCOSS-IoT 2026 programme at a glance places LS-NoT (with SmaCE and HIEMI) on Wednesday, June 24
- Not in the DCOSS-IoT 2027 workshop list as of 2026-11-27
- Not listed in CORE ICORE2026 or the CCF 2026 list
