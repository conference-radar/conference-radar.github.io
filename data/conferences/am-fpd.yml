notes:
- Workshop on TFT technologies, flat panel display materials, thin-film devices and photovoltaics, held since 1994
- Sponsored by FTFMD (general incorporated association founded in 2015 by the workshop committee), co-sponsored by the Japan Society of Applied Physics, technically co-sponsored by IEEE Electron Devices Society and ECS
- Proceedings in IEEE Xplore (the official site links the AM-FPD 2012 to 2024 proceedings there)
- Authors submit camera-ready papers in early April; acceptance notification by the end of April; separate late-news paper call in May
- Selected papers get endorsement letters for submission to IEEE J-EDS, Open Journal on Immersive Displays or ECS JSS
- Held in Kyoto every year since 2011 except online editions in 2020 and 2021, usually in July (Ryukoku University Jojukan in 2024 to 2026); 34th edition in 2027
- "Registration fee (2027, by June 14): 50,000 JPY member, 52,000 JPY non-member, 20,000 JPY student"
- Not ranked by CORE (not listed in ICORE2026) or CCF
