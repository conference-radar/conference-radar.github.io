notes:
- Human-computer interaction conference of the Latin American HCI community LAIHC, held every two years since 2003 (Rio de Janeiro)
- Rotates around Latin America (Panama City 2019, online from Valparaiso 2021, Puebla 2023, Aracaju and Oaxaca 2026)
- 2026 (12th edition) ran in a distributed format with two in-person sites, Aracaju, Brazil (May 6-8) and Oaxaca, Mexico (May 27-29); full papers were presented in Aracaju only
- 2026 proceedings published in SBC OpenLib (DOI 10.5753/clihc.2026); 2021 and 2023 proceedings were in the ACM Digital Library
- Full papers up to 15 pages including references, in English, Portuguese or Spanish, double-anonymous review by at least two reviewers
- Four best papers of 2026 invited to an extended version in a special issue of the Journal of the Brazilian Computer Society
- Also has short papers, posters, workshops and tutorials, a student design competition and a graduate colloquium
- Not listed in the CORE portal (ICORE2026) or on the CCF list
