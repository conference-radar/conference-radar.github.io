notes:
- Co-located with MEDES (International Conference on Management of Digital EcoSystems); 1st edition at MEDES 2025 in Ho Chi Minh City
- Topics are AI methods for the security of decentralized autonomous organizations (DAOs)
- Papers appear in the MEDES proceedings in Springer CCIS
- Papers 8 to 12 pages, at least three reviews each; at least one author must attend to present
- Supported by IEEE Blockchain in 2025
- 2nd edition (AIDAOS'26) at MEDES 2026 in A Coruña, Spain
- Not listed in ICORE2026 (portal search returns no results) or the CCF list
