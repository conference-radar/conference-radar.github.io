notes:
- Workshop on learning to optimize, neural combinatorial optimization, meta-black-box optimization and LLM-based algorithm design
- First held at IJCAI-ECAI 2026 in Bremen (WS12), hybrid format
- Papers are not published in the IJCAI-ECAI proceedings; preprints and dual submissions are welcome
- Papers 6 to 9 pages (4 to 7 pages body plus 2 pages references), single-blind review via EasyChair
- Not listed in ICORE2026 or the CCF list
