links:
  website: https://sites.google.com/view/ai4research2026
notes:
- Workshop on AI across the scientific research lifecycle (hypothesis generation, experiment design, writing, reviewing, human-AI co-discovery)
- Editions at IJCAI 2024 (Jeju), AAAI 2025 (Philadelphia) and NeurIPS 2026 (3rd edition, Scaling Human-AI Co-Discovery); the host conference changes
- AAAI 2025 papers were non-archival by default with opt-in archival publication in Springer CCIS; IJCAI 2024 also offered optional Springer Nature proceedings
- 2026 submissions on OpenReview in NeurIPS format, short papers up to 4 pages and long papers up to 9 pages, double-blind, at least three reviewers per paper
- 2026 offers early feedback for authors from underrepresented groups before the deadline
- All 2026 deadlines 23:59 AoE
- Not ranked in ICORE2026 and not on the CCF list
