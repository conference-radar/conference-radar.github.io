notes:
- Co-located with SRDS (IEEE International Symposium on Reliable Distributed Systems); 2025 edition at SRDS 2025 in Porto
- Topics are distributed ledger technology used for cybersecurity, and security of DLT systems
- Research and demo papers (up to 6 pages, IEEE two-column) appear in a supplementary volume of the SRDS proceedings in IEEE Xplore
- Research and demo extended abstracts (up to 2 pages) are not included in the official proceedings
- Single-blind review
- General chairs from Niccolò Cusano University and Sapienza University of Rome (Italy)
- Not listed in ICORE2026 (portal search returns no results) or the CCF list
