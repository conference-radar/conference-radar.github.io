id: cyber-ai
name: Cyber-AI
full_name: International Conference on Cybersecurity and AI-Based Systems
type: conference
tier: minor
areas: [security, ai]
region: worldwide
language: english
frequency: annual
organizer: Steering committee of university researchers (Bulgaria, Romania, Italy, USA, Jordan) with IEEE section co-sponsorship
proceedings: IEEE Xplore (submitted after IEEE approval)
archival: true
typical:
  deadline_months: [4, 8]
  conference_months: [9, 12]
links:
  website: https://cyber-ai.org/
notes:
- Small hybrid conference; 2025 in Varna (Bulgaria), 2026 at the Romanian-American University in Bucharest, 2027 in Chiang Mai (Thailand)
- Each edition is co-sponsored by a local IEEE section (IEEE Romania Section in 2026; 2027 is co-applied to the IEEE Thailand Section)
- Accepted, registered and presented papers are submitted to IEEE Xplore; the site also advertises Scopus indexing and a journal special issue
- Several rounds of extended submission deadlines with rolling notification
- Organizing body not named on the official site; submission through the Sparcly system
- The site's list of previous events also includes Orlando (2023), Kitakyushu (2024) and a 2024 workshop at ICCNS in Dubrovnik, which do not match the edition numbering (2026 is the 2nd, 2027 the 3rd)
- Not listed in the CORE ICORE2026 portal
