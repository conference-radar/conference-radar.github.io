notes:
- Control, measurement and signal processing conference with a strong focus on intelligent oil fields and oil and gas equipment
- Held in China every year since 2019, mostly in Xi'an at Xi'an Shiyou University (Hangzhou 2022, Chengdu 2023)
- Accepted papers published by IEEE (ISBN 979-8-3195-4517-6 for 2026), in IEEE Xplore and indexed in EI Compendex and Scopus
- The 2025 edition reported over 400 attendees
- Papers at least 4 pages
- Not listed in CORE ICORE2026 or the CCF list
