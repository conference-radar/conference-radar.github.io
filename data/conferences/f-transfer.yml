id: f-transfer
name: F-TRANSFER
full_name: International Workshop on Facilitating Continuous Education and Training through AI in Software Engineering
type: workshop
tier: minor
areas: [software, ai]
region: worldwide
language: english
frequency: annual
organizer: F-TRANSFER workshop chairs (Babes-Bolyai University), co-located with IEEE SANER
organizer_country: [europe]
proceedings: IEEE Xplore (SANER companion proceedings, SANER-C)
archival: true
typical:
  deadline_months: [10, 12]
  conference_months: [3]
links:
  website: https://www.cs.ubbcluj.ro/~avescan/f-transfer-2027/
notes:
  - Workshop on education and training of software engineers and testers, including AI and generative AI in education
  - Run by chairs from Babes-Bolyai University, Cluj-Napoca, Romania; held with IEEE SANER every year since 2024
  - Papers appear in the SANER companion proceedings (SANER-C) in IEEE Xplore
  - New ideas papers up to 4 pages, research papers and experience reports up to 10 pages, plus 2 pages of references, IEEE format
  - Double-anonymous review, submitted via the SANER EasyChair
  - 2026 edition had 5 accepted papers and a keynote
  - Edition numbering differs between pages (the SANER 2025 page calls its edition the second, the 2026 site also says second, 2027 is the third)
  - Not listed in the CORE portal (ICORE2026)
