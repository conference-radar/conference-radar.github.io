id: easi-explimed
name: EASi-EXPLIMED
full_name: Joint Workshop on Explainable AI in Space and Explainable Artificial Intelligence for the Medical Domain
type: workshop
tier: minor
areas: [ai]
region: europe
language: english
frequency: annual
organizer: "EXPLIMED: University of Bari Aldo Moro and Polish Academy of Sciences; EASi: KP Labs, Silesian University of Technology, Warsaw and Poznan universities, ESA"
organizer_country: [europe]
proceedings: Springer CCIS (EASi track); CEUR-WS (EXPLIMED track)
archival: true
typical:
  deadline_months: [5]
  conference_months: [8, 10]
links:
  website: https://sites.google.com/view/easi-explimed
notes:
  - Joint workshop of two tracks at IJCAI-ECAI 2026, EASi (explainable AI in space) and EXPLIMED (explainable AI for medicine)
  - EXPLIMED started at ECAI 2024 (Santiago de Compostela) and ran again at ECAI 2025 (Bologna); proceedings in CEUR-WS Vol-3831 and Vol-4059
  - "EXPLIMED track: regular papers 10-20 pages, short papers 5-9 pages, CEUR one-column style, double-blind; published in CEUR-WS under CC-BY 4.0"
  - "EASi track: up to 20 pages plus 2 pages of references, double-blind; published in Springer CCIS"
  - EASi runs an AI competition alongside the workshop; competition papers had a later deadline (2026-06-01)
  - In person; one-day workshop on 2026-08-17
  - Not listed in ICORE2026 and not on the CCF list
