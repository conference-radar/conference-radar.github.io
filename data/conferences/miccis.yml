notes:
- Held in China every April (2025 Dongguan, 2026 Xiamen, 2027 Xiamen)
- 2026 edition sponsored by Jimei University, co-sponsored by the Fujian Computer Society and Fujian Association for Artificial Intelligence
- Proceedings of 2023 to 2026 in IEEE Xplore (published via IEEE CPS); 2023 to 2025 indexed in EI Compendex and Scopus
- Selected extended papers may be recommended to journals such as Computer Networks and Frontiers of Computer Science
- Topics cover mobile internet and IoT, cloud computing and big data, and information security (intrusion detection, access control, cryptography)
- Not listed in CORE ICORE2026 or the CCF list
