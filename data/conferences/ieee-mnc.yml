notes:
- Promoted by Technical Committee TC-37 of the IEEE Instrumentation and Measurement Society
- Called IEEE International Symposium on Measurements and Networking (M&N) until 2024; renamed MNC from the 2026 edition
- Recent editions 2022 Padua (6th), 2024 Rome (7th), 2026 Naples; one edition every two years recently
- Earlier hosts Anacapri, Naples, Coimbra, Naples and Catania; almost always held in Italy
- Topics include measurement in networking and communications, networking for measurement, cybersecurity and standardization
- Accepted papers go to IEEE Xplore; extended versions can go to an IEEE TIM / OJIM special section
- Not listed in ICORE2026
