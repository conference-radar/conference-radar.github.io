notes:
- Annual IEEE/PSMA workshop on wide bandgap (SiC, GaN) and ultrawide bandgap power devices, packaging and power electronics applications; 13th edition in 2026
- Held in the United States since 2013 (2020 postponed, 2021 virtual, Redondo Beach 2022, Charlotte 2023, Dayton 2024, Fayetteville 2025, Burlington 2026)
- Selection by a 3-page abstract (1 page summary plus 2 supporting pages) via EDAS, then a final paper of up to 6 pages in the 2-column IEEE template with an IEEE copyright form
- Final papers must be IEEE Xplore compliant
- First day of tutorials, then keynotes, panels, oral and poster sessions and an exhibition; strong industry and national lab presence
- Regional spinoffs WiPDA Asia and WiPDA Europe exist
- Not listed in CORE ICORE2026 or the CCF list
