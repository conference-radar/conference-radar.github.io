id: icsinc
name: ICSINC
full_name: International Conference on Signal and Information Processing, Networking and Computers
type: conference
tier: minor
areas: [communications, networking, ai, security]
region: china
language: english
frequency: annual
organizer: International steering committee led by Beijing University of Posts and Telecommunications (BUPT), with
  China Unicom Research Institute and a local host university
organizer_country: [china]
proceedings: Springer LNEE
archival: true
indexing: [EI]
typical:
  deadline_months: [5, 6, 7]
  conference_months: [7, 8, 9]
links:
  website: http://www.icsinc.cn/
notes:
- Steering committee chaired from BUPT; held in a different Chinese city each year (2022 Xining, 2023 Chengdu, 2024
  Chongqing, 2025 Changchun, 2026 Qingdao, 2027 Tianjin)
- Accepted papers are published in Springer conference proceedings and submitted for EI indexing; the volumes appear
  as "Signal and Information Processing, Networking and Computers" in Springer Lecture Notes in Electrical Engineering
- IEEE conference template, up to five pages without extra page charges
- Selected extended papers are recommended to journal special issues (IJSNet, EURASIP JWCN, Physical Communication)
- Broad scope covering wireless communications, signal processing, AI, multimedia, electronics and cybersecurity
- Not listed in CORE ICORE2026 or the CCF list
