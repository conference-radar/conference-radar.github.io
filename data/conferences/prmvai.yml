full_name: IEEE International Conference on Pattern Recognition, Machine Vision and Artificial Intelligence
type: conference
tier: minor
areas: [ai, vision]
region: china
language: english
frequency: annual
organizer: Chinese host universities (Shihezi University for 2027) with a conference secretariat (prmvai@163.com)
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI]
typical:
  deadline_months: [3, 4, 5]
  conference_months: [5, 6, 7]
links:
  website: https://www.prmvai.org/
notes:
- Listed as PRMVIA for 2023 and 2024 in the official site history; PRMVAI from 2025
- Three tracks; pattern recognition, machine vision and artificial intelligence
- 2025 proceedings published by IEEE (ISBN 979-8-3315-3643-5, 125 papers, Ei Compendex) per the publication history image on the official site
- Held in China every year (Changsha 2024, Loudi 2025, Changzhou 2026, Shihezi 2027)
- Papers at least 4 pages; papers not presented at the conference are not published
- Selected papers recommended to journal special issues (for example MDPI Electronics)
- Not listed in the CORE ICORE2026 portal or the CCF list
