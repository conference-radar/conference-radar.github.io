notes:
- Broad applied systems engineering conference (AI, IoT, networks, cybersecurity, embedded systems, control, robotics, energy, biomedical)
- Jointly organized on a rotating basis by UNLV (USA), Military University of Technology (Poland) and Toyo University (Japan)
- Recent hosts Wroclaw 2021, Tokyo 2022, Las Vegas 2023, Warsaw 2024 and 2025, Las Vegas 2026
- Proceedings in Springer Lecture Notes in Networks and Systems as Advances in Systems Engineering
- Selected papers invited to the International Journal of Electronics and Telecommunications
- "Fee: 460 USD for the first paper, 360 USD per additional paper (2026)"
- CORE C (ICORE2026); not on the CCF list
- The 2026 site calls it the 52nd edition, while the previous conferences page numbers 2025 as the 32nd ICSEng
