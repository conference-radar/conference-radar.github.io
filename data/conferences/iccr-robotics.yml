links:
  website: http://www.iccr.net/
notes:
- Control and robotics conference held since 2018 (Hong Kong 2018, Jeju 2019, virtual 2020 and 2022, Tokyo 2023, Yokohama 2024, Kyoto 2025, Tokyo 2026)
- No edition in 2021; held in Japan every year since 2023
- Proceedings of past editions are in IEEE Xplore, indexed in EI Compendex and Scopus
- 2026 edition co-sponsored by IEEE, IEEE Robotics and Automation Society and BICRI; general chairs from Hosei University and the University of Guelph
- Submission through EasyChair; a presenter-only (abstract) option exists without publication
- Onsite, online and poster sessions in 2025
- Different venue from iccr-cyber (International Conference on Cyber Resilience)
- Not listed in CORE ICORE2026 or the CCF list
