notes:
- Workshop co-located with IEEE ICC; 1st edition at ICC 2024, 2nd at ICC 2025 (Montreal, WS28), 3rd at ICC 2026 (Glasgow, WS06)
- Topics are SAGSIN architecture, mobility management, THz and FSO links, computing-aware routing, SDN and slicing, edge computing and caching, and LLM-driven optimization
- Chaired by Bomin Mao, Mostafa Fouda, Zubair Fadlullah and Fengxiao Tang
- Papers up to 6 pages in IEEE two-column format (a 7th page costs 100 USD); submissions via EDAS
- Accepted and presented papers go into the IEEE ICC workshop proceedings in IEEE Xplore; in-person presentation required (no-show papers removed)
- Not listed in ICORE2026
