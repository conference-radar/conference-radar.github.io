notes:
- Workshop on energy-efficient IoT for size, weight and power (SWaP) constrained devices, integrated sensing,
  communication and computing, with emphasis on testbeds and measurements
- WS-08 at IEEE GLOBECOM 2026 (Macau); co-chaired by Ertugrul Basar, Kun Yang, Yufei Zhao, Alessio Zappone and Guan Gui
- Short name CommSenComp-SustIOT is taken from the GLOBECOM 2026 workshop list
- Full-day program in 2026 with about 22 papers and an invited talk
- Workshop papers go into the GLOBECOM proceedings and IEEE Xplore; no-show papers are removed
- Not in the GLOBECOM 2025 workshop list
- Not listed in ICORE2026 or in the CCF 2026 list
