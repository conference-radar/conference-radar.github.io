notes:
- Annual summer conference of the Korea Computer Graphics Society, held at a resort in Korea in early July with a
  summer school just before it
- Full papers (up to 10 pages) are reviewed, possibly with a revision round, and planned for a special issue of the
  society's KCI-listed journal
- Abstracts (up to 2 pages) for new or already published work are presented as oral or poster talks
- Papers in Korean or English; ongoing research and previously published work are accepted
- Separate review and awards for papers with an undergraduate first author
- 2026 also had an AI Creative Showcase session for AI-made works, not included in the proceedings
- Not to be confused with CAD/Graphics, which the society co-hosts
- Not listed in the CORE ICORE2026 portal or the CCF list
