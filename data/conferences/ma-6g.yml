notes:
- Workshop on multiple access for 6G (RSMA, NOMA and other MA schemes, AI for MA, MA for ISAC, over-the-air computation, NTN, cell-free MIMO)
- Co-chaired in 2026 by Bruno Clerckx (Imperial College London), Jinhong Yuan (UNSW), Zhaohui Yang (Zhejiang University) and Yijie Mao (ShanghaiTech)
- Run through the IEEE ComSoc WTC RSMA special interest group, which also lists an ICC 2024 RSMA workshop
- WS25 at IEEE ICC 2026 (Glasgow), held on 28 May 2026
- Workshop papers go into the ICC proceedings and IEEE Xplore; no-show papers are removed
- Not listed in ICORE2026 or in the CCF 2026 list
