notes:
- Annual virtual security conference of VetSec, a US 501(c)(3) non-profit helping military veterans into cybersecurity careers
- Open to everyone, not only veterans; attendance can count toward CPE credits for many security certifications
- 2026 edition had two keynotes, 25+ talks of about 30 minutes and 7 workshops (technical training plus career topics)
- Talk topics included network traffic analysis, IoT exploitation, AI-driven threats and SaaS security
- Replays are posted on the VetSec YouTube channel; no papers or proceedings
- Not listed in ICORE2026 and not on the CCF list
