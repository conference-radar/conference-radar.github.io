notes:
- Organized by IARIA as part of the InfoSys congress, co-located with ICNS, ICAS, WEB, DBKDA, SIGNAL, BIOTECHNO and AIHealth (17th edition in 2027)
- Covers smart grids, green communications and networking, energy-efficient data centers, e-mobility and energy-aware computing
- Published open access in the IARIA ThinkMind library (ISSN 2308-412X); prints via Curran Associates; selected papers invited to IARIA journals
- Not ranked by CORE; IARIA events are generally regarded as low-selectivity
- Held in southern Europe (Valencia 2026, Venice 2027); IARIA deadlines are often extended
