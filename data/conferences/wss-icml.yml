notes:
- Workshop on symmetries of neural network weight spaces (loss landscapes, linear mode connectivity, model merging, weight-space learning)
- First held with ICML 2026 in Seoul
- Short name WSS taken from the OpenReview group ID; the site does not use an acronym
- Non-archival; accepted papers are public on OpenReview but there are no formal proceedings; recently published or concurrently submitted papers are allowed
- Papers up to 4 pages in ICML style, double-blind, at least three reviews each; best paper award
- Not listed in ICORE2026 and not on the CCF list
