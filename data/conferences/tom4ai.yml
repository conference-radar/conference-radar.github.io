id: tom4ai
name: ToM4AI
full_name: "Workshop on Advancing Artificial Intelligence through Theory of Mind: Bridging Human Cognition and Artificial Intelligence"
type: workshop
tier: minor
areas: [ai]
region: worldwide
language: english
frequency: annual
organizer: ToM4AI initiative (organizers from MIT, King's College London, Tufts University and University of Lincoln); co-located with AAAI
organizer_country: [usa, europe]
proceedings: arXiv proceedings volume (2025 edition, arXiv 2505.03770)
archival: false
typical:
  deadline_months: [11, 12]
  conference_months: [1, 2, 3]
links:
  website: https://tom4ai.github.io/
notes:
  - AAAI workshop on Theory of Mind in AI, bringing together cognitive science, machine learning and multi-agent systems researchers
  - 1st edition at AAAI 2025 (Philadelphia, 3 March 2025), 2nd at AAAI-26 (Singapore, 26 January 2026), 3rd at AAAI-27 (Montreal)
  - Submissions are extended abstracts of up to 2 pages (excluding references) in AAAI format, double-blind review on OpenReview
  - The 2025 proceedings (28 contributed papers) were released as an arXiv volume, an informal open access collection
  - Organizers also edit a JAAMAS special issue on the topic
  - Not listed in ICORE2026 or the CCF list
