notes:
- Workshop on cloud trust and security (TEEs, zero trust, multi-cloud privacy and compliance, AI for cloud security)
- Chaired by Farag Azzedin and Mohammad Hammoudeh (KFUPM, Saudi Arabia)
- Papers up to 6 pages in IEEE double-column format; double-blind review
- Listed as a BDCAT workshop in 2025 (Nantes) and as a UCC workshop in 2026 (Florianopolis)
- The UCC 2026 author instructions say workshop papers go to IEEE Xplore; the workshop page still carries an older ACM proceedings sentence
- Not found in the ICORE2026 CORE portal search
