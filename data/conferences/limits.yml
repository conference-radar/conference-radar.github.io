notes:
- Standalone annual workshop since 2015 on computing in a world of ecological, material and social limits (sustainability, collapse, degrowth)
- Online via Zoom since at least 2024, distributed through optional local LIMITS-hubs; attendance is free but registration is required
- Peer-reviewed papers of 5 to 10 pages in ACM double-column format without ACM copyright; reviewing is non-blind
- Papers are freely available on the workshop website and post-workshop proceedings are published on arXiv, with copyright kept by the authors
- Alternative contributions (sessions, art, stories) are accepted for open space sessions
- Not listed in CORE ICORE2026 or in the CCF 2026 list
