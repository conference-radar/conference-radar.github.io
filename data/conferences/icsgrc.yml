notes:
- Graduate research colloquium run by the IEEE Malaysia Control Systems Society chapter, part of the same yearly
  series as CSPA, ICSET, ICSPC and I2CACIS
- One-day event held in Shah Alam (Kuala Lumpur area), Malaysia; 18th edition in 2027
- Accepted papers are submitted to IEEE Xplore; the series is indexed in Scopus
- Broad scope covering control, systems engineering, communication, computer, electronics, power, signal and image
  processing, drones and remote sensing
- Double-blind review with at least 3 reviewers; similarity below 30% expected before submission
- Not listed in CORE ICORE2026 or the CCF 2026 list
