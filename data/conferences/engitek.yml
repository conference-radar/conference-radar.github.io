notes:
- Run by the Faculty of Engineering at Jordan University of Science and Technology and held in Irbid, Jordan
- Not the same venue as the Pakistani ICECT (icect-numl), which shares the full name
- Very broad engineering scope; 2026 groups tracks into electrical engineering, engineering applications, information and computing systems (AI, security, software) and paper contests
- 2025 accepted and presented papers were published in IEEE Xplore
- Papers up to 6 pages, double column; 50 USD per extra page
- 2026 edition held in hybrid mode
- Not listed in ICORE2026 or the CCF 2026 list
