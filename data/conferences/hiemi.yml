notes:
- Held in conjunction with IEEE DCOSS-IoT; 2nd edition at DCOSS-IoT 2026 in Reykjavik (Askja, University of Iceland), listed again for DCOSS-IoT 2027 in Montreal
- Formerly the International Workshop on Hybrid Internet of Everything Models for Industry 5.0
- Accepted and presented papers to be submitted to IEEE Xplore
- Workshop papers 6 pages and work-in-progress papers 4 pages including references, IEEE two-column format
- Single-blind review with at least two reviews per paper; submission via EasyChair
- DCOSS-IoT 2026 programme at a glance places HIEMI (with SmaCE and LS-NoT) on Wednesday, June 24
- Not listed in CORE ICORE2026 or the CCF 2026 list
