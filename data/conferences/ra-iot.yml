notes:
- Workshop of AINA (International Conference on Advanced Information Networking and Applications), so it follows AINA around the world
- 1st edition at AINA-2025 (Barcelona), 2nd at AINA-2026 (Wellington), 3rd at AINA-2027 (Tirana, hybrid)
- Run by Ulster University and British Telecom researchers in Northern Ireland
- Papers in Springer Lecture Notes style, submitted via EDAS; 12 pages maximum in 2027, extra fee for pages beyond 10
- Springer sends the proceedings for Scopus indexing; unpresented papers may be removed from the digital library
- Selected 2026 papers could be invited to a special issue of MDPI Sensors
- Not listed in ICORE2026 or the CCF list
