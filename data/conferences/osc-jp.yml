notes:
- Community open source event series held since 2004, over 260 events in cities across Japan from Hokkaido to Okinawa
- Each event has seminars by open source communities and sponsors plus community and company exhibit booths; no papers or proceedings
- Free to attend with registration through connpass; usually one Saturday per city
- Tokyo/Spring and Tokyo/Fall are the largest (730 visitors at Tokyo/Spring 2026, 400 at Tokyo/Fall 2026); an Online/Fall edition also runs
- Communities and companies apply to exhibit or give seminars; company exhibits require sponsorship
