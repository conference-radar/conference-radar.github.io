notes:
- Half-day workshop (WS19) at IEEE ICC 2026 on Open RAN, programmable PHY/MAC, AI/ML-driven RIC and xApps/rApps, testbeds and demos
- Organized by Chenyuan Feng (Exeter), Howard H. Yang (ZJU-UIUC), Zihan Chen and Jihong Park (SUTD) and Nikolaos Pappas (Linkoping); steering committee Tony Q.S. Quek
- First edition at ICC 2026 in Glasgow (about 19 papers in the program); not in the ICC 2025 or GLOBECOM 2025 workshop lists
- Workshop papers go into the ICC proceedings and IEEE Xplore; no-show papers are removed
- Not listed in ICORE2026 or in the CCF 2026 list
