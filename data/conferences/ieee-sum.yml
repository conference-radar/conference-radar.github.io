notes:
- IEEE Photonics Society summer meeting that hosts 4 to 7 separate topics on emerging areas of photonics, chosen each
  year from topic proposals
- Held every July at a rotating resort location (2022 Cabo San Lucas, 2023 Sicily, 2024 Bridgetown, 2025 Berlin, 2026
  Tulum, 2027 Porto)
- Submissions are 2-page papers with a 45-word abstract; accepted papers that are presented go to IEEE Xplore
- Photonics venue rather than computer science; not listed in ICORE2026 or CCF
