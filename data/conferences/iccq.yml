notes:
- One-day software engineering conference on static and dynamic analysis, program verification, language design, bug detection and maintenance
- Held in Russia, a different city each year (St. Petersburg 2023, Innopolis 2024, Ekaterinburg 2025, Novosibirsk 2026, Nizhny Novgorod 2027)
- 2026 edition held in cooperation with the A.P. Ershov Institute of Informatics Systems and the IEEE Siberian Section
- Proceedings of the 2023 and 2024 editions published in IEEE Xplore; 2025 accepted papers link to IEEE Xplore
- Very small and selective; each accepted paper gets at least three PC reviews
- Online with live YouTube stream; free registration
- Not listed in CORE ICORE2026 or the CCF 2026 list
