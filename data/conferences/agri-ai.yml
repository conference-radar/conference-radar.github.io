notes:
- Workshop on AI for agriculture (multi-source farm data, decision support, plant disease and pest detection, edge AI, responsible AI), held with AAAI
- First edition at AAAI 2026 in Singapore, second at AAAI-27 in Montreal
- Accepted papers are archived on the workshop website only, not in the AAAI proceedings
- In 2026 papers of special merit were considered for an extended version in Elsevier Pervasive and Mobile Computing
- Papers up to 6 pages including references in the AAAI format, single-blind review (OpenReview in 2026; 2027 submission site TBA)
- At least one author must present in person
- Not listed in ICORE2026 and not on the CCF list
