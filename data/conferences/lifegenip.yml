- Non-archival track for work under review or recently accepted elsewhere; not included in the proceedings
- Up to 14 pages in the ECCV 2026 template, references and appendix unlimited; submission via OpenReview
- Best Paper Award and two runner-up awards
- Not listed in ICORE2026 or the CCF list
