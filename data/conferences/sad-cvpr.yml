notes:
- Workshop on sensor simulation, traffic agent behavior modeling, closed-loop training and evaluation of autonomous vehicles
- Series started as the Workshop on Traffic Agent Modeling for Autonomous Driving Simulation at IROS 2023, then ran as the Workshop on Data-Driven Autonomous Driving Simulation (DDADS) at CVPR 2024 and CVPR 2025, renamed SAD for CVPR 2026
- 2026 had a single non-archival track for original work or papers published elsewhere, 4 to 8 pages in CVPR format
- Single-blind review on OpenReview (submissions are not anonymized)
- The CVPR 2025 edition offered archival and non-archival tracks; 2 papers appeared in the CVPR 2025 workshop proceedings on CVF Open Access under DDADS
- Not listed in ICORE2026 or the CCF list
