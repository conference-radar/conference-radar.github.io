notes:
- Series started in 2006; the 2026 edition in Taichung was the 18th
- "Proceedings: Springer Smart Innovation, Systems and Technologies, stated as EI and Scopus indexed"
- Papers not presented at the conference are excluded from the proceedings
- Tracks cover evolutionary computing, fuzzy systems, big data, computer vision and smart healthcare/AIoT
- Paper deadline was extended twice in 2026 (June 30 -> July 31 -> September 15)
- Online presentation option offered
- Not listed in the CORE ICORE2026 portal or the CCF list
