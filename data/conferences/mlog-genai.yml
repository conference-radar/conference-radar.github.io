notes:
- KDD 2025 morning workshop (8 to 12) on graph machine learning combined with generative AI and LLMs
- Non-archival, accepted papers do not appear in the KDD proceedings and are posted on the workshop website
- Papers under review or published elsewhere may be submitted
- 4 to 8 pages excluding references and appendices in ACM sigconf format, double-blind review on OpenReview
- All deadlines end of day AoE
- Not ranked in ICORE2026 and not on the CCF list
