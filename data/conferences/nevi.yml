id: nevi
name: NeVi
full_name: "Workshop on Neuromorphic Vision: Advantages and Applications of Event Cameras"
type: workshop
tier: minor
areas: [vision, ai]
region: worldwide
language: english
frequency: annual
organizer: Workshop organizers from University of Siena, University of Florence, University of Strathclyde, Dublin City University, University of Galway, Maastricht University and the Italian Institute of Technology; co-located with ECCV or ICCV
organizer_country: [europe]
proceedings: ECCV Workshops proceedings (Springer) or ICCV Workshops proceedings (CVF Open Access), regular papers only
archival: true
typical:
  deadline_months: [7, 8]
  conference_months: [9, 10]
links:
  website: https://sites.google.com/view/nevi2026
notes:
- Workshop on event cameras and neuromorphic vision (event representations, spiking neural networks, applications, hardware)
- Held at ECCV 2024 in Milan, ICCV 2025 in Honolulu and ECCV 2026 in Malmo
- Regular papers of 4 to 14 pages excluding references, double-blind review by at least two reviewers on OpenReview, published in the host conference workshop proceedings
- Abstract papers (at least 4 pages, single blind) for published or ongoing work are presented without proceedings
- Distinct from the CVPR Event-based Vision workshop (eventvision)
- Not listed in ICORE2026 or the CCF list
