notes:
- Workshop on global, distributed and hybrid work in software engineering, co-located with the XP conference
- 3rd edition at XP 2025 in Brugg-Windisch, 4th at XP 2026 in Sao Paulo
- Full papers up to 8 pages including references (Springer LNCS/LNBIP template); research and industry papers welcome
- Short industry presentations as a 2-page paper or up to 5 slides
- Full papers published in the XP post-conference proceedings; the 2025 page names Springer LNBIP open access
- 2025 required in-person presentation by at least one author
- Not listed in ICORE2026 or the CCF 2026 list
