organizer: Conference secretariat (contact icccv@umails.com) with a host university; Tianjin University of Technology and Education for 2027
organizer_country: [china]
proceedings: SPIE Digital Library (2027); ACM DL (2021 to 2026)
archival: true
indexing: [EI Compendex, Scopus, CPCI]
