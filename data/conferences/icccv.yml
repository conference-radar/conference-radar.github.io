notes:
- Smaller commercially run conference; secretariat contact via an umails.com address
- 9th edition in 2027; themes are computer vision, optical imaging and intelligent control
- Proceedings were published by ACM (ACM DL) through 2026; 2027 proceedings move to SPIE, stated as indexed by EI Compendex, Scopus and CPCI
- Double-blind review stated for 2027; full papers at least 8 pages, extra charge above 14 pages
- "Recent hosts: online 2021 (Macau planned) and 2022 (Xiamen planned), Tianjin 2024, Wuhan (Hubei University of Technology) 2025, Tsukuba (Japan) 2026, Tianjin 2027"
- Abstract-only presentation without publication is offered
- Not listed in the CORE portal (ICORE2026)
