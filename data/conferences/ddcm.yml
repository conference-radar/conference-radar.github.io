notes:
- Workshop co-located with IEEE ICC; the ICC 2026 edition in Glasgow (WS26) was the 6th
- The 5th edition ran at ICC 2025 (WS16) as the Workshop on OTFS and Delay-Doppler Multicarrier Communications for 6G
- Topics are delay-Doppler domain modulation (OTFS, ODDM, DDMC) and chirp-based modulation (OCDM, AFDM, CSS) for high-mobility links, NTN and ISAC
- Short name DDCM is used in this list only; the workshop has no official acronym
- General co-chairs Jinhong Yuan (UNSW), Hai Lin (Osaka Metropolitan University), Yi Hong (Monash) and Jingxian Wu (Arkansas); steering committee includes Lajos Hanzo and Emanuele Viterbo
- Different from the GLOBECOM workshop on Delay-Doppler Communications, Sensing and Their Integration (ddcs)
- Accepted and presented papers go into the IEEE ICC workshop proceedings in IEEE Xplore; no-show papers can be removed
- 6-page limit, submissions via EDAS through the ICC workshop call
- Not listed in ICORE2026
