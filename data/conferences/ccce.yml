typical:
  deadline_months: [3]
  conference_months: [5, 8]
links:
  website: https://www.ccce.net/
notes:
  - Annual conference since 2021; since 2023 held in a different European city each year (Stockholm, Oslo, Helsinki, Milan, Zagreb)
  - 2021 (planned for Jeju) and 2022 (planned for Rome) editions were fully virtual; 2023 to 2025 held in March or May,
    2026 and 2027 in August
  - Proceedings in Springer CCIS (2022 vol. 1630, 2023 vol. 1823, 2024 vol. 2192, 2025 vol. 2642), indexed in EI and Scopus
  - Broad scope covering computing, intelligent systems, networking, mobile computing and communication engineering
  - Organized through a conference service (contact email on 126.com) with a local university committee; 2027 chairs from
    the University of Zagreb
  - Not the same as ICCCE (IIUM, Malaysia) or CCET
  - Not listed in ICORE2026 or the CCF 2026 list
