notes:
- Small IEEE-sponsored conference on control, robotics and vision, held since 2016; listed on the IEEE conference list
- Proceedings in IEEE Xplore every year since 2016; the site states Ei Compendex and Scopus indexing
- Blind peer review via EasyChair; only full papers go into the proceedings
- Hybrid format with on-site and online sessions; about 80 to 120 participants per edition (2024 to 2026)
- Mostly held in Japan recently (Nagaoka 2023, Osaka 2024, Nagoya 2025, Kyoto 2026), moving to Hong Kong in 2027
- Contact address is a 163.com mailbox; patrons include Hohai University, Nagoya Institute of Technology and Nagaoka University of Technology
- Not ranked by CORE (not listed in ICORE2026) or CCF
