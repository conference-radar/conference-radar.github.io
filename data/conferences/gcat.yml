notes:
- Hosted by Nagarjuna College of Engineering and Technology (NCET), Bengaluru; organizing chairs are NCET department heads
- Held in Bangalore every year; editions in 2019 and every year since 2021 (7th edition in 2026)
- Proceedings of all previous editions published in IEEE Xplore; the site states Scopus indexing
- Broad EECS scope in seven tracks, from renewable energy and power electronics to AI, signal processing and communication systems
- Double-blind review through Microsoft CMT; full papers of at least 6 pages; physical conference only
- Not listed in ICORE2026; a small regional venue
