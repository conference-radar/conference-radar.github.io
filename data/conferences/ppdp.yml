notes:
- Symposium for the declarative programming communities (functional, logic, answer-set and constraint handling programming)
- Usually co-located with LOPSTR and often with ICLP (Rende 2025 with ICLP 2025 and LOPSTR 2025)
- Proceedings in the ACM Digital Library up to 2025
- 'PPDP 2025 categories: research papers up to 12 pages ACM 2-column excluding bibliography, system descriptions up to 10 pages, and experience reports'
- In 2026 it was held as a single joint LOPSTR+PPDP symposium co-located with ICFP 2026 in Indianapolis, with proceedings in Springer LNCS (also listed under LOPSTR)
- Mostly held in Europe (Lisbon 2023, Milan 2024, Rende 2025); Indianapolis in 2026
- CORE C (ICORE2026); not on the CCF 2026 list
