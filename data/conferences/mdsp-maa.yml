notes:
- Workshop W7 at IEEE VTC2026-Fall in Boston, an afternoon session; no earlier edition found
- Topics are low-complexity multidimensional signal processing and hardware for massive and multi-beam antenna arrays in 5G, 6G and vehicular networks
- Co-organized by Chamira Edussooriya (University of Moratuwa, Sri Lanka) and Chamith Wijenayake (University of Queensland)
- Papers 5 pages, up to 2 extra pages at 100 USD each; submitted through the VTC2026-Fall workshop TrackChair site
- Final papers go through the VTC2026-Fall IEEE Conference Publishing upload, for archiving in IEEE Xplore; IEEE may exclude papers not presented
- Not listed in ICORE2026
