notes:
- Organized by INSTICC; proceedings published by Springer in a CCIS series book
- Covers intelligent systems for Industry 4.0 production and logistics (cyber-physical systems, industrial IoT, robotics, AI, supply chain optimization)
- Held with WEBIST, IJCCI and IC3K; registration gives free access to the co-located events
- Two submission stages plus workshops (EI2N) and an abstracts track; all deadlines AoE
- 2026 edition hosted at the ESEO campus in Angers, France; 2027 edition in Porto, Portugal
