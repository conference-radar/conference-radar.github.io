id: icisml
name: ICISML
full_name: International Conference on Intelligent Systems and Machine Learning
type: conference
tier: minor
areas: [ai, vision, networking]
region: south-asia
language: english
frequency: annual
organizer: ICISML organizing committee with a different Indian host institution each year (PSIT Kanpur in 2027)
organizer_country: [india]
proceedings: IEEE Xplore
archival: true
acceptance_rate: 30.3% (2026, 249/823, per the official site)
typical:
  deadline_months: [6]
  conference_months: [2, 9]
links:
  website: https://icisml.com
notes:
- Host changes each edition; the 6th edition (February 2026) was at Nagaland University, Kohima and the 7th is at PSIT Kanpur
- Hybrid mode with physical and online presentations
- Accepted papers are submitted for inclusion in IEEE Xplore
- Four tracks covering image recognition, machine learning, ML applications and intelligent communication networks
- Review through Microsoft CMT
- Not listed in ICORE2026 or the CCF 2026 list
