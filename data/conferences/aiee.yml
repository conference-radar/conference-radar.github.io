links:
  website: https://www.aiee.net/
notes:
- Small conference on AI applied to electronics engineering, held since 2018 (Shanghai 2018 and 2019, Sanya 2020, virtual 2021 to 2023, Bangkok in January 2024, Hangzhou 2026)
- The 2026 edition was the 7th, sponsored by the Hangzhou International Innovation Institute of Beihang University
- Proceedings of the 2021 to 2025 editions are in the ACM Digital Library; the 2026 site only says papers go to the AIEE 2026 proceedings
- Papers at least 4 pages; abstract, research paper, case study and work in progress submissions accepted
- "Registration fee: 550 USD or 3700 CNY at the top rate (2026)"
- Not listed in CORE ICORE2026 or the CCF list
