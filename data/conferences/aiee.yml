organizer: AIEE conference secretariat with a host institution each year (Hangzhou International Innovation Institute of Beihang University in 2026)
organizer_country: [china]
proceedings: ACM DL (2018 and 2021 to 2025); 2026 publisher not named
archival: true
typical:
  deadline_months: [7]
