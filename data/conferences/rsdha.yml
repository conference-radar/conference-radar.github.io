notes:
- Workshop on heterogeneous computing that bridges HPC and embedded, mobile and edge SoCs (vertical and horizontal scaling)
- 3rd edition with SC'23 in Denver; 4th with SCA/HPCAsia 2026 in Osaka; 5th with HPCAsia 2027 in Seoul
- Full papers 10 to 18 pages in ACM single-column format go into the proceedings; short papers 4 to 8 pages
  (position and work in progress) are presented but not included in the proceedings (2026 CFP)
- SCA/HPCAsia 2026 published a separate workshop proceedings volume in the ACM Digital Library
- Submission via EasyChair; at least one author must register and attend
- Invited speakers and a panel; 2026 ran 9:30 to 16:30, 2027 is a half day (9:00 to 12:30 KST)
- Not listed in ICORE2026 or the CCF list
