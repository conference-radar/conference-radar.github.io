notes:
- Organized by RV College of Engineering, Bengaluru, India; held in Bengaluru every year (RVCE campus in 2026)
- 2026 is the 10th edition (IEEE conference 71124); collaborators listed include the IEEE Bangalore Section, IEEE
  ComSoc and several German and Danish universities
- Accepted and presented papers are submitted to IEEE Xplore
- Broad scope with themes including computing and intelligent systems, data science, AI ethics, and advanced
  electronics, communication and networking (5G/6G, IoT, Open RAN)
- Single-blind review via Microsoft CMT; up to six pages in IEEE double-column format, extra pages charged
- 'Fee (2026, early bird, incl. GST): students 5310 INR or 80 USD (IEEE member), academics 7080 INR or 100 USD'
- Not listed in ICORE2026 or the CCF list
