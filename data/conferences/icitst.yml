id: icitst
name: ICITST
full_name: International Conference for Internet Technology and Secured Transactions
type: conference
tier: minor
areas: [security, networking, ai]
region: europe
language: english
frequency: annual
organizer: Infonomics Society
organizer_country: [europe]
proceedings: ICITST proceedings (own proceedings with ISBN and DOI)
archival: true
fee: About 600 GBP (2026, early bird speaker/author; virtual presenter 450 GBP)
typical:
  deadline_months: [8, 9]
  conference_months: [11, 12]
links:
  website: https://icitst.org/
notes:
- Run by the Infonomics Society (London), which also runs the linked journals IJISR, IJICR and others
- Held in the UK almost every year since 2006; St Anne's College, Oxford since 2023 (2020 to 2022 virtual)
- Broad scope covering cyber security, Internet technologies, IoT, AI and e-business
- Double-blind review; accepts abstracts, extended abstracts (2 pages), full papers (6 pages), student papers, posters and case studies
- All accepted contributions go into the conference proceedings with ISBN and DOI; selected authors are invited to extend papers for Infonomics Society journals
- Virtual presentation is possible, with a separate later abstract deadline
- Not listed in CORE ICORE2026
