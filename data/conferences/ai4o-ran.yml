notes:
- Held as workshop W12 at IEEE VTC2026-Fall in Boston
- Topics are AI-native RAN intelligent controllers in Open RAN, cell-free MIMO, joint communication and sensing, spectrum sharing, network slicing and energy-aware operation
- Co-organizers from the University of Glasgow (UK), Stanford University (USA, including John M. Cioffi) and NUST (Pakistan)
- Separate from the ICC Open RAN workshop and the MobiCom Open and AI RAN workshop
- Papers 5 pages, up to 2 extra pages at 100 USD each; submitted through the VTC2026-Fall workshop TrackChair site
- VTC papers go to IEEE Xplore; IEEE may exclude papers not presented at the conference
- Not listed in ICORE2026
