notes:
- AAAI-27 workshop on security and privacy risks of LLMs (architecture, training, context handling, tool use, multi-agent coordination) and defenses
- Chaired by Shanu Sushmita (Northeastern University, Seattle)
- First edition; no earlier edition is mentioned
- All accepted papers are non-archival; work accepted at the AAAI-27 main track may not appear at the workshop
- Full papers up to 6 pages (oral), posters up to 4 pages, works in progress up to 2 pages, AAAI format, OpenReview
- In person at Palais des congres, Montreal
- Not listed in ICORE2026 and not on the CCF list
