notes:
- Workshop on security of critical assets in cyber-physical systems (smart grids, EVs and CAVs, UAVs, water treatment,
  IIoT, PLCs and RTUs)
- 2024 and 2025 editions were IEEE CSR workshops with papers in IEEE Xplore (London 2024, Chania 2025)
- 3rd edition in 2027 moves to ACNS at Royal Holloway; papers published by Springer in LNCS
- Anonymous submissions up to 20 pages excluding references; camera-ready up to 30 pages including references and appendices
- No 2026 edition listed on the official page
- Not listed in ICORE2026 or the CCF list
