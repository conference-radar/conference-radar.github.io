notes:
- Half-day workshop co-located with ACM IMC; first edition at IMC 2026 in Karlsruhe, Germany
- Measurement work on IP geolocation (geofeeds, geolocation databases, VPNs, CGNAT, satellite access, privacy), framed as an academic follow-up to the December 2025 IAB workshop on IP address geolocation
- Short papers up to 4 pages plus references and an optional 1-page appendix, ACM sigconf; double-blind review via HotCRP
- Camera-ready uses the ACM nonacm option and accepted papers are made available on the workshop website, so treated as non-archival
- Seven papers in the 2026 program; attendance through the standard IMC registration
- Not listed in CORE ICORE2026 or the CCF 2026 list
