notes:
- Full-day workshop held with ICPP 2026 in Singapore, run by the NVIDIA Supercomputing Users Group (NVSUG)
- Experience reports on deploying and operating supercomputers built on NVIDIA Grace-based superchips
- Short papers of 6 pages and long papers of 10 pages, including references and appendices
- Submission through the ICPP Linklings system; blind review follows the ICPP rules
- Papers published in the ICPP'26 Workshop Proceedings in the ACM Digital Library
- Co-chairs from Bristol Centre for Supercomputing, Advanced HPC-AI R&D Support Center (Japan) and Pawsey Supercomputing Research Centre
- No earlier edition is listed on the workshop page
- Not listed in CORE ICORE2026
