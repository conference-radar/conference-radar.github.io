notes:
- IARIA's broad annual congress, started in 2022
- Tracks cover learning, health, human-machine interaction, data, software, systems, cloud, networks, IoT, signal processing, robotics, AI, security, vehicles, smart cities, energy and wireless
- Published open access in the IARIA ThinkMind library; prints via Curran Associates; selected papers invited to IARIA journals
- Onsite and online participation options offered in recent editions
- Held in southern Europe (Nice 2022, Valencia 2023, Porto 2024, Venice 2025, Nice 2026, Valencia 2027), same dates and city as the DigiTech events since 2024
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
