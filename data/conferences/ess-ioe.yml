notes:
- Workshop on energy efficiency and energy self-supply for battery-powered and battery-less IoE devices in 6G
  (wireless information and power transfer, backscatter, wireless powered communications)
- WS-20 at IEEE GLOBECOM 2026 (Macau); co-chairs from UESTC, China Unicom Research Institute, CQUPT, University of
  Cyprus and Nanjing University
- Full-day program in 2026 with about 27 papers and a keynote
- Short name ESS-IoE is not used on the official pages
- Workshop papers go into the GLOBECOM proceedings and IEEE Xplore; no-show papers are removed
- Not in the GLOBECOM 2025 workshop list
- Not listed in ICORE2026 or in the CCF 2026 list
