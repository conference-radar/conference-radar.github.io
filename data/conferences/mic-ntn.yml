notes:
- Half-day workshop (WS11) at IEEE ICC 2026 on massive IoT access over satellites, HAPs and UAVs (grant-free and unsourced random access, NTN waveforms, 3GPP NTN)
- Chaired by Estefania Recayte and Andrea Munari (DLR), Zoran Utkovski (Fraunhofer HHI) and Enrico Paolini (Bologna)
- Supported by the 6G-NTN, xG-RIC and xG-byNTN projects; two industry keynotes (Sateliot, CCww) in 2026
- First edition at ICC 2026 in Glasgow; not in the ICC 2025 or GLOBECOM 2025 workshop lists
- Papers up to 6 pages; accepted and presented papers go into the ICC proceedings and IEEE Xplore
- Not listed in ICORE2026 or in the CCF 2026 list
