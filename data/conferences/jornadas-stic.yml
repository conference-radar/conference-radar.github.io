notes:
- One of Spain's largest cybersecurity conferences, run every year since 2007 by the National Cryptologic Centre (CCN, part of the CNI) in Madrid
- Held together with the Jornadas de Ciberdefensa ESPDEF-CERT and a Congreso RootedCON track of technical sessions
- Four days at the Kinepolis Ciudad de la Imagen cinemas (Pozuelo de Alarcon, Madrid), with a sponsor exhibition area
- "Talks mostly in Spanish; registration fills up (over 9,000 in-person attendees in 2025, over 8,500 registration requests in 2026)"
- Talk presentations are collected in a Ponencias section of the official site; no call for papers with formal proceedings
- International chapters are held in Latin America (Colombia, Panama, Dominican Republic)
