notes:
- Organized by Xiaoyi Lu (University of Florida), Xiaodong Yu (Stevens Institute of Technology) and Zhaorui Zhang (Hong Kong Polytechnic University)
- Half-day workshop held with ICPP 2026 (International Conference on Parallel Processing) in Singapore
- Data compression for LLM training, fine-tuning and inference, HPC data movement and hardware co-design (GPUs, FPGAs, CXL, PIM)
- Accepted papers published in the ACM Digital Library; extended versions can go to the collaborating journal Electronics
- Full papers up to 10 pages and short papers up to 6 pages including references, ACM format, at least 3 reviewers, submitted via the ICPP Linklings system
- USD 200 awards for the best full paper and best short paper
- Not listed in ICORE2026 (portal search returns no results) or the CCF 2026 list
