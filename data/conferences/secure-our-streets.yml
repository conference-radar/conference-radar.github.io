notes:
- One-day online conference on automotive security and privacy, run by the non-profit ASRG since 2022 (5th edition in 2026)
- Free to attend; audience of OEMs, suppliers, researchers, regulators and policy makers
- "Speakers submit an anonymized extended abstract of at least two pages, reviewed by a CFP review committee (EasyChair)"
- Presentations must be pre-recorded; no commercial content
- Talks and slides are posted in the SOS archive and on YouTube; no papers or proceedings
- Topics include vehicle SOC, ISO/SAE 21434 and UN R155, V2X, EV charging, PQC and hardware security
- Not listed in ICORE2026 and not on the CCF list
