notes:
- Organized annually at the FAST-NUCES (National University of Computer and Emerging Sciences) Chiniot-Faisalabad
  Campus, Pakistan
- Proceedings of the 2022, 2023, 2024 and 2026 editions are in IEEE Xplore, as listed on the site's history page
- Tracks on smart computing and optimization, communication and signal processing, green and sustainable technologies,
  intelligent systems, and fintech and blockchain
- Up to 6 pages in IEEE two-column format; submission via Microsoft CMT
- Not to be confused with the Jordanian ICIT (International Conference on Information Technology, icit-jo)
- Not listed in ICORE2026 or the CCF 2026 list
