notes:
- Sponsored by the IEEE Sensors Council; held since 2019 (Glasgow), virtual in 2020 and 2021
- Recent hosts 2022 Vienna, 2023 Boston, 2024 Tampere, 2025 Singapore, 2026 Atlanta, 2027 Cambridge (UK)
- Covers flexible, printable and stretchable sensors and electronics, printed manufacturing, wearable and
  implantable systems, flexible ICs, and applications in IoT, AI and robotics
- "Two paper routes: Option A is a paper of up to 4 pages in the FLEPS proceedings; Option B is a fast-track
  submission to the journal IEEE Sensors Letters (earlier deadline)"
- Accepted papers must be presented by a registered author or IEEE may remove them from IEEE Xplore
- 2027 general co-chairs from Loughborough University and Pragmatic Semiconductors; held at the Ray Dolby Centre,
  Cavendish Laboratory, University of Cambridge
- Not found in the ICORE2026 CORE portal search
