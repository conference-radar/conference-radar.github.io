notes:
- Workshop on the RISC-V hardware and software ecosystem with emphasis on HPC, edge computing and AI/ML, co-located with the biennial PPAM conference
- First edition at PPAM 2024 in Ostrava (September 9, 2024); second at PPAM 2026 in Poznan
- Chaired by Roman Wyrzykowski (Czestochowa University of Technology); technical cooperation with Barcelona Supercomputing Center, EPCC Edinburgh, InspireSemi, E4 Computer Engineering and Semidynamics
- Full papers up to 15 pages in LNCS style, or 2-page abstracts for presentation only
- Presented papers appear in the PPAM proceedings, published by Springer in LNCS after the conference
- Best paper award of 500 euros and an award of 400 euros for the best RVA23-related paper (2026)
- Not listed in CORE ICORE2026
