notes:
- Grassroots Kiwi hacker con in a camping format on a sheep station in the Wairarapa, about 2.5 hours drive from Wellington
- Capped at 50 people, R18, catered, no internet or cellphone reception at the venue
- Held under TLP:RED, so talks are not published; AI use in a talk must be disclosed
- Call for papers with speaker notification about a month later; first edition in December 2026
