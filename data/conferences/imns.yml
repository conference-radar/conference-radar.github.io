notes:
- 2026 edition technically co-sponsored by IEEE and IEEE ComSoc, with Kennesaw State University as co-sponsor
- Papers appear in the IMNS proceedings and IEEE Xplore; at least one author must register at the full or limited rate and present
- Papers up to 6 pages in 10 point font via EDAS, 2 extra pages at 100 USD each in the final version
- Covers intelligent multimedia, 5G/6G and edge networking, security and privacy, AI-driven network management
- 2025 Qingdao, China; 2026 Atlanta, USA
- Not listed in ICORE2026; not on the CCF 2026 list
