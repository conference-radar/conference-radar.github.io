id: klartext
name: KlarText
full_name: KlarText Workshop on German Text Simplification & Readability Assessment
type: workshop
tier: minor
areas: [nlp]
region: europe
frequency: annual
organizer: Workshop organizers from Heidelberg University, ETH Zurich (SDSC), HAW Hamburg and Bielefeld University (co-located workshop of KONVENS)
organizer_country: [europe]
proceedings: ACL Anthology
archival: true
typical:
  deadline_months: [6, 7]
  conference_months: [9]
links:
  website: https://klar-text.github.io/
notes:
- Workshop of KONVENS (Conference on Natural Language Processing, German-speaking NLP community); held since 2025
- Topics are German text simplification, readability assessment, Leichte Sprache (Easy Language) and plain language, evaluation and applications
- Long papers 8 pages, short papers 4 pages, ACL style, double-blind review via OpenReview
- Accepted papers are archival and published in the ACL Anthology
- Also takes papers already reviewed in ARR or by KONVENS through a separate later deadline
- In person only; half-day workshop with keynote and poster session
- Not listed in CORE ICORE2026 or the CCF list
