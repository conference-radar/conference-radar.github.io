id: icint
name: ICINT
full_name: International Conference on Information and Network Technologies
type: conference
tier: minor
areas: [networking, communications]
region: asia-pacific
language: english
frequency: annual
organizer: La Trobe University (sponsor), with University of the Ryukyus as technical supporter and IEEE as technical sponsor
organizer_country: [australia, japan]
proceedings: IEEE Xplore
archival: true
indexing: [Scopus, EI]
typical:
  deadline_months: [12]
  conference_months: [3]
links:
  website: https://www.icint.org/
notes:
- Annual since 2017; the 2027 edition is the 12th
- Proceedings in IEEE Xplore (2022 and 2023 through CPS, 2025 and 2026 published by IEEE), indexed in Scopus
- Held virtually 2021 to 2023, in Tokyo in 2024 (co-sponsored by Kogakuin University), in Melbourne in 2025 and in Sydney in 2026
- Covers information and network technologies broadly (networking, wireless, security, applications)
- Submission via the zmeeting system; small conference with keynotes from IEEE Fellows
- Not listed in the ICORE2026 portal or the CCF 2026 list
