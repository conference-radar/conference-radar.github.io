notes:
- NeurIPS workshop on attributing model behavior to training data, model components and algorithms (data attribution and provenance)
- Editions at NeurIPS 2023, 2024 and 2026 (none in 2025)
- Non-archival; previously published papers may be submitted
- Main track 3 to 6 pages and idea track 2 to 4 pages, double-blind on OpenReview
- Reciprocal reviewing; one author per submission must review up to 2 papers or the paper may be desk rejected
- Not listed in ICORE2026 and not on the CCF list
