notes:
- Communication systems conference held in Vienna, Austria every year since 2021, organized by FH JOANNEUM
- Not the same venue as ICECCS (Engineering of Complex Computer Systems)
- Proceedings for 2022 to 2025 in IEEE Xplore; the 2027 site names no publisher and says only EI Compendex and Scopus indexing
- Papers 4 to 10 pages; one regular registration covers 5 pages, extra pages 50 USD each
- Submission through the zmeeting.org system; abstract-only presentations allowed but not published
- Not listed in the CORE ICORE2026 portal or the CCF list
