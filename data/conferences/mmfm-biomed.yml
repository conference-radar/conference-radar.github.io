notes:
- CVPR workshop on multimodal foundation models for biomedicine, with tracks on current challenges and on opportunities such as drug discovery and surgery
- 1st edition at CVPR 2025 (Nashville), 2nd at CVPR 2026 (Denver, half day)
- Non-archival short papers up to 4 pages excluding references in the CVPR template, submitted via OpenReview
- Selected papers presented as posters, four get spotlight oral talks
- Different from MMFM (What is Next in Multimodal Foundation Models)
- Not on the CCF list
