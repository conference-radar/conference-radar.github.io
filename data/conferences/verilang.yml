notes:
- Organized by researchers from Universidad de los Andes, Pontificia Universidad Javeriana (Colombia), University of Bologna and IMDEA Software Institute
- New workshop in 2026 (1st edition), co-located with ECOOP 2026 at Vrije Universiteit Brussel
- Cross-community forum on verification languages and proof assistants (Coq, Lean, Agda, Athena, Liquid Haskell, Maude, ...)
- Papers published open access in the ACM Digital Library as part of the ECOOP-C'26 proceedings; ECOOP pays the APCs
- Full papers up to 12 pages and short papers up to 6 pages, excluding references, ACM sigplan format, via EasyChair
- Program includes a Verification Challenge solved with the participants' languages of choice
- Not listed in ICORE2026 (portal search returns no results) or the CCF 2026 list
