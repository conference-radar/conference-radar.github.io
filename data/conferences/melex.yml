notes:
- Computer vision workshop for explorative papers with new ideas that are competitive but not state of the art
- Targets unpublished papers previously rejected from main conferences for not beating SOTA; submissions include a one-page letter on the paper's review history
- Editions with ICCV 2021, ECCV 2024 and ECCV 2026 (3rd)
- Accepted papers published in the ECCV workshop proceedings
- Small workshop; 3 accepted papers in 2026
- Not listed in ICORE2026 and not on the CCF list
