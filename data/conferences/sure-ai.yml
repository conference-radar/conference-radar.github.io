notes:
- Half-day workshop on sustainable and resource-efficient AI, first held at IJCAI-ECAI 2026 in Bremen (WS38)
- Not the same venue as SURE, the Workshop on Software Understanding and Reverse Engineering (sure.yml)
- Full papers (7 pages plus 2 of references) are archival in CEUR-WS (2026 -> Vol-4275); short papers (4+1 pages) could opt in, position papers (2+1 pages) are non-archival
- Double-blind review
- 2026 -> 8 papers accepted out of 27 submitted (CEUR-WS Vol-4275)
- Not listed in ICORE2026 or the CCF list
