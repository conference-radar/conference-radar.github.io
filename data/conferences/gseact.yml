notes:
- Run by the Hyderabad Institute of Technology and Management (HITAM), an engineering college in Medchal near Hyderabad, India
- Broad EECS scope (communication and networking, circuits and devices, power systems and electric vehicles, computing, electromagnetics, robotics and control, signal processing)
- 2026 edition held hybrid (in person at HITAM and online); proceedings published by IEEE (ISBN 979-8-3195-0991-8)
- Full papers up to 6 pages in IEEE format, at most five authors per paper and two papers per person; submissions with more than 15% similarity are rejected
- Not listed in the CORE ICORE2026 portal or the CCF list
