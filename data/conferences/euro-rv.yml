notes:
- Half-day workshop on hardware-software co-design for RISC-V (HPC chiplets, vector and AI units, matrix extensions)
- Run by BSC and IMEC as technical partners of the EuroHPC DARE project (Digital Autonomy with RISC-V in Europe)
- Co-located with MICRO 2026 in Athens; first edition found
- Submissions up to 2 pages excluding references in the MICRO template via EasyChair, single-blind; demos encouraged, posters for work in progress
- Slides and posters are archived on the workshop website only; no formal proceedings found
- Not listed in CORE ICORE2026 or the CCF list
