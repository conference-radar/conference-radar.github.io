notes:
- Held as workshop W14 at IEEE VTC2026-Fall in Boston
- Topics are generative AI for drone and ground robot networks (scenario synthesis, path planning, synthetic training environments, embodied intelligence)
- Organizers from Xi'an Jiaotong-Liverpool University, NUPT, XUPT and Shanghai University (China) and the University of Sheffield (UK)
- Papers 5 pages, up to 2 extra pages at 100 USD each; submitted through the VTC2026-Fall workshop TrackChair site
- VTC papers go to IEEE Xplore; IEEE may exclude papers not presented at the conference
- Not listed in ICORE2026
