notes:
- Annual since 2019 and held in Shenyang, China, every July; 2027 is the 9th edition
- Covers power systems, intelligent computing (AI, machine learning, computer vision, control) and systems
- 2019 to 2023 proceedings are in IEEE Xplore and indexed in EI Compendex (139 to 236 papers per year)
- Papers of 4 to 6 pages in IEEE format, up to 6 extra pages at 50 USD each
- Sponsors listed as IEEE and Suzhou University of Technology; same conference secretariat contact as ICPECA
- Not listed in CORE ICORE2026
