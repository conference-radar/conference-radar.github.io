notes:
  - NeurIPS workshop on on-device foundation models under compute, memory, energy, latency and connectivity constraints
  - Topics include compression and quantization, efficient adaptation and inference, embodied and multimodal on-device AI, private local execution and benchmarks
  - Held at NeurIPS 2026, ICC Sydney (room MR C3.6), 12 December 2026
  - Non-archival with double-blind review on OpenReview
  - Short papers up to 5 pages in NeurIPS style, references and appendix excluded
  - In-person workshop; at least one author of each accepted paper is expected to present in Sydney
  - Not listed in ICORE2026 or the CCF list
