notes:
- Workshop co-located with ICWE (International Conference on Web Engineering), held with it every year since 2021
- 6th edition on June 9, 2026 in Lyon, France; earlier editions in Biarritz 2021 (virtual), Bari 2022, Alicante 2023, Tampere 2024 and Delft 2025
- Focus on big data driven services on edge and cloud infrastructures
- Full papers up to 12 pages and short or demo papers up to 6 pages in Springer LNCS format via EasyChair
- Accepted papers appear in the ICWE workshop post-proceedings in Springer CCIS
- Selected papers invited to a special issue of the Journal of Web Engineering
- 2026 program (shared with the ATLAS workshop) had a keynote, eight paper talks (six BECS, two ATLAS) and two BECS posters
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
