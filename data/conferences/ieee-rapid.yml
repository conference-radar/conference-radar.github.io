notes:
- IEEE Photonics Society conference on photonics, electromagnetics, device physics, algorithms, and test and evaluation
  for defense and security applications
- Held every year in Miramar Beach, Florida, USA (2018 to 2027)
- Topics include EO/IR and LADAR, RF photonics, quantum photonics, metamaterials, imaging and sensing, and photonic AI
  hardware
- Submissions are 2-page papers with a 45-word abstract; accepted papers that are presented go to IEEE Xplore
- Do not confuse with the RaPID workshop (file rapid) or RAPIDO (file rapido)
- Defense photonics venue rather than computer security; not listed in ICORE2026 or CCF
