links:
  website: https://www.icoailo.org/
notes:
- Run by Telkom University (Bandung, Indonesia); 2025 co-organized by Politeknik Penerbangan Indonesia Curug and the BINUS Doctor of Computer Science Program
- First edition in 2025 at Telkom University, Bandung; ICoAILO 2025 proceedings in IEEE Xplore; 2026 papers submitted to IEEE Xplore
- Tracks on machine learning systems, optimization, cyber security, AI applications and smart and secure aviation
- Reviewed by 2 to 3 reviewers; EDAS submission; papers up to 6 pages
- Hybrid; online presentation allowed at a lower fee
- Not listed in the CORE ICORE2026 portal or the CCF list
