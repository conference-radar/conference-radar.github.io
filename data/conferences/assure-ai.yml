notes:
- Co-located with IEEE SANER (Software Analysis, Evolution and Reengineering); 2027 edition at SANER 2027 in Richmond, Virginia
- Topics are security assurance of code and software produced with AI assistants
- Accepted papers expected in the IEEE SANER companion proceedings
- Full papers up to 8 pages; short, position, tool, dataset, benchmark and industry papers up to 4 pages
- Double-anonymous review following the SANER guidelines; submission through the SANER 2027 tracks EasyChair
- Organizing chairs from Florida Polytechnic University (USA), KFUPM (Saudi Arabia) and IBM Research
