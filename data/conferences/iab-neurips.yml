notes:
  - NeurIPS workshop on human-centered interpretation of what AI agents do and how they interact with humans
  - 1st edition at NeurIPS 2026, ICC Sydney, 12 December 2026
  - Non-archival; submissions on OpenReview with NeurIPS-style formatting and double-blind review
  - Long papers up to 9 pages and short papers up to 4 pages, plus references and unlimited appendix
  - Second route for NeurIPS 2026 papers (accepted or rejected) submitted with their NeurIPS reviews
  - Hosts the GLEE competition on agents in language-based economic games, with a competition paper track
  - "Received 260 direct submissions in 2026 (221 main track, 39 competition track)"
  - Not listed in ICORE2026 or the CCF list
