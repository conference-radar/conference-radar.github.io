notes:
- Started in 2019 in Xi'an as a workshop of HP3C; no 2025 edition listed in the official history
- Held in China (Jinan 2023, Guangzhou 2024, Jinan 2026 at the National Supercomputer Center, Haikou 2027)
- Proceedings in IEEE Xplore for 2020, 2021, 2022, 2024 and 2026, indexed by Ei Compendex and Scopus
- Best Paper, Best Student Paper and Best Presentation awards
- Not listed in the CORE ICORE2026 portal or the CCF list
