notes:
- Workshop on model-driven engineering for digital health and healthcare systems, co-located with MODELS
- First edition in 2026 with MODELS 2026 in Malaga
- Accepted papers go into the MODELS 2026 Companion proceedings published by ACM
- Regular papers up to 10 pages and position papers up to 5 pages, ACM sigconf format
- Single-blind review with at least three PC members per paper; in-person presentation required
- Not listed in the CORE portal (ICORE2026)
