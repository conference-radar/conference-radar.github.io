notes:
- EACL workshop on NLP for democratic processes (deliberation, debate summarization, preference aggregation,
  political and parliamentary NLP, fairness of political NLP systems), with social science input
- 1st edition at EACL 2027 in Athens, one day, hybrid
- Archival long papers (8 pages) and short papers (4 pages) appear in the workshop proceedings; non-archival
  extended abstracts (4 pages) are also accepted
- Double-blind review on OpenReview; direct submission or commitment of ACL Rolling Review papers; ACL templates
- Includes a shared task with system description papers
- Not listed in ICORE2026 or the CCF list
