notes:
- Annual conference of the Cray User Group, a non-profit, self-governing international organization of member
  sites running HPE and Cray HPC systems, independent of HPE; founded in 1978
- User group conference, so HPC operations and experience reports dominate; borderline for academic research
- Selected CUG 2027 papers published in the ACM International Conference Proceedings Series (ICPS), with an
  ACM Open article processing charge for some authors; 2013 to 2025 proceedings hosted on cug.org
- "Submission types: paper, presentation, lightning talk, BoF and tutorial; only papers go to ACM ICPS"
- "Hosted by a member site each year: NERSC (2022), CSC Finland (2023), Stony Brook IACS (2025), CINES (2026),
  ExxonMobil (2027)"
