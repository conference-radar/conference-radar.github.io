notes:
- Workshop W4 at IEEE VTC2026-Fall in Boston; no earlier edition found
- Topic is device-centric cooperation by MIMO or relaying with frequency conversion, using long-wavelength bands for 6G
- Co-organized by Hidekazu Murata (Yamaguchi University), Hiraku Okada (Meijo University) and Yukitoshi Sanada (Keio University)
- Papers 5 pages, up to 2 extra pages at 100 USD each; submitted through the VTC2026-Fall workshop TrackChair site
- Final papers go through the VTC2026-Fall IEEE Conference Publishing upload, for archiving in IEEE Xplore; IEEE may exclude papers not presented
- Not listed in ICORE2026
