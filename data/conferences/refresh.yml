notes:
- Held in conjunction with IEEE DCOSS-IoT; 6th edition at DCOSS-IoT 2026 in Reykjavik, listed again for DCOSS-IoT 2027 in Montreal
- Real-life modeling of 5G/6G networks; supported by the 6G-LEADER Horizon Europe project
- Papers in the DCOSS-IoT conference proceedings, submitted to IEEE Xplore
- Full papers up to 8 pages and work-in-progress papers up to 4 pages including figures and references
- Not double-blind; author names must appear; submission via EasyChair
- Selected papers may be considered for a journal special issue
- DCOSS-IoT 2026 programme at a glance places REFRESH on Monday, June 22
- Not listed in CORE ICORE2026 or the CCF 2026 list
