notes:
- INSTICC conference on biomedical electronics, sensors, wearable and implantable devices; one of the conferences of the BIOSTEC joint conference
- Proceedings in the SCITEPRESS Digital Library, submitted for indexing by Scopus, DBLP, EI and Web of Science
- Selected revised and extended papers appear in the BIOSTEC Revised Selected Papers volume of Springer CCIS
- Two submission stages plus late-breaking and abstracts tracks; all deadlines AoE
- 2027 is the 20th BIOSTEC, run at two venues, Valletta (Feb 19 to 21) and Nanjing, China (May 14 to 16); remote talks allowed only for Malta
- Registration gives free access to the other BIOSTEC conferences and to ICORES, MODELSWARD and ICPRAM in 2027
- Not listed in CORE ICORE2026
